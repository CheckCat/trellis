# Bundled into the runtime image (see Dockerfile) at
# /etc/nginx/conf.d/default.conf, replacing the stock nginx:alpine default
# server block.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) re-resolves `backend` on every TTL
    # expiry instead of once at config-parse time. Without this, nginx
    # resolves the literal name `backend` a single time when the worker
    # starts and caches that IP forever — recreating the backend container
    # (rebuild, crash recovery, the future launch script) gives it a new IP,
    # and this nginx keeps proxying to the old, now-dead one: every
    # /api/ request 502s while nginx's own healthcheck (which only checks
    # nginx itself, not the proxy target) stays green. See final-review
    # fixes report (Critical) for the reproduction.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A handful of baseline security headers: task 013 will render Markdown
    # from course packages the user downloaded from somewhere, so locking
    # this down now (while the config is still small and easy to reason
    # about) is cheaper than retrofitting it later. CSP is scoped to what
    # the Vite production build actually emits (external hashed <script
    # type="module"> / <link rel="stylesheet">) — verified by loading the
    # built app and checking for CSP violations, not just "header is
    # present".
    #
    # `style-src` is the one deliberate exception: it must carry
    # 'unsafe-inline'. CodeMirror (the practice SQL editor) ships no CSS
    # file — it builds its stylesheet at runtime and inserts it as a
    # <style> element, which a bare `style-src 'self'` blocks outright. The
    # damage is not cosmetic: without that stylesheet the line-number gutter
    # covers the contenteditable area and the editor stops accepting input
    # altogether. scripts/csp-codemirror.test.mjs pins this and explains the
    # full diagnosis; a nonce-based alternative was considered and rejected
    # as too many moving parts (per-request sub_filter + no-cache on
    # index.html) for a container that has to "just work" for someone whose
    # only install step was Docker Desktop.
    #
    # The residual risk is low and bounded: injecting CSS requires injecting
    # markup, and the app never renders raw HTML — course Markdown goes
    # through react-markdown with no rehype-raw and no
    # dangerouslySetInnerHTML anywhere (asserted by Markdown.test.tsx) — and
    # the whole stack is reachable from localhost only. `script-src` stays
    # strictly 'self': executing code from a course package remains
    # forbidden.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The app updates by rebuilding images, and Vite's bundle names carry a
    # content hash — so a new index.html points at new files, and the old
    # ones are simply not in the new image. Without an explicit
    # Cache-Control, nginx sends only ETag/Last-Modified and browsers fall
    # back to heuristic caching: after an update they keep serving the old
    # page from cache without asking, which means "I rebuilt and nothing
    # changed" at best and a blank screen at worst (the cached page requests
    # bundles that no longer exist). Stale response headers come along for
    # the ride too — that is how the CSP fix above first appeared not to
    # work.
    #
    # `no-cache` still lets the browser store the response; it just has to
    # revalidate, so unchanged files cost a 304. Hashed assets could be
    # cached aggressively instead, but this app is served over loopback
    # where that buys nothing, and a separate `location` for them would hit
    # the add_header footgun that scripts/frontend-nginx.test.mjs guards.
    add_header Cache-Control "no-cache" always;

    # In dev, Vite's own proxy (vite.config.ts) forwards /api -> backend and
    # strips the prefix. In the container there is no Vite dev server, so
    # nginx does the same job: `backend` resolves via the compose network
    # (service name), port 3001 is the backend's contracted listen port
    # (task-003). `set $upstream` + `rewrite ... break` (instead of a bare
    # `proxy_pass http://backend:3001/;`) is required *because of* the
    # `resolver` directive above: once proxy_pass's target is a variable,
    # nginx re-resolves it per-request instead of once at startup — but a
    # variable in proxy_pass also disables its usual "trailing slash strips
    # the matched location prefix" behavior, so the /api/ prefix has to be
    # stripped explicitly via rewrite instead (matching the dev-proxy
    # behaviour exactly: GET /api/health -> GET /health upstream).
    location /api/ {
        set $upstream backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file route (client-side routing, task 011+)
    # resolves to index.html instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
