# Bundled into the runtime image (see Dockerfile) at
# /etc/nginx/conf.d/default.conf, replacing the stock nginx:alpine default
# server block.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # In dev, Vite's own proxy (vite.config.ts) forwards /api -> backend and
    # strips the prefix. In the container there is no Vite dev server, so
    # nginx does the same job: `backend` resolves via the compose network
    # (service name), port 3001 is the backend's contracted listen port
    # (task-003). The trailing slash on both `location` and `proxy_pass`
    # strips the /api prefix before forwarding, matching the dev-proxy
    # behaviour exactly (GET /api/health -> GET /health upstream).
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file route (client-side routing, task 011+)
    # resolves to index.html instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
