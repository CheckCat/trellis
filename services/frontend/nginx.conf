# Bundled into the runtime image (see Dockerfile) at
# /etc/nginx/conf.d/default.conf, replacing the stock nginx:alpine default
# server block.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) re-resolves `backend` on every TTL
    # expiry instead of once at config-parse time. Without this, nginx
    # resolves the literal name `backend` a single time when the worker
    # starts and caches that IP forever — recreating the backend container
    # (rebuild, crash recovery, the future launch script) gives it a new IP,
    # and this nginx keeps proxying to the old, now-dead one: every
    # /api/ request 502s while nginx's own healthcheck (which only checks
    # nginx itself, not the proxy target) stays green. See final-review
    # fixes report (Critical) for the reproduction.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A handful of baseline security headers: task 013 will render Markdown
    # from course packages the user downloaded from somewhere, so locking
    # this down now (while the config is still small and easy to reason
    # about) is cheaper than retrofitting it later. CSP is scoped to what
    # the Vite production build actually emits (external hashed <script
    # type="module"> / <link rel="stylesheet">, no inline scripts or inline
    # style attributes anywhere in the app) — verified by loading the built
    # app and checking for CSP violations, not just "header is present".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # In dev, Vite's own proxy (vite.config.ts) forwards /api -> backend and
    # strips the prefix. In the container there is no Vite dev server, so
    # nginx does the same job: `backend` resolves via the compose network
    # (service name), port 3001 is the backend's contracted listen port
    # (task-003). `set $upstream` + `rewrite ... break` (instead of a bare
    # `proxy_pass http://backend:3001/;`) is required *because of* the
    # `resolver` directive above: once proxy_pass's target is a variable,
    # nginx re-resolves it per-request instead of once at startup — but a
    # variable in proxy_pass also disables its usual "trailing slash strips
    # the matched location prefix" behavior, so the /api/ prefix has to be
    # stripped explicitly via rewrite instead (matching the dev-proxy
    # behaviour exactly: GET /api/health -> GET /health upstream).
    location /api/ {
        set $upstream backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file route (client-side routing, task 011+)
    # resolves to index.html instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
