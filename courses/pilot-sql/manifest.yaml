id: pilot-sql
version: 1.3.0
title: "Основы SQL: работа с таблицей книг"
description: "Пилотный курс для обкатки платформы: SELECT, WHERE и изменение данных на примере небольшой таблицы книг."
sandboxes:
  - id: main
    type: postgres
    seed:
      - sandbox/seed.sql
modules:
  - id: intro
    title: "Введение в SQL"
    lessons:
      - id: what-is-sql
        title: "Что такое SQL"
        content: lessons/what-is-sql.md
      - id: select-basics
        title: "SELECT: выбираем данные"
        content: lessons/select-basics.md
        quiz:
          question: "Какая команда SQL используется, чтобы получить (выбрать) данные из таблицы?"
          options:
            - id: select
              text: "SELECT"
              correct: true
            - id: insert
              text: "INSERT"
              explanation: "INSERT используется, чтобы добавить новые строки в таблицу, а не прочитать существующие."
            - id: delete
              text: "DELETE"
              explanation: "DELETE используется, чтобы удалить строки из таблицы, а не прочитать их."
      - id: practice-instock
        title: "Практика: книги в наличии"
        content: lessons/practice-instock.md
        practice:
          sandbox: main
          prompt: "Напишите запрос, который выбирает название (title) и автора (author) всех книг, которые сейчас есть в наличии (in_stock = true)."
          # SELECT ничего не меняет в базе, поэтому check-запрос по
          # состоянию здесь бесполезен: задание проверяется сравнением
          # результата с эталонным запросом. Порядок строк не задан
          # условием — ordered: false (значение по умолчанию, выписано
          # явно, потому что это часть условия задания).
          expected: "select title, author from books where in_stock = true"
          ordered: false
  - id: filtering
    title: "Фильтрация и изменение данных"
    lessons:
      - id: where-clause
        title: "WHERE: фильтруем строки"
        content: lessons/where-clause.md
        quiz:
          question: "Что делает условие в запросе SELECT * FROM books WHERE in_stock = true;?"
          options:
            - id: filter
              text: "Оставляет в результате только строки, где in_stock равно true"
              correct: true
            - id: sort
              text: "Сортирует результат по полю in_stock"
              explanation: "За сортировку отвечает ORDER BY, а не WHERE — WHERE не меняет порядок строк, а отбирает их."
            - id: no-effect
              text: "Ничего не меняет — WHERE работает только в INSERT и UPDATE"
              explanation: "WHERE точно так же работает и в SELECT: он ограничивает набор возвращаемых строк по условию."
      - id: practice-add-book
        title: "Практика: добавить книгу"
        content: lessons/practice-add-book.md
        practice:
          sandbox: main
          prompt: "Добавьте в таблицу books новую книгу: title = 'Мастер и Маргарита', author = 'Михаил Булгаков', published_year = 1967, in_stock = true."
          # Зачёт по состоянию всей песочницы: движок выполнит это решение
          # на засеянной базе, запрос ученика — на такой же, и сравнит
          # результат целиком. Поэтому здесь не нужен check: «добавил, но
          # заодно снёс три другие книги» не пройдёт само собой, без
          # единого дополнительного условия в манифесте.
          solution: "insert into books (title, author, published_year, in_stock) values ('Мастер и Маргарита', 'Михаил Булгаков', 1967, true)"
      - id: practice-update-stock
        title: "Практика: обновить статус книги"
        content: lessons/practice-update-stock.md
        practice:
          sandbox: main
          prompt: "Отметьте книгу с id = 1 («Война и мир») как отсутствующую в продаже: обновите in_stock на false."
          # Раньше здесь стоял check по одной книге — и `update books set
          # in_stock = false` без WHERE проходил его: книга 1 действительно
          # становилась false, а испорченные заодно четыре строки check не
          # интересовали. Сравнение состояния ловит это без всяких оговорок.
          solution: "update books set in_stock = false where id = 1"
      - id: practice-by-year
        title: "Практика: книги по году издания"
        content: lessons/practice-by-year.md
        practice:
          sandbox: main
          prompt: "Напишите запрос, который выбирает название (title) и год издания (published_year) всех книг, отсортированные по году издания от самой старой к самой новой."
          # Порядок строк здесь — часть правильного ответа (иначе ORDER BY
          # в задании был бы декоративным), поэтому ordered: true.
          expected: "select title, published_year from books order by published_year"
          ordered: true
      - id: self-check-books
        title: "Проверьте себя: что вы знаете о таблице books"
        content: lessons/self-check-books.md
        practice:
          # Задание без песочницы: ученик считает сам (где угодно) и
          # вписывает результат, движок сверяет его с эталоном. Проверяется
          # результат, не процесс.
          type: answer
          prompt: "Впишите значения, которые у вас получились по таблице books из seed курса."
          fields:
            - id: in-stock-count
              label: "Сколько книг сейчас в наличии (in_stock = true)?"
              kind: number
              expected: 3
            - id: oldest-title
              label: "Название самой старой книги (наименьший published_year)"
              kind: text
              expected: "Евгений Онегин"
            - id: average-year
              label: "Средний год издания всех книг"
              kind: number
              # (1869 + 1866 + 1862 + 1833 + 1842) / 5 = 1854.4
              expected: 1854.4
              tolerance: 0.5
      - id: wrap-up
        title: "Что дальше"
        content: lessons/wrap-up.md
