# План курса «Основы SQL»: какие умения он строит, в каком порядке и чем
# проверяется каждый урок.
#
# Движок этот файл не читает — он нужен только линту
# (`npm run course:lint -- courses/pilot-sql`), который сверяет план с
# manifest.yaml и с возможностями движка. Формат описан в courses/README.md.
version: 1

skills:
  - id: read-table
    title: "Понимать, что такое таблица, строка и столбец"
  - id: select-columns
    title: "Выбрать нужные столбцы запросом SELECT"
    requires: [read-table]
  - id: filter-rows
    title: "Отобрать строки условием WHERE"
    requires: [select-columns]
  - id: order-rows
    title: "Задать порядок строк через ORDER BY"
    requires: [select-columns]
  - id: insert-row
    title: "Добавить строку в таблицу через INSERT"
    requires: [read-table]
  - id: update-row
    title: "Изменить существующие строки через UPDATE с условием"
    requires: [filter-rows]
  - id: read-own-result
    title: "Прочитать собственный результат и сформулировать вывод по нему"
    requires: [filter-rows, order-rows]

# Словарь курса: какое слово вводит какой урок. Линт читает тексты уроков
# и не даёт употребить термин раньше, чем курс его объяснил; `grants`
# добавляет к этому проверку заданий — если эталонное решение опирается на
# конструкцию, объяснённую позже, задание нерешаемо тем, что курс уже дал.
terms:
  - term: SQL
    introduced_in: what-is-sql
  - term: таблица
    introduced_in: what-is-sql
  # «столбцы» стеммер к «столбец» не сводит: беглая гласная — случай, для
  # которого и существует `forms`.
  - term: столбец
    forms: ["столбцы"]
    introduced_in: what-is-sql
  # Вводный урок перечисляет команды курса («в следующих уроках вы
  # научитесь…») — это анонс, а не употребление термина как известного.
  - term: SELECT
    introduced_in: select-basics
    grants: [sql:select]
    mentioned_before: [what-is-sql]
  - term: WHERE
    introduced_in: where-clause
    grants: [sql:where]
    mentioned_before: [what-is-sql]
  - term: INSERT
    forms: ["INSERT INTO"]
    introduced_in: practice-add-book
    grants: [sql:insert]
    # Квизы уроков select-basics и where-clause используют INSERT как
    # неверный вариант и тут же поясняют его: слово названо и объяснено на
    # месте, а не употреблено как уже известное.
    mentioned_before: [what-is-sql, select-basics, where-clause]
  # Урок про WHERE заканчивается тем, что WHERE работает и в UPDATE/DELETE,
  # — тоже анонс.
  - term: UPDATE
    introduced_in: practice-update-stock
    grants: [sql:update]
    mentioned_before: [what-is-sql, where-clause]
  # Урок про SELECT оговаривает, что за порядок строк отвечает ORDER BY.
  - term: ORDER BY
    introduced_in: practice-by-year
    grants: [sql:order-by]
    mentioned_before: [select-basics, where-clause]

lessons:
  - id: what-is-sql
    teaches: [read-table]
    verify: self
    hours: 0.5
  - id: select-basics
    teaches: [select-columns]
    requires: [what-is-sql]
    verify: quiz
    hours: 0.5
  # WHERE объясняется ДО задания на фильтрацию, а не после: обратный
  # порядок (как было до версии 1.4.0) требовал от ученика конструкции,
  # которой курс ещё не давал. Это и ловит правило
  # practice-uses-untaught.
  - id: where-clause
    teaches: [filter-rows]
    requires: [select-basics]
    verify: quiz
    hours: 0.5
  # Задание на SELECT с условием: сравнение результата с эталонным
  # запросом (practice.expected), порядок строк не важен.
  - id: practice-instock
    requires: [where-clause]
    verify: sql-result
    hours: 1
  # Задание меняет базу, поэтому проверяется её состоянием (practice.check).
  - id: practice-add-book
    teaches: [insert-row]
    requires: [practice-instock]
    verify: sql-state
    hours: 1
  - id: practice-update-stock
    teaches: [update-row]
    requires: [practice-add-book]
    verify: sql-state
    hours: 1
  - id: practice-by-year
    teaches: [order-rows]
    requires: [practice-update-stock]
    verify: sql-result
    hours: 1
  # Задание без песочницы: ученик считает сам и вписывает результат.
  - id: self-check-books
    teaches: [read-own-result]
    requires: [practice-by-year]
    verify: answer
    hours: 0.5
  - id: wrap-up
    requires: [self-check-books]
    verify: self
    hours: 0.5

modules:
  - id: intro
    budget_hours: 3
  - id: filtering
    budget_hours: 6
