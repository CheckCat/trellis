# План курса «HR-аналитика с нуля»: какие умения он строит, в каком
# порядке и чем проверяется каждый урок.
#
# Движок этот файл не читает — он нужен только линту
# (`npm run course:lint -- courses/hr-analytics`). Формат — courses/README.md.
version: 1

skills:
  # Введение
  - id: use-platform
    title: "Двигаться по курсу: сдавать квизы, практику и самоотметки"
  # Модуль 1 — метрики и статистика
  - id: define-metric
    title: "Определить метрику до расчёта: формула, период, кто включён"
  - id: headcount-kinds
    title: "Посчитать списочную и среднесписочную численность и FTE"
    requires: [define-metric]
  - id: turnover-formula
    title: "Посчитать текучесть через среднесписочную численность"
    requires: [headcount-kinds]
  - id: recruiting-metrics
    title: "Посчитать воронку найма, time-to-fill и cost-per-hire"
    requires: [define-metric]
  - id: early-turnover
    title: "Выделить раннюю текучесть и связать её с адаптацией"
    requires: [turnover-formula]
  - id: engagement-metrics
    title: "Посчитать eNPS и абсентеизм по данным опроса и табеля"
    requires: [define-metric]
  - id: training-metrics
    title: "Оценить обучение: завершаемость, оценка, окупаемость"
    requires: [define-metric]
  - id: descriptive-stats
    title: "Описать распределение: медиана, разброс, перцентили"
  - id: stats-caution
    title: "Не обмануться малой выборкой и сравнением несравнимого"
    requires: [descriptive-stats]
  - id: ru-hr-context
    title: "Учитывать российскую специфику: основания увольнения, декрет, срочные договоры"
    requires: [turnover-formula]
  # Модуль 2 — Excel
  - id: tidy-data
    title: "Держать данные плоской таблицей: одна строка — одна запись"
  - id: clean-data
    title: "Вычистить выгрузку: дубликаты, пропуски, ошибки в датах"
    requires: [tidy-data]
  - id: conditional-formulas
    title: "Посчитать по условию: СЧЁТЕСЛИМН, СУММЕСЛИМН, даты"
    requires: [tidy-data]
  - id: lookup-functions
    title: "Подтянуть данные из другой таблицы: ВПР, ИНДЕКС/ПОИСКПОЗ"
    requires: [tidy-data]
  - id: pivot-tables
    title: "Собрать разрез по группам сводной таблицей"
    requires: [tidy-data]
  - id: excel-charts
    title: "Подсветить главное: условное форматирование и диаграмма"
    requires: [pivot-tables]
  - id: power-query
    title: "Сделать чистку повторяемой через Power Query"
    requires: [clean-data]
  # Модуль 3 — SQL
  - id: relational-basics
    title: "Читать реляционную схему: таблицы, ключи, связи"
  - id: romashka-schema
    title: "Ориентироваться в схеме данных «Ромашки»"
    requires: [relational-basics]
  - id: sql-select
    title: "Выбрать нужные столбцы запросом SELECT"
    requires: [romashka-schema]
  - id: sql-filter
    title: "Отобрать строки условием WHERE"
    requires: [sql-select]
  - id: sql-order
    title: "Упорядочить и ограничить выдачу: ORDER BY, LIMIT"
    requires: [sql-select]
  - id: sql-aggregate
    title: "Свернуть столбец в число: COUNT, SUM, AVG, MIN, MAX"
    requires: [sql-select]
  - id: sql-group
    title: "Посчитать разрез по группам: GROUP BY и HAVING"
    requires: [sql-aggregate]
  - id: sql-dates
    title: "Работать с датами: стаж, периоды, усечение к месяцу"
    requires: [sql-filter]
  - id: sql-join
    title: "Соединить таблицы через JOIN"
    requires: [sql-select]
  - id: sql-case-null
    title: "Разложить значения по категориям: CASE и работа с NULL"
    requires: [sql-filter]
  - id: sql-cte
    title: "Разбить расчёт на шаги: подзапросы и CTE"
    requires: [sql-group]
  - id: sql-data-quality
    title: "Найти в таблице дубли, пропуски и аномалии запросом"
    requires: [sql-group]
  - id: sql-modify
    title: "Аккуратно изменить данные: INSERT и UPDATE с условием"
    requires: [sql-filter]
  - id: ai-sql-check
    title: "Использовать ИИ для черновика запроса и проверить его руками"
    requires: [sql-select]
  # Модуль 4 — DataLens
  - id: chart-choice
    title: "Выбрать тип графика под вопрос"
  - id: datalens-basics
    title: "Подключить данные в DataLens"
  - id: datalens-datasets
    title: "Собрать датасет и вычисляемое поле"
    requires: [datalens-basics]
  - id: datalens-charts
    title: "Построить чарт: линия, столбцы, таблица, индикатор"
    requires: [datalens-datasets, chart-choice]
  - id: dashboards
    title: "Собрать дашборд с фильтрами и селекторами"
    requires: [datalens-charts]
  - id: data-story
    title: "Сформулировать по дашборду выводы, а не пересказ графиков"
    requires: [dashboards]
  # Модуль 5 — автоматизация
  - id: hr-systems-map
    title: "Понимать, в какой системе рождается каждое HR-данное"
  - id: automation-choice
    title: "Решить, что автоматизировать, а что оставить руками"
    requires: [hr-systems-map]
  - id: write-requirements
    title: "Написать проверяемые функциональные требования"
    requires: [automation-choice]
  - id: integration-basics
    title: "Объяснить, как системы обмениваются данными без ручной выгрузки"
    requires: [hr-systems-map]
  # Модуль 6 — приватность
  - id: pd-law
    title: "Понимать, что считается персональными данными и что требует 152-ФЗ"
  - id: anonymization
    title: "Обезличить отчёт агрегацией и проверить его на узкие группы"
    requires: [pd-law]
  - id: ai-data-hygiene
    title: "Решить, какие данные нельзя отправлять во внешние ИИ-сервисы"
    requires: [pd-law]
  # Модуль 7 — прогнозы
  - id: seasonality
    title: "Отличить сезонность от тренда и от шума"
    requires: [stats-caution]
  - id: cohort-analysis
    title: "Посчитать удержание когорт по волнам найма"
    requires: [turnover-formula]
  - id: hr-experiments
    title: "Спланировать пилот с контрольной группой без иллюзии причинности"
    requires: [stats-caution]
  - id: risk-scoring
    title: "Собрать простую модель риска ухода из правил и весов"
    requires: [early-turnover, cohort-analysis]

terms:
  # --- Модуль 1 ---
  - term: метрика
    introduced_in: metrics-what-is-metric
    mentioned_before: [metrics-case]
  - term: среднесписочная численность
    forms: ["среднесписочной", "среднесписочную"]
    introduced_in: metrics-headcount
  - term: списочная численность
    introduced_in: metrics-headcount
  - term: FTE
    introduced_in: metrics-headcount
  - term: текучесть
    introduced_in: metrics-turnover
    mentioned_before: [metrics-case, metrics-what-is-metric]
  - term: воронка найма
    forms: ["воронка", "воронку", "воронке"]
    introduced_in: metrics-recruiting
  - term: time-to-fill
    introduced_in: metrics-recruiting
  - term: time-to-hire
    introduced_in: metrics-recruiting
  - term: cost-per-hire
    introduced_in: metrics-recruiting
  - term: ATS
    introduced_in: metrics-recruiting
    mentioned_before: [intro-romashka]
  - term: адаптация
    introduced_in: metrics-onboarding
  - term: вовлечённость
    introduced_in: metrics-engagement
  - term: eNPS
    introduced_in: metrics-engagement
  - term: абсентеизм
    introduced_in: metrics-engagement
  - term: медиана
    introduced_in: metrics-stats-basics
  - term: перцентиль
    forms: ["перцентили", "перцентилей"]
    introduced_in: metrics-stats-basics
  - term: корреляция
    introduced_in: metrics-stats-traps
  # --- Модуль 2 ---
  - term: сводная таблица
    forms: ["сводной таблицей", "сводные таблицы", "сводных таблиц"]
    introduced_in: excel-pivots
    mentioned_before: [excel-case]
  - term: ВПР
    introduced_in: excel-lookup
  - term: Power Query
    introduced_in: excel-power-query
  - term: СЧЁТЕСЛИМН
    introduced_in: excel-formulas
  - term: СУММЕСЛИМН
    introduced_in: excel-formulas
  # --- Модуль 3 ---
  - term: SQL
    introduced_in: sql-case
    mentioned_before: [intro-how-it-works, intro-romashka]
  - term: первичный ключ
    forms: ["первичного ключа", "первичным ключом"]
    introduced_in: sql-db-basics
  - term: внешний ключ
    forms: ["внешнего ключа", "внешним ключом", "внешние ключи"]
    introduced_in: sql-db-basics
  - term: SELECT
    introduced_in: sql-select
    grants: [sql:select]
    mentioned_before: [sql-case, sql-db-basics, sql-romashka-schema]
  - term: WHERE
    introduced_in: sql-where
    grants: [sql:where]
    mentioned_before: [sql-select]
  - term: ORDER BY
    introduced_in: sql-order-limit
    grants: [sql:order-by]
    mentioned_before: [sql-select]
  - term: LIMIT
    introduced_in: sql-order-limit
    grants: [sql:limit]
  - term: агрегатная функция
    forms: ["агрегатные функции", "агрегатных функций", "агрегат", "агрегаты"]
    introduced_in: sql-aggregates
    grants: [sql:aggregate]
  - term: DISTINCT
    introduced_in: sql-aggregates
    grants: [sql:distinct]
  - term: GROUP BY
    introduced_in: sql-group-by
    grants: [sql:group-by]
    mentioned_before: [sql-aggregates]
  - term: HAVING
    introduced_in: sql-group-by
    grants: [sql:having]
  - term: "NULL"
    introduced_in: sql-romashka-schema
    grants: [sql:null-check]
  - term: JOIN
    introduced_in: sql-joins
    grants: [sql:join]
    mentioned_before: [sql-db-basics, sql-romashka-schema]
  - term: CASE
    introduced_in: sql-case-null
    grants: [sql:case]
  - term: подзапрос
    forms: ["подзапросы", "подзапросов", "подзапросом"]
    introduced_in: sql-subqueries-cte
    grants: [sql:subquery]
  - term: CTE
    forms: ["WITH"]
    introduced_in: sql-subqueries-cte
    grants: [sql:cte]
  - term: INSERT
    forms: ["INSERT INTO"]
    introduced_in: sql-modify
    grants: [sql:insert]
  - term: UPDATE
    introduced_in: sql-modify
    grants: [sql:update]
  - term: DATE_TRUNC
    introduced_in: sql-dates
    grants: [sql:date-function]
  - term: LIKE
    introduced_in: sql-where
    grants: [sql:like]
  - term: BETWEEN
    introduced_in: sql-where
    grants: [sql:between]
  - term: IN
    introduced_in: sql-where
    grants: [sql:in]
  # --- Модуль 4 ---
  - term: дашборд
    forms: ["дашборды", "дашбордов"]
    introduced_in: viz-case
    mentioned_before: [intro-romashka]
  - term: датасет
    forms: ["датасеты", "датасетов"]
    introduced_in: viz-datasets
    mentioned_before: [viz-datalens-start]
  - term: чарт
    forms: ["чарты", "чартов"]
    introduced_in: viz-charts
    mentioned_before: [viz-datalens-start, viz-datasets]
  - term: вычисляемое поле
    forms: ["вычисляемые поля", "вычисляемых полей"]
    introduced_in: viz-datasets
  - term: селектор
    forms: ["селекторы", "селекторов"]
    introduced_in: viz-dashboard
  # --- Модуль 5 ---
  - term: API
    introduced_in: auto-integrations
    mentioned_before: [auto-hr-systems]
  - term: ТЗ
    introduced_in: auto-requirements
    mentioned_before: [auto-case, auto-what-to-automate]
  - term: HRIS
    introduced_in: auto-hr-systems
  # --- Модуль 6 ---
  - term: персональные данные
    forms: ["персональных данных", "персональными данными"]
    introduced_in: privacy-152fz
    mentioned_before: [privacy-case]
  - term: 152-ФЗ
    introduced_in: privacy-152fz
    mentioned_before: [privacy-case]
  - term: обезличивание
    forms: ["обезличить", "обезличенный", "обезличенных"]
    introduced_in: privacy-anonymization
  - term: k-анонимность
    forms: ["k-анонимности"]
    introduced_in: privacy-anonymization
  # --- Модуль 7 ---
  - term: сезонность
    forms: ["сезонности", "сезонностью"]
    introduced_in: forecast-trends
    mentioned_before: [metrics-stats-traps]
  - term: когорта
    forms: ["когорты", "когорт", "когортой", "когортный", "когортного"]
    introduced_in: forecast-cohorts
    mentioned_before: [forecast-case]
  - term: контрольная группа
    forms: ["контрольной группы", "контрольную группу"]
    introduced_in: forecast-experiments

