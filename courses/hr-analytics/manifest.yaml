        content: lessons/automation/auto-what-to-automate.md
        quiz:
          multiple: true
          question: "Отметьте все задачи, которые стоит автоматизировать."
          options:
            - id: monthly-report
              text: "Ежемесячный отчёт по текучести по одной и той же форме для руководителей"
              correct: true
            - id: ats-export
              text: "Еженедельный перенос новых откликов из ATS в общую таблицу рекрутёров"
              correct: true
            - id: exit-analysis
              text: "Разовый разбор причин ухода трёх руководителей в этом квартале"
              explanation: "Задача важная, но не повторяется и требует суждения — вложение в автоматизацию разового анализа не вернётся."
            - id: offer-decision
              text: "Выбор, кому из двух финалистов на вакансию сделать оффер"
              explanation: "Решения о людях требуют суждения: автоматизировать можно подготовку данных к выбору, но не сам выбор."
            - id: board-preso
              text: "Квартальная презентация для директора, каждый раз с новой структурой по его запросу"
              explanation: "Повторяется только календарно: стабильной формы нет, а значит, нет правил, которые можно записать и автоматизировать."
      - id: auto-requirements
        title: "Как написать ТЗ: функциональные требования"
        content: lessons/automation/auto-requirements.md
        quiz:
          question: "Какое из требований к автоматическому отчёту сформулировано правильно?"
          options:
            - id: deadline
              text: "Отчёт формируется автоматически к 9:00 первого рабочего дня месяца"
              correct: true
            - id: fast
              text: "Отчёт формируется быстро и без лишних задержек"
              explanation: "«Быстро» у каждого своё: проверить выполнение такого требования нельзя — нужен конкретный срок."
            - id: usable
              text: "Отчёт должен быть удобным и наглядным для руководителей"
              explanation: "Удобство — пожелание, а не требование: пока оно не переписано в проверяемые признаки, спор «удобно или нет» не решается."
            - id: python
              text: "Отчёт формируется скриптом на Python, который берёт данные из базы"
              explanation: "Это решение, а не требование: как реализовать — выбор исполнителя, а требование описывает результат и способ его проверить."
      - id: auto-integrations
        title: "Интеграции и выгрузки без кода: API, экспорт по расписанию"
        content: lessons/automation/auto-integrations.md
        quiz:
          question: "Дашборд по вакансиям должен каждое утро показывать свежие данные из ATS. Что попросить у поставщика ATS?"
          options:
            - id: api-or-csv
              text: "Доступ к API или выгрузку в CSV по расписанию"
              correct: true
            - id: manual
              text: "Закрепить менеджера поддержки, который будет присылать выгрузку по утрам"
              explanation: "Это «интеграция» через человека: она ломается в его отпуск, болезнь и загруженное утро — именно от ручного звена мы и уходим."
            - id: admin
              text: "Логин администратора ATS, чтобы выгружать данные самостоятельно"
              explanation: "Выгрузка остаётся ручной — просто теперь её делаете вы; а административные права, которые не нужны задаче, — лишний риск."
            - id: once
              text: "Полную выгрузку всей базы кандидатов одним файлом"
              explanation: "Разовая выгрузка устареет уже назавтра: задача — в регулярной доставке свежих данных, а не в архиве на сегодня."
      - id: auto-practice-spec
        title: "Практика: ТЗ на автоматизацию отчёта по текучести"
        content: lessons/automation/auto-practice-spec.md
