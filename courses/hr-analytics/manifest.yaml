            - id: avg-salary
              text: "Средний оклад по компании — 83 967 ₽"
              explanation: "Число похоже на «данные о зарплатах», но это итог по 120 людям сразу: определить по нему конкретного человека нельзя."
            - id: term-count
              text: "Число уволившихся за 2025 год — 23 человека"
              explanation: "Это счёт событий по компании в целом: цифра 23 не относится ни к одному определённому человеку."
      - id: privacy-anonymization
        title: "Обезличивание и агрегация"
        content: lessons/privacy/privacy-anonymization.md
        practice:
          type: answer
          prompt: >-
            Посмотрите на таблицу «отдел × пол» в тексте урока и примените порог
            k = 5. Отвечайте целыми числами.
          fields:
            - id: groups-under-5
              label: "Сколько групп в таблице меньше 5 человек?"
              kind: number
              expected: 6
              tolerance: 0
            - id: min-group-size
              label: "Сколько человек в самой маленькой группе?"
              kind: number
              expected: 2
              tolerance: 0
      - id: privacy-ai-tools
        title: "Данные и ИИ-сервисы: что нельзя отправлять во внешние модели"
        content: lessons/privacy/privacy-ai-tools.md
        quiz:
          multiple: true
          question: "Отметьте всё, что можно вставить в запрос к внешнему облачному ИИ-сервису."
          options:
            - id: schema
              text: "Названия таблиц и столбцов вашей базы, без единой строки данных"
              correct: true
            - id: formula
              text: "Формулу текучести и просьбу написать по ней SQL-запрос"
              correct: true
            - id: fio-salary
              text: "Таблицу «ФИО — оклад» по одному отделу с просьбой найти аномалии"
              explanation: "Размер таблицы не имеет значения: это передача персональных данных на чужой сервер — пусть ИИ напишет запрос, а выполните его вы у себя."
            - id: candidates
              text: "Выгрузку кандидатов из ATS с телефонами — они ведь ещё не сотрудники"
              explanation: "Кандидаты — такие же люди, и их данные такие же персональные: отсутствие трудового договора не даёт права их пересылать."
            - id: contract
              text: "Текст трудового договора сотрудника с просьбой кратко его пересказать"
              explanation: "Договор целиком состоит из данных конкретного человека — от ФИО до оклада, и просьба «просто пересказать» этого не меняет."
      - id: privacy-practice-checklist
        title: "Практика: чек-лист приватности для отчёта"
        content: lessons/privacy/privacy-practice-checklist.md
        quiz:
          multiple: true
          question: "Файл к собранию: ФИО уволившихся за квартал, причины, оклады, возраст; уходит по корпоративной почте всем начальникам отделов. Отметьте всё, что нужно исправить перед отправкой."
          options:
            - id: aggregate
              text: "Убрать ФИО, оклады и возраст: для разговора о причинах ухода достаточно итогов по отделам"
              correct: true
            - id: small-groups
              text: "Проверить размеры групп: отдел, где уволился один человек, раскрывает его даже без ФИО"
              correct: true
            - id: recipients
              text: "Пересмотреть рассылку: каждому начальнику — его отдел, а не данные всей компании"
              correct: true
            - id: ask-delete
              text: "Отправить файл как есть, но попросить получателей удалить его после собрания"
              explanation: "Передача происходит в момент отправки, а не огласки: просьба удалить ничего не отменяет и не заменяет исправление самого файла."
            - id: percent
              text: "Пересчитать оклады из рублей в проценты от среднего по компании"
              explanation: "Связка «человек — его значение» никуда не делась: пересчёт единиц не мешает определить, чей это оклад."
            - id: paper
              text: "Отказаться от почты и раздать бумажные копии на собрании"
              explanation: "Канал здесь не проблема — корпоративная почта допустима, а бумага передаёт ровно те же данные тому же кругу."
  - id: forecasting
    title: "Модуль 7 (по желанию). Прогнозы и эксперименты"
    lessons:
      - id: forecast-case
        title: "Кейс: кто уйдёт следующим?"
        content: lessons/forecasting/forecast-case.md
      - id: forecast-trends
        title: "Тренды и сезонность"
        content: lessons/forecasting/forecast-trends.md
        quiz:
          question: "Перед вами четыре наблюдения за увольнениями. В каком из них виден именно тренд?"
          options:
            - id: rolling-up
              text: "Скользящее среднее увольнений за 12 месяцев растёт третий год подряд"
              correct: true
            - id: january-peak
              text: "Каждый январь увольнений заметно больше, чем в среднем за месяц, — и так все три года"
              explanation: "Повторяющийся из года в год рисунок внутри года — это сезонность: устойчивого движения от года к году здесь нет."
            - id: single-spike
              text: "В одном месяце уволилось втрое больше обычного, а в следующем — снова как всегда"
              explanation: "Одиночный всплеск без продолжения — это шум: на малых числах такое случается само собой и ничего не предвещает."
            - id: neighbor-months
              text: "В этом месяце на одно увольнение больше, чем в прошлом месяце"
              explanation: "Разница в одно событие между соседними месяцами — обычное случайное колебание; по нему нельзя судить ни о тренде, ни о сезонности."
      - id: forecast-cohorts
        title: "Когортный анализ: удержание по волнам найма"
        content: lessons/forecasting/forecast-cohorts.md
        quiz:
          question: "По таблице урока: когорта 2023 года — 24 нанятых, до года дожили 18 (75,0 %); когорта 2024 года — 25 нанятых, дожили 18 (72,0 %). Какой вывод корректен?"
          options:
            - id: retention-similar
              text: "Удержание первого года почти не изменилось: 75,0 % против 72,0 %, разница — один человек"
              correct: true
            - id: company-turnover
              text: "Текучесть компании за 2024 год составила 28,0 % — это следует прямо из таблицы"
              explanation: "28,0 % — это доля ушедших за первый год из одной волны найма; текучесть компании считается по всем сотрудникам через среднесписочную численность — это другая метрика."
            - id: still-working-now
              text: "Из 49 нанятых за эти два года на конец 2025 года в компании работают ровно 36"
              explanation: "Таблица говорит, кто дожил до стажа 365 дней, а не кто работает сейчас: часть из этих 36 могла уйти уже после первой годовщины."
            - id: hiring-got-worse
              text: "В 2024 году нанимать стали хуже: людей взяли больше, а до года дожило столько же"
              explanation: "Разница между когортами — один человек на выборке в 25, это шум, а не доказательство ухудшения найма (вспомните малые выборки из модуля 1)."
      - id: forecast-experiments
        title: "Эксперименты и пилоты: A/B в HR без иллюзий"
        content: lessons/forecasting/forecast-experiments.md
        quiz:
          multiple: true
          question: "«Ромашка» запускает пилот наставничества в одном отделе. Отметьте всё, что верно про такой пилот."
          options:
            - id: criteria-first
              text: "Критерий успеха записывается до старта: какая метрика, за какой срок, с чем сравниваем"
              correct: true
            - id: compare-peers
              text: "Отдел с пилотом сравнивают не только с самим собой «до», но и с другими отделами за тот же период"
              correct: true
            - id: small-numbers
              text: "Снижение текучести на пару увольнений за квартал ещё не доказывает, что помог именно пилот"
              correct: true
            - id: before-after
              text: "Если после запуска текучесть в отделе упала, причина найдена — можно внедрять во всей компании"
              explanation: "«После» не значит «вследствие»: за то же время могли измениться оклады, руководитель или сезон — сравнение «до/после» не отделяет пилот от всего остального."
            - id: salary-experiment
              text: "Для чистоты сравнения можно повысить оклады половине отдела и посмотреть на текучесть второй половины"
              explanation: "Эксперименты с зарплатой на живых людях недопустимы: вторая половина узнает о разнице и получит настоящую причину уйти — вред реален, а не статистический."
            - id: shorter-better
              text: "Чем короче пилот, тем надёжнее вывод: меньше успеет измениться вокруг"
              explanation: "На малых числах короткий пилот ловит шум, а не эффект: пара случайных увольнений перевешивает любую пользу наставничества, поэтому наблюдать нужно дольше, а не меньше."
      - id: forecast-risk-models
        title: "Простые модели риска: правила и веса, без машинного обучения"
        content: lessons/forecasting/forecast-risk-models.md
        practice:
          type: answer
          prompt: >-
            Посчитайте балл риска каждого из трёх сотрудников из таблицы урока
            по модели из четырёх правил. Срез — 31 декабря 2025 года; ответ —
            целое число баллов.
          fields:
            - id: score-a
              label: "Балл риска сотрудника А (менеджер по продажам)"
              kind: number
              expected: 5
              tolerance: 0
            - id: score-b
              label: "Балл риска сотрудника Б (наладчик)"
              kind: number
              expected: 3
              tolerance: 0
            - id: score-c
              label: "Балл риска сотрудника В (бухгалтер)"
              kind: number
              expected: 0
              tolerance: 0
      - id: forecast-practice-cohorts
        title: "Практика: когорты удержания SQL-запросом"
        content: lessons/forecasting/forecast-practice-cohorts.md
        practice:
          sandbox: romashka
          prompt: >-
            По сотрудникам, нанятым с 1 января 2023 года по 31 декабря 2024
            года, посчитайте по каждому году найма: сам год, сколько человек
            нанято, сколько из них доработало минимум до 365 дней стажа или
            работает до сих пор. Столбцы по порядку: cohort_year (год числом),
            hired, kept. Строки — по возрастанию года.
          # Порядок строк — часть условия («по возрастанию года»), поэтому
          # ordered: true. Прогон на scratch: 2023|24|18, 2024|25|18.
          expected: >-
            select extract(year from hire_date) as cohort_year,
                   count(*) as hired,
                   sum(case when termination_date is null
                             or termination_date - hire_date >= 365
                        then 1 else 0 end) as kept
            from employees
            where hire_date between date '2023-01-01' and date '2024-12-31'
            group by 1
            order by 1
          ordered: true
  - id: capstone
    title: "Итоговый проект"
    lessons:
      - id: capstone-brief
        title: "Задание: вопрос от директора «Ромашки»"
        content: lessons/capstone/capstone-brief.md
      - id: capstone-data
        title: "Этап 1: достаём и проверяем данные (SQL)"
        content: lessons/capstone/capstone-data.md
        practice:
          sandbox: romashka
          prompt: >-
            По каждому отделу «Ромашки» посчитайте: название отдела, число
            работающих на 31 декабря 2025 года, число уволившихся за 2025 год,
            число нанятых за 2025 год. Столбцы по порядку: name, headcount,
            terms_2025, hires_2025. Строки — по алфавиту названия отдела
            (латинское «HR» идёт первым).
          # Порядок строк — часть условия, ordered: true. Сортировка по name
          # проверена на scratch (латиница раньше кириллицы): HR,
          # Администрация, ИТ, Маркетинг, Продажи, Производство,
          # Склад и логистика, Финансы — 8 строк.
          expected: >-
            with headcount as (
              select department_id, count(*) as headcount
              from employees
              where hire_date <= date '2025-12-31'
                and (termination_date is null or termination_date >= date '2025-12-31')
              group by department_id
            ),
            terms as (
              select e.department_id, count(*) as terms_2025
              from terminations t
              join employees e on e.id = t.employee_id
              where t.term_date between date '2025-01-01' and date '2025-12-31'
              group by e.department_id
            ),
            hires as (
              select department_id, count(*) as hires_2025
              from employees
              where hire_date between date '2025-01-01' and date '2025-12-31'
              group by department_id
            )
            select d.name,
                   coalesce(h.headcount, 0) as headcount,
                   coalesce(t.terms_2025, 0) as terms_2025,
                   coalesce(r.hires_2025, 0) as hires_2025
            from departments d
            left join headcount h on h.department_id = d.id
            left join terms t on t.department_id = d.id
            left join hires r on r.department_id = d.id
            order by d.name
          ordered: true
      - id: capstone-metrics
        title: "Этап 2: считаем метрики и проверяем на здравый смысл"
        content: lessons/capstone/capstone-metrics.md
        practice:
          type: answer
          prompt: >-
            Посчитайте четыре показателя за 2025 год по данным «Ромашки» —
            SQL-запросами в песочнице или по CSV из courses/hr-analytics/data/
            (каталог лежит там, куда распакована платформа). Проценты и дни —
            с округлением до одного знака после запятой.
          fields:
            - id: turnover-sales
              label: "Текучесть отдела Продажи за 2025 год, %"
              kind: number
              expected: 30.5
              tolerance: 0.5
            - id: turnover-it
              label: "Текучесть отдела ИТ за 2025 год, %"
              kind: number
              expected: 7.2
              tolerance: 0.4
            - id: ttf-it
              label: "Средний time-to-fill отдела ИТ по вакансиям, закрытым в 2025 году, в днях"
              kind: number
              expected: 91.5
              tolerance: 1
            - id: voluntary-share
              label: "Доля уволившихся по собственному желанию за 2025 год, %"
              kind: number
              expected: 65.2
              tolerance: 0.5
      - id: capstone-dashboard
        title: "Этап 3: дашборд"
        content: lessons/capstone/capstone-dashboard.md
      - id: capstone-story
        title: "Этап 4: три вывода для директора"
        content: lessons/capstone/capstone-story.md
