              text: "КЭДО"
              explanation: "В КЭДО лежит сам документ с подписями, а структурированные поля «дата приёма» и «оклад», по которым считают, — в кадровом учёте."
            - id: tabel
              text: "Табель рабочего времени"
              explanation: "Табель отвечает на вопрос, сколько человек отработал, а не когда он принят и на каких условиях."
      - id: auto-what-to-automate
