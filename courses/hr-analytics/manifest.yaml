              expected: "ИТ"
            - id: offer-and-beyond
              label: "Сколько кандидатов дошло до этапа «оффер» и дальше? Этап в данных — максимальный достигнутый: считайте строки с этапом «оффер» или «нанят»"
              kind: number
              expected: 33
      - id: viz-storytelling
