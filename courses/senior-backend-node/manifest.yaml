          solution: |
            type Op =
              | { op: "publish"; key: string; value: string }
              | { op: "subscribe"; group: string; member: string }
              | { op: "poll"; group: string; member: string; max: number }
              | { op: "commit"; group: string; member: string; partition: number; offset: number };

            const hash = (key: string): number =>
              [...key].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);

            type Group = {
              members: string[];
              assignment: Map<string, number[]>;
              committed: Map<number, number>;
            };

            export function runBroker(partitions: number, ops: Op[]): { log: string[] } {
              const log: string[] = [];
              const parts: string[][] = Array.from({ length: partitions }, () => []);
              const groups = new Map<string, Group>();

              const getGroup = (name: string): Group => {
                let g = groups.get(name);
                if (!g) {
                  g = { members: [], assignment: new Map(), committed: new Map() };
                  groups.set(name, g);
                }
                return g;
              };

              const rebalance = (g: Group) => {
                g.assignment = new Map(g.members.map((m) => [m, []]));
                for (let p = 0; p < partitions; p++) {
                  const owner = g.members[p % g.members.length];
                  g.assignment.get(owner)!.push(p);
                }
                for (const m of g.members) {
                  const list = g.assignment.get(m)!.sort((a, b) => a - b);
                  log.push(`assign:${m}:[${list.map((p) => `p${p}`).join(",")}]`);
                }
              };

              for (const op of ops) {
                if (op.op === "publish") {
                  const p = hash(op.key) % partitions;
                  parts[p].push(op.value);
                  log.push(`pub:p${p}:o${parts[p].length - 1}`);
                } else if (op.op === "subscribe") {
                  const g = getGroup(op.group);
                  if (g.members.includes(op.member)) {
                    log.push(`already:${op.member}`);
                    continue;
                  }
                  g.members.push(op.member);
                  rebalance(g);
                } else if (op.op === "poll") {
                  const g = getGroup(op.group);
                  const mine = g.assignment.get(op.member) ?? [];
                  const values: string[] = [];
                  for (const p of mine) {
                    let offset = g.committed.get(p) ?? 0;
                    while (offset < parts[p].length && values.length < op.max) {
                      values.push(parts[p][offset]);
                      offset++;
                    }
                    if (values.length >= op.max) break;
                  }
                  log.push(`poll:${op.member}:${values.length > 0 ? values.join(",") : "-"}`);
                } else {
                  const g = getGroup(op.group);
                  const mine = g.assignment.get(op.member) ?? [];
                  if (!mine.includes(op.partition)) {
                    log.push(`reject:${op.member}:p${op.partition}`);
                    continue;
                  }
                  const current = g.committed.get(op.partition) ?? 0;
                  if (op.offset < current) {
                    log.push(`stale-commit:p${op.partition}`);
                    continue;
                  }
                  g.committed.set(op.partition, op.offset);
                  log.push(`commit:p${op.partition}:o${op.offset}`);
                }
              }
              return { log };
            }
