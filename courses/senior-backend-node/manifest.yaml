id: senior-backend-node
version: "1.2.0"
title: "Senior Backend на Node.js: подготовка к собеседованию"
description: "Курс для сильного фронтенд-разработчика, который идёт на позицию Senior Backend Node.js: рантайм Node изнутри, Express/Fastify/NestJS, дизайн API, PostgreSQL, сессии и многосессионная авторизация, кэширование, очереди и брокеры, архитектура и принципы, высокая нагрузка и отказоустойчивость, эксплуатация, разбор собеседования. Сквозной пример — операторская платформа банка «Пульт»."
sandboxes:
  - id: pult
    type: postgres
    seed:
      - sandbox/seed.sql
modules:
  - id: intro
    title: "Введение"
    lessons:
      - id: intro-course
        title: "Как устроен курс и как готовиться к собеседованию"
        content: lessons/intro/intro-course.md
      - id: scr-format
        title: "Скрининг с HR: что на самом деле проверяют"
        content: lessons/intro/scr-format.md
        quiz:
          question: "HR на скрининге спрашивает: «С Kafka работали?» Какой ответ верен для этого этапа?"
          options:
            - id: checkbox
              text: "«Да, работал с событиями Kafka на стороне потребителя, устройство знаю глубоко» — коротко, галочка поставлена"
              correct: true
            - id: full-honesty
              text: "Развернуть полную картину: партиции, consumer groups, offset, и что кластер в проде не эксплуатировал, а потребителей писал"
              explanation: "Каждое слово здесь уместно — но на технической секции. HR не может оценить механику, а слово «не эксплуатировал» без контекста рискует попасть в заметки как «нет». Глубина ответа выбирается по собеседнику."
            - id: honest-no
              text: "«Нет, но технология знакома по учебным проектам, быстро войду в курс»"
              explanation: "Это ложное «нет»: работа с событиями Kafka на стороне потребителя в проде — это опыт работы с Kafka. Галочка не поставлена, и скрининг может закончиться на ней."
            - id: overclaim
              text: "«Да, эксплуатировал кластер в проде» — уверенно, без деталей, чтобы галочка встала наверняка"
              explanation: "Преувеличение уедет в заметки HR дословно, и техсекция начнётся с трёх «а как именно» про администрирование кластера. Правило честности: сказанное на скрининге придётся держать на всех следующих этапах."
      - id: intro-platform
        title: "Сквозной пример: операторская платформа «Пульт» изнутри"
        content: lessons/intro/intro-platform.md
        quiz:
          question: "Почему сервис cases не публикует событие в Kafka прямо из обработчика запроса, а сначала пишет строку в таблицу outbox в той же транзакции?"
          options:
            - id: two-stores
              text: "База и брокер — два разных хранилища, изменить их атомарно нельзя; outbox делает событие частью транзакции, а публикует его отдельный воркер позже"
              correct: true
            - id: kafka-blocks
              text: "Kafka не принимает сообщения, пока в Postgres открыта транзакция, поэтому публиковать можно только после фиксации через воркер"
              explanation: "Kafka ничего не знает о транзакциях Postgres и примет сообщение в любой момент. Проблема не в запрете, а в сбое между двумя записями: зафиксировали обращение, а публикация не удалась — событие потеряно; или опубликовали, а транзакция откатилась — событие о несуществующем обращении."
            - id: faster
              text: "Так быстрее: вставка строки в outbox дешевле сетевого вызова в брокер, и обработчик отвечает оператору раньше"
              explanation: "Скорость здесь не цель, и outbox её не добавляет: появляется вторая запись и воркер-реле. Цена платится за гарантию, что событие не потеряется и не уйдёт раньше, чем зафиксирована запись, о которой оно сообщает."
            - id: audit-reads-table
              text: "Чтобы сервис audit читал события напрямую из таблицы outbox, не подключаясь к Kafka и не завися от брокера"
              explanation: "audit читает Kafka, а не таблицу чужого сервиса. Доступ одного сервиса к базе другого — антипаттерн, который убирает границу между ними; почему — в модуле про архитектуру."

  - id: node
    title: "Модуль 1. Node.js изнутри"
    lessons:
      - id: node-runtime
        title: "Что такое Node.js: V8, libuv и один поток"
        content: lessons/node/node-runtime.md
        quiz:
          question: "Сервис identity асинхронно хеширует пароли через pbkdf2 и одновременно держит WebSocket-соединения с 5000 операторов. Под нагрузкой ответы на вход замедлились, а лаг цикла событий в норме. Где узкое место?"
          options:
            - id: threadpool
              text: "В пуле потоков libuv: pbkdf2 занял все четыре потока, и следующая операция ждёт очереди; сеть не страдает, потому что идёт через механизмы ОС"
              correct: true
            - id: main-thread
              text: "В главном потоке: pbkdf2 считается в JavaScript и блокирует цикл событий, пока хеш не посчитан"
              explanation: "Асинхронный pbkdf2 уходит в пул потоков libuv, а не считается в JS. Если бы он блокировал цикл, вырос бы лаг цикла событий — а он в норме, значит, поток свободен и ждёт чего-то снаружи."
            - id: sockets
              text: "В сети: 5000 соединений исчерпали пул потоков libuv, и pbkdf2 не получает свободного потока"
              explanation: "Сетевой ввод-вывод не использует пул потоков: он идёт через epoll/kqueue/IOCP, и десятки тысяч соединений не занимают ни одного потока. Пул занимают файлы, DNS, crypto и zlib."
            - id: gc
              text: "В сборщике мусора: каждое соединение создаёт объекты, и паузы сборки задерживают ответы на вход"
              explanation: "Паузы сборщика мусора останавливают JS-поток и проявились бы ростом лага цикла событий. Он в норме — значит, задержка возникает вне потока JS."
      - id: node-event-loop
        title: "Event loop сервера: фазы, микрозадачи, nextTick и setImmediate"
        content: lessons/node/node-event-loop.md
        quiz:
          question: "Внутри колбэка fs.readFile выполняются подряд: setTimeout(A, 0); setImmediate(B); process.nextTick(C); Promise.resolve().then(D). В каком порядке выведутся A, B, C, D?"
          options:
            - id: cdba
              text: "C, D, B, A"
              correct: true
            - id: cdab
              text: "C, D, A, B"
              explanation: "Колбэк readFile выполняется в фазе poll. Следующая фаза — check, где живёт setImmediate; до timers цикл дойдёт только на следующей итерации. Из главного модуля порядок A и B не гарантирован, но внутри колбэка ввода-вывода B всегда раньше A."
            - id: dcba
              text: "D, C, B, A"
              explanation: "После каждого колбэка Node сначала опустошает очередь process.nextTick целиком и только потом очередь микрозадач промисов. Поэтому C раньше D."
            - id: bcda
              text: "B, C, D, A"
              explanation: "nextTick и микрозадачи выполняются сразу после текущего колбэка, до перехода к следующей фазе. setImmediate дождётся фазы check, поэтому B не может быть первым."
      - id: node-blocking
        title: "Что блокирует поток и как разгружать CPU: worker_threads, cluster, child_process"
        content: lessons/node/node-blocking.md
        quiz:
          question: "Оператор запрашивает PDF-выписку по клиенту: генерация занимает около 300 мс CPU, и результат нужен в этом же HTTP-ответе. Как организовать генерацию, чтобы остальные операторы не ждали?"
          options:
            - id: pool
              text: "Держать пул worker_threads и отправлять генерацию туда: главный поток продолжает обслуживать остальных, результат приходит сообщением"
              correct: true
            - id: async
              text: "Обернуть генерацию в async-функцию и вызывать через await, чтобы она не блокировала цикл событий"
              explanation: "async не создаёт поток. Синхронные 300 мс вычислений остановят цикл событий на 300 мс независимо от того, сколько await вокруг них написано."
            - id: cluster
              text: "Запустить сервис через cluster с числом воркеров по числу ядер, чтобы выписки считались параллельно"
              explanation: "cluster даёт N копий сервера, но каждый запрос по-прежнему блокирует своего воркера на 300 мс. Восемь одновременных выписок заблокируют все восемь воркеров, и остальные операторы снова ждут."
            - id: per-request
              text: "Создавать новый worker_thread на каждый запрос выписки и завершать его после ответа"
              explanation: "Создание воркера стоит десятки миллисекунд и десятки мегабайт памяти. Под нагрузкой это медленнее и дороже, чем считать в главном потоке, — воркеры держат в пуле."
      - id: node-practice-emitter
        title: "Практика: EventEmitter с once, off и ошибками"
        content: lessons/node/node-practice-emitter.md
        practice:
          type: code
          language: typescript
          entry: runScenario
          prompt: "Реализуйте класс Emitter (on, once, off, emit с семантикой Node) и функцию runScenario(steps), которая выполняет сценарий из урока и возвращает журнал строк."
          starter: |
            type Step =
              | ["on", string, string]
              | ["once", string, string]
              | ["off", string, string]
              | ["offDuringEmit", string, string, string]
              | ["emit", string, ...unknown[]]
              | ["emitError", string];

            type Listener = (...args: unknown[]) => void;

            class Emitter {
              on(event: string, fn: Listener): this {
                // ...
                return this;
              }
              once(event: string, fn: Listener): this {
                // ...
                return this;
              }
              off(event: string, fn: Listener): this {
                // ...
                return this;
              }
              emit(event: string, ...args: unknown[]): boolean {
                // ...
                return false;
              }
            }

            export function runScenario(steps: Step[]): string[] {
              const log: string[] = [];
              const emitter = new Emitter();
              // ...
              return log;
            }
          cases:
            - args: [[["on", "tick", "a"], ["once", "tick", "b"], ["emit", "tick", 1], ["emit", "tick", 2]]]
              expected: ["a:tick:1", "b:tick:1", "emit:tick:true", "a:tick:2", "emit:tick:true"]
            - args: [[["emitError", "boom"]]]
              expected: ["thrown:boom"]
            - args: [[["on", "error", "h"], ["emitError", "boom"]]]
              expected: ["h:error:boom", "emit:error:true"]
            - args: [[["on", "t", "a"], ["offDuringEmit", "t", "b", "a"], ["on", "t", "c"], ["emit", "t"], ["emit", "t"]]]
              expected: ["a:t:", "b:t:", "c:t:", "emit:t:true", "b:t:", "c:t:", "emit:t:true"]
            - args: [[["once", "t", "a"], ["off", "t", "a"], ["emit", "t"]]]
              expected: ["emit:t:false"]
            - args: [[["on", "t", "a"], ["on", "t", "a"], ["off", "t", "a"], ["emit", "t", 1]]]
              expected: ["a:t:1", "emit:t:true"]
            - args: [[["on", "t", "a"], ["emit", "t", 1, "x"], ["emit", "u"]]]
              expected: ["a:t:1,x", "emit:t:true", "emit:u:false"]
            - args: [[]]
              expected: []
          solution: |
            type Step =
              | ["on", string, string]
              | ["once", string, string]
              | ["off", string, string]
              | ["offDuringEmit", string, string, string]
              | ["emit", string, ...unknown[]]
              | ["emitError", string];

            type Listener = ((...args: unknown[]) => void) & { original?: Listener };

            class Emitter {
              private listeners = new Map<string, Listener[]>();

              on(event: string, fn: Listener): this {
                const list = this.listeners.get(event) ?? [];
                list.push(fn);
                this.listeners.set(event, list);
                return this;
              }

              once(event: string, fn: Listener): this {
                const wrapper: Listener = (...args) => {
                  this.off(event, wrapper);
                  fn(...args);
                };
                wrapper.original = fn;
                return this.on(event, wrapper);
              }

              off(event: string, fn: Listener): this {
                const list = this.listeners.get(event);
                if (!list) return this;
                for (let i = list.length - 1; i >= 0; i--) {
                  if (list[i] === fn || list[i].original === fn) {
                    list.splice(i, 1);
                    break;
                  }
                }
                if (list.length === 0) this.listeners.delete(event);
                return this;
              }

              emit(event: string, ...args: unknown[]): boolean {
                const list = this.listeners.get(event);
                if (!list || list.length === 0) {
                  if (event === "error") {
                    throw args[0] instanceof Error ? args[0] : new Error(String(args[0]));
                  }
                  return false;
                }
                for (const fn of [...list]) fn(...args);
                return true;
              }
            }

            export function runScenario(steps: Step[]): string[] {
              const log: string[] = [];
              const emitter = new Emitter();
              const registry = new Map<string, Listener[]>();
              const key = (event: string, name: string) => `${event}␀${name}`;
              const register = (event: string, name: string, fn: Listener) => {
                const list = registry.get(key(event, name)) ?? [];
                list.push(fn);
                registry.set(key(event, name), list);
              };
              const takeLast = (event: string, name: string): Listener | undefined => {
                const list = registry.get(key(event, name));
                return list?.pop();
              };
              const format = (args: unknown[]) =>
                args.map((a) => (a instanceof Error ? a.message : String(a))).join(",");

              for (const step of steps) {
                switch (step[0]) {
                  case "on": {
                    const [, event, name] = step;
                    const fn: Listener = (...args) => log.push(`${name}:${event}:${format(args)}`);
                    register(event, name, fn);
                    emitter.on(event, fn);
                    break;
                  }
                  case "once": {
                    const [, event, name] = step;
                    const fn: Listener = (...args) => log.push(`${name}:${event}:${format(args)}`);
                    register(event, name, fn);
                    emitter.once(event, fn);
                    break;
                  }
                  case "off": {
                    const [, event, name] = step;
                    const fn = takeLast(event, name);
                    if (fn) emitter.off(event, fn);
                    break;
                  }
                  case "offDuringEmit": {
                    const [, event, name, target] = step;
                    const fn: Listener = (...args) => {
                      log.push(`${name}:${event}:${format(args)}`);
                      const victim = takeLast(event, target);
                      if (victim) emitter.off(event, victim);
                    };
                    register(event, name, fn);
                    emitter.on(event, fn);
                    break;
                  }
                  case "emit": {
                    const [, event, ...args] = step;
                    const result = emitter.emit(event, ...args);
                    log.push(`emit:${event}:${result}`);
                    break;
                  }
                  case "emitError": {
                    const [, message] = step;
                    try {
                      const result = emitter.emit("error", new Error(message));
                      log.push(`emit:error:${result}`);
                    } catch (err) {
                      log.push(`thrown:${(err as Error).message}`);
                    }
                    break;
                  }
                }
              }
              return log;
            }
      - id: node-streams
        title: "Streams и backpressure: почему pipe без pipeline течёт"
        content: lessons/node/node-streams.md
        quiz:
          question: "Сервис отдаёт CSV на 2 ГБ через pipeline(createReadStream(file), createGzip(), res). Клиент читает ответ медленно. Что происходит с памятью процесса, пока файл отдаётся?"
          options:
            - id: bounded
              text: "Остаётся в пределах буферов потоков: pipeline перестаёт читать файл, пока буфер записи не опустеет по событию drain"
              correct: true
            - id: gzip-buffers
              text: "Растёт до размера сжатого файла, потому что gzip буферизует весь выход, прежде чем начать отдавать"
              explanation: "createGzip — Transform-поток и отдаёт сжатые данные кусками по мере поступления входа. Буферизует он не больше своего highWaterMark."
            - id: res-grows
              text: "Растёт, пока клиент не дочитает: диск быстрее сети, и разница накапливается во внутреннем буфере res"
              explanation: "Так было бы при ручных write без проверки возвращаемого значения. pipeline перестаёт читать источник, когда write вернул false, и возобновляет по drain — буфер не растёт выше highWaterMark."
            - id: whole-file
              text: "Растёт до 2 ГБ, потому что createReadStream читает файл целиком в память и только потом отдаёт его кусками"
              explanation: "createReadStream читает по кускам размером highWaterMark (64 КБ по умолчанию). Целиком файл оказывается в памяти только при readFile."
      - id: node-practice-lines
        title: "Практика: строки и пакеты из потока чанков"
        content: lessons/node/node-practice-lines.md
        practice:
          type: code
          language: typescript
          entry: batchLines
          prompt: "Реализуйте batchLines(chunks, batchSize): соберите строки из кусков текста, границы которых не совпадают с переводами строк, и разбейте их на пачки по batchSize."
          starter: |
            export function batchLines(chunks: string[], batchSize: number): string[][] {
              // ...
              return [];
            }
          cases:
            - args: [["a\nb\nc\n"], 2]
              expected: [["a", "b"], ["c"]]
            - args: [["a\nb", "c\nd"], 10]
              expected: [["a", "bc", "d"]]
            - args: [["x\r", "\ny"], 1]
              expected: [["x"], ["y"]]
            - args: [["", "\n", ""], 3]
              expected: [[""]]
            - args: [[], 3]
              expected: []
            - args: [["one\n\ntwo\n"], 5]
              expected: [["one", "", "two"]]
            - args: [["id;name\r\n1;Ann\r\n2;Bob", "\r\n3;Cy"], 2]
              expected: [["id;name", "1;Ann"], ["2;Bob", "3;Cy"]]
            - args: [["a", "", "", "b\n", "c"], 1]
              expected: [["ab"], ["c"]]
          solution: |
            export function batchLines(chunks: string[], batchSize: number): string[][] {
              const lines: string[] = [];
              let tail = "";
              for (const chunk of chunks) {
                const text = tail + chunk;
                const parts = text.split("\n");
                tail = parts.pop() ?? "";
                for (const part of parts) lines.push(part.endsWith("\r") ? part.slice(0, -1) : part);
              }
              if (tail.length > 0) lines.push(tail);
              const batches: string[][] = [];
              for (let i = 0; i < lines.length; i += batchSize) {
                batches.push(lines.slice(i, i + batchSize));
              }
              return batches;
            }
      - id: node-memory
        title: "Память и утечки: куча, GC, heap snapshot, лимиты"
        content: lessons/node/node-memory.md
        quiz:
          question: "У сервиса heapUsed стабильно держится около 300 МБ, а rss за сутки вырос с 400 МБ до 1,5 ГБ. Что течёт вероятнее всего?"
          options:
            - id: external
              text: "Внешняя память: буферы незакрытых соединений или нативные ресурсы — они не входят в heapUsed"
              correct: true
            - id: map-cache
              text: "Кэш в Map без ограничения размера, который заполняется на каждом запросе новым ключом"
              explanation: "Объекты и ключи Map живут в куче V8, и такой кэш растил бы heapUsed. Здесь куча стабильна — течёт что-то вне её."
            - id: listeners
              text: "Слушатели EventEmitter, которые подписываются на каждый запрос и никогда не отписываются"
              explanation: "Функции-слушатели и их замыкания — объекты кучи V8. Их накопление было бы видно как рост heapUsed, а он ровный."
            - id: normal
              text: "Ничего не течёт: rss всегда растёт, потому что V8 не возвращает освобождённую память операционной системе"
              explanation: "Фрагментация даёт умеренный рост, но не в четыре раза за сутки. Монотонный рост rss при ровной куче — классический признак утечки вне кучи: буферы, дескрипторы, нативные ресурсы."
      - id: node-errors-shutdown
        title: "Ошибки процесса и graceful shutdown"
        content: lessons/node/node-errors-shutdown.md
        quiz:
          question: "Сервис получил SIGTERM, вызвал server.close() и ждёт его завершения, но процесс живёт до SIGKILL, а операторы получают обрывы запросов. Что происходит?"
          options:
            - id: keepalive
              text: "Keep-alive-соединения от балансировщика остаются открытыми и продолжают приносить запросы; их нужно закрыть явно"
              correct: true
            - id: pool
              text: "server.close() уже закрыл все соединения, а процесс держит незакрытый пул соединений с базой"
              explanation: "server.close() закрывает только слушающий сокет; уже открытые соединения продолжают жить. Пул закрывать нужно, но не он приносит новые запросы и не он обрывает операторов."
            - id: exit
              text: "В обработчике SIGTERM нужно было сразу вызвать process.exit(), не дожидаясь server.close()"
              explanation: "Немедленный exit оборвёт все запросы в обработке — ровно то, ради чего делается graceful shutdown. Проблема в том, что соединения не закрываются, а не в том, что мы ждём."
            - id: signal
              text: "SIGTERM в Node перехватить нельзя, поэтому обработчик не вызывается и close не выполняется"
              explanation: "SIGTERM перехватывается через process.on('SIGTERM'). Не перехватывается только SIGKILL — его и присылает оркестратор по истечении срока ожидания."
      - id: node-practice-shutdown
        title: "Практика: менеджер graceful shutdown"
        content: lessons/node/node-practice-shutdown.md
        practice:
          type: code
          language: typescript
          entry: runShutdown
          prompt: "Реализуйте runShutdown(hooks, timeoutMs): выполните хуки остановки по одному в обратном порядке регистрации, с таймаутом на каждый, продолжая после сбоя, и верните отчёт по правилам урока."
          starter: |
            type Hook = { name: string; behavior: "ok" | "throw" | "hang"; durationMs: number };
            type Result = { name: string; status: "ok" | "failed" | "timeout"; elapsedMs: number };
            type Report = { order: string[]; results: Result[]; totalMs: number };

            export async function runShutdown(hooks: Hook[], timeoutMs: number): Promise<Report> {
              // ...
              return { order: [], results: [], totalMs: 0 };
            }
          cases:
            - args:
                - - { name: "db-pool", behavior: "ok", durationMs: 100 }
                  - { name: "queue", behavior: "hang", durationMs: 0 }
                  - { name: "http", behavior: "throw", durationMs: 50 }
                - 1000
              expected:
                order: ["http", "queue", "db-pool"]
                results:
                  - { name: "http", status: "failed", elapsedMs: 50 }
                  - { name: "queue", status: "timeout", elapsedMs: 1000 }
                  - { name: "db-pool", status: "ok", elapsedMs: 100 }
                totalMs: 1150
            - args:
                - - { name: "a", behavior: "ok", durationMs: 10 }
                  - { name: "b", behavior: "ok", durationMs: 20 }
                  - { name: "c", behavior: "ok", durationMs: 30 }
                - 500
              expected:
                order: ["c", "b", "a"]
                results:
                  - { name: "c", status: "ok", elapsedMs: 30 }
                  - { name: "b", status: "ok", elapsedMs: 20 }
                  - { name: "a", status: "ok", elapsedMs: 10 }
                totalMs: 60
            - args:
                - - { name: "slow", behavior: "ok", durationMs: 800 }
                  - { name: "fast", behavior: "ok", durationMs: 5 }
                - 300
              expected:
                order: ["fast", "slow"]
                results:
                  - { name: "fast", status: "ok", elapsedMs: 5 }
                  - { name: "slow", status: "timeout", elapsedMs: 300 }
                totalMs: 305
            - args:
                - - { name: "only", behavior: "hang", durationMs: 0 }
                - 200
              expected:
                order: ["only"]
                results:
                  - { name: "only", status: "timeout", elapsedMs: 200 }
                totalMs: 200
            - args:
                - []
                - 100
              expected:
                order: []
                results: []
                totalMs: 0
            - args:
                - - { name: "x", behavior: "throw", durationMs: 1 }
                  - { name: "y", behavior: "throw", durationMs: 2 }
                - 100
              expected:
                order: ["y", "x"]
                results:
                  - { name: "y", status: "failed", elapsedMs: 2 }
                  - { name: "x", status: "failed", elapsedMs: 1 }
                totalMs: 3
          solution: |
            type Hook = { name: string; behavior: "ok" | "throw" | "hang"; durationMs: number };
            type Result = { name: string; status: "ok" | "failed" | "timeout"; elapsedMs: number };
            type Report = { order: string[]; results: Result[]; totalMs: number };

            // Время модельное: хук «занимает» durationMs, но реально ждём один
            // оборот цикла. Таймаут побеждает, если хук не уложился бы в timeoutMs.
            function runHook(hook: Hook, timeoutMs: number): Promise<Omit<Result, "name">> {
              const work = new Promise<void>((resolve, reject) => {
                if (hook.behavior === "hang" || hook.durationMs > timeoutMs) return;
                setImmediate(() => {
                  if (hook.behavior === "ok") resolve();
                  else reject(new Error(`${hook.name} failed`));
                });
              });
              const timeout = new Promise<"timeout">((resolve) => {
                setTimeout(() => resolve("timeout"), 20);
              });
              return Promise.race([work.then(() => "done" as const), timeout])
                .then((winner) =>
                  winner === "timeout"
                    ? { status: "timeout" as const, elapsedMs: timeoutMs }
                    : { status: "ok" as const, elapsedMs: hook.durationMs },
                )
                .catch(() => ({ status: "failed" as const, elapsedMs: hook.durationMs }));
            }

            export async function runShutdown(hooks: Hook[], timeoutMs: number): Promise<Report> {
              const order: string[] = [];
              const results: Result[] = [];
              let totalMs = 0;
              for (const hook of [...hooks].reverse()) {
                order.push(hook.name);
                const outcome = await runHook(hook, timeoutMs);
                results.push({ name: hook.name, ...outcome });
                totalMs += outcome.elapsedMs;
              }
              return { order, results, totalMs };
            }

  - id: http
    title: "Модуль 2. HTTP-слой: Express, Fastify, NestJS"
    lessons:
      - id: http-server-anatomy
        title: "Путь запроса: сокет, парсер, keep-alive, таймауты, лимиты тела"
        content: lessons/http/http-server-anatomy.md
        quiz:
          question: "За балансировщиком с idle-таймаутом 60 секунд стоит Node-сервер с keepAliveTimeout по умолчанию (5 секунд). Клиенты изредка получают 502 при нормально работающем сервисе. Что происходит и как чинить?"
          options:
            - id: race
              text: "Сервер закрывает простаивающее соединение в момент, когда балансировщик кладёт туда запрос; лечится keepAliveTimeout больше 60 секунд"
              correct: true
            - id: overload
              text: "Сервер не успевает обрабатывать пики нагрузки, и балансировщик отдаёт 502 по своему таймауту ожидания ответа"
              explanation: "Таймаут ожидания ответа дал бы 504 и коррелировал бы с нагрузкой. Редкие 502 на ровном месте — признак обрыва соединения, а не медленного ответа: запрос ушёл в соединение, которое сервер как раз закрывал."
            - id: headers
              text: "headersTimeout по умолчанию меньше, чем нужно балансировщику, и запросы с большими заголовками отбрасываются"
              explanation: "headersTimeout — 60 секунд на ожидание заголовков, и его превышение оборвало бы конкретные медленные запросы. Здесь же рвутся обычные запросы в момент закрытия простаивающего keep-alive-соединения."
            - id: disable
              text: "Нужно выключить keep-alive между балансировщиком и сервером, чтобы каждый запрос шёл по свежему соединению"
              explanation: "Работать будет, но каждый запрос станет платить за установку TCP-соединения — это заметная задержка и нагрузка. Стандартное лечение — согласовать таймауты: у сервера больше, чем у балансировщика."
      - id: express-middleware
        title: "Express: цепочка middleware, next(err) и async-ловушка"
        content: lessons/http/express-middleware.md
        quiz:
          question: "В сервисе на Express 4 async-обработчик маршрута делает await запроса к базе, и запрос отклоняется с ошибкой. Обработчик ошибок с четырьмя аргументами объявлен последним. Что произойдёт?"
          options:
            - id: unhandled
              text: "Ошибка не попадёт в обработчик: будет unhandled rejection, а запрос повиснет до таймаута"
              correct: true
            - id: caught
              text: "Ошибка попадёт в обработчик ошибок, потому что он объявлен последним и ловит всё"
              explanation: "Express 4 не умеет ждать промисы: отклонение async-обработчика никуда не передаётся, next(err) не вызывается. В обработчик ошибок попадают только синхронные throw и явные next(err) — потому async-обработчики оборачивают в catch(next)."
            - id: five-hundred
              text: "Express отдаст стандартный 500, как делает для любых необработанных ошибок"
              explanation: "Стандартный 500 Express отдаёт, когда ошибка дошла до конца цепочки через next(err) или синхронный throw. Отклонённый промис в Express 4 до цепочки не доходит вовсе — он становится unhandled rejection на уровне процесса."
            - id: crash-immediately
              text: "Процесс мгновенно упадёт, и все остальные запросы оборвутся вместе с этим"
              explanation: "Близко: с Node 15 unhandled rejection действительно роняет процесс. Но валится он не «мгновенно внутри запроса», а на уровне процесса, и запрос перед этим остаётся без ответа — а главное, причина именно в том, что Express 4 не передал отклонение в цепочку."
      - id: express-practice-compose
        title: "Практика: ядро Express — compose цепочки middleware"
        content: lessons/http/express-practice-compose.md
        practice:
          type: code
          language: typescript
          entry: runChain
          prompt: "Реализуйте runChain(middlewares, requestName) — конвейер middleware с семантикой Express: порядок регистрации, остановка после ответа, режим ошибки и обработчики ошибок. Формат журнала и ответов — в уроке."
          starter: |
            type Middleware =
              | { name: string; kind: "normal"; action: "next" | "respond" | "throw" }
              | { name: string; kind: "error"; action: "handle" | "pass" };

            type Outcome = { request: string; log: string[]; response: string };

            export function runChain(middlewares: Middleware[], requestName: string): Outcome {
              // ...
              return { request: requestName, log: [], response: "404" };
            }
          cases:
            - args:
                - - { name: "logger", kind: "normal", action: "next" }
                  - { name: "auth", kind: "normal", action: "throw" }
                  - { name: "route", kind: "normal", action: "respond" }
                  - { name: "errors", kind: "error", action: "handle" }
                - "reassign"
              expected:
                request: "reassign"
                log: ["logger", "auth", "errors!"]
                response: "error:auth:handled-by:errors"
            - args:
                - - { name: "logger", kind: "normal", action: "next" }
                  - { name: "route", kind: "normal", action: "respond" }
                  - { name: "after", kind: "normal", action: "next" }
                - "get-case"
              expected:
                request: "get-case"
                log: ["logger", "route"]
                response: "handled:route"
            - args:
                - - { name: "errors", kind: "error", action: "handle" }
                  - { name: "boom", kind: "normal", action: "throw" }
                - "early-handler"
              expected:
                request: "early-handler"
                log: ["boom"]
                response: "unhandled:boom"
            - args:
                - - { name: "boom", kind: "normal", action: "throw" }
                  - { name: "first", kind: "error", action: "pass" }
                  - { name: "second", kind: "error", action: "handle" }
                - "chain-of-handlers"
              expected:
                request: "chain-of-handlers"
                log: ["boom", "first!", "second!"]
                response: "error:boom:handled-by:second"
            - args:
                - - { name: "a", kind: "normal", action: "next" }
                  - { name: "b", kind: "normal", action: "next" }
                - "no-route"
              expected:
                request: "no-route"
                log: ["a", "b"]
                response: "404"
            - args:
                - []
                - "empty"
              expected:
                request: "empty"
                log: []
                response: "404"
            - args:
                - - { name: "boom", kind: "normal", action: "throw" }
                  - { name: "skipped", kind: "normal", action: "respond" }
                  - { name: "handler", kind: "error", action: "pass" }
                - "unhandled-pass"
              expected:
                request: "unhandled-pass"
                log: ["boom", "handler!"]
                response: "unhandled:boom"
          solution: |
            type Middleware =
              | { name: string; kind: "normal"; action: "next" | "respond" | "throw" }
              | { name: string; kind: "error"; action: "handle" | "pass" };

            type Outcome = { request: string; log: string[]; response: string };

            export function runChain(middlewares: Middleware[], requestName: string): Outcome {
              const log: string[] = [];
              let error: string | undefined;

              for (const mw of middlewares) {
                if (error === undefined) {
                  if (mw.kind !== "normal") continue;
                  log.push(mw.name);
                  if (mw.action === "respond") {
                    return { request: requestName, log, response: `handled:${mw.name}` };
                  }
                  if (mw.action === "throw") error = mw.name;
                } else {
                  if (mw.kind !== "error") continue;
                  log.push(`${mw.name}!`);
                  if (mw.action === "handle") {
                    return { request: requestName, log, response: `error:${error}:handled-by:${mw.name}` };
                  }
                }
              }
              return {
                request: requestName,
                log,
                response: error === undefined ? "404" : `unhandled:${error}`,
              };
            }
