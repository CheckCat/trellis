              explanation: "Middleware выполняется до маршрутизации и не знает, какой обработчик будет вызван, — метаданные @Roles ему недоступны. Раньше всех — да, но декларативные роли читает guard."
      - id: nest-practice-di
        title: "Практика: DI-контейнер с обнаружением циклов"
        content: lessons/http/nest-practice-di.md
        practice:
          type: code
          language: typescript
          entry: instantiate
          prompt: "Реализуйте instantiate(providers, roots): создание провайдеров по графу зависимостей — каждый один раз, deps раньше зависимых, с ошибками unknown: <token> и cycle: A -> B -> A по правилам урока."
          starter: |
            type Provider = { token: string; deps: string[] };
            type Ok = { order: string[] };
            type Err = { error: string };

            export function instantiate(providers: Provider[], roots: string[]): Ok | Err {
              // ...
              return { order: [] };
            }
          cases:
            - args:
                - - { token: "controller", deps: ["service", "logger"] }
                  - { token: "service", deps: ["repo", "logger"] }
                  - { token: "repo", deps: ["db"] }
                  - { token: "db", deps: [] }
                  - { token: "logger", deps: [] }
                - ["controller"]
              expected:
                order: ["db", "repo", "logger", "service", "controller"]
            - args:
                - - { token: "a", deps: ["b"] }
                  - { token: "b", deps: ["c"] }
                  - { token: "c", deps: ["a"] }
                - ["a"]
              expected:
                error: "cycle: a -> b -> c -> a"
            - args:
                - - { token: "a", deps: ["a"] }
                - ["a"]
              expected:
                error: "cycle: a -> a"
            - args:
                - - { token: "a", deps: ["missing"] }
                - ["a"]
              expected:
                error: "unknown: missing"
            - args:
                - - { token: "a", deps: [] }
                - ["ghost"]
              expected:
                error: "unknown: ghost"
            - args:
                - - { token: "a", deps: [] }
                  - { token: "b", deps: ["a"] }
                  - { token: "c", deps: ["a", "b"] }
                - ["b", "c"]
              expected:
                order: ["a", "b", "c"]
            - args:
                - - { token: "solo", deps: [] }
                - ["solo", "solo"]
              expected:
                order: ["solo"]
          solution: |
            type Provider = { token: string; deps: string[] };
            type Ok = { order: string[] };
            type Err = { error: string };

            export function instantiate(providers: Provider[], roots: string[]): Ok | Err {
              const byToken = new Map(providers.map((p) => [p.token, p]));
              const created = new Set<string>();
              const order: string[] = [];
              const path: string[] = [];
              const inPath = new Set<string>();

              function visit(token: string): string | undefined {
                if (created.has(token)) return undefined;
                if (inPath.has(token)) {
                  const start = path.indexOf(token);
                  return `cycle: ${[...path.slice(start), token].join(" -> ")}`;
                }
                const provider = byToken.get(token);
                if (!provider) return `unknown: ${token}`;
                path.push(token);
                inPath.add(token);
                for (const dep of provider.deps) {
                  const err = visit(dep);
                  if (err) return err;
                }
                path.pop();
                inPath.delete(token);
                created.add(token);
                order.push(token);
                return undefined;
              }

              for (const root of roots) {
                const err = visit(root);
                if (err) return { error: err };
              }
              return { order };
            }
      - id: http-validation-errors
        title: "Валидация входа и единый формат ошибок"
        content: lessons/http/http-validation-errors.md
        quiz:
          question: "BFF получил от сервиса customers неожиданное исключение с текстом «duplicate key value violates unique constraint accounts_number_key». Что должен увидеть фронтенд в ответе BFF?"
          options:
            - id: anon
              text: "500 с кодом internal, нейтральным сообщением и correlationId; текст исключения — только в лог"
              correct: true
            - id: passthrough
              text: "500 с этим же текстом в message: фронтенду нужна причина, чтобы показать её оператору"
              explanation: "Текст раскрывает схему чужой базы — это утечка внутренностей наружу. Оператору причина в таком виде бесполезна, а злоумышленнику полезна. Наружу — анонимный internal, подробности — в лог под correlationId."
            - id: conflict
              text: "409 conflict: раз нарушен уникальный ключ, это конфликт данных, и клиент должен его обработать"
              explanation: "409 уместен для ожидаемого доменного конфликта, который сервис распознал и оформил. Здесь исключение неожиданное — программная ошибка или дырка в контракте, — и выдумывать ему осмысленный статус по тексту драйвера нельзя."
            - id: retry
              text: "503 с Retry-After: фронтенд повторит запрос, и вставка, скорее всего, пройдёт"
              explanation: "Повтор не сделает ключ уникальным — ошибка не транзиентная. 503 обещает клиенту, что позже станет лучше, и провоцирует бессмысленные ретраи небезопасной операции."
      - id: http-practice-errors
        title: "Практика: маппинг доменных ошибок в HTTP-ответ"
        content: lessons/http/http-practice-errors.md
        practice:
          type: code
          language: typescript
          entry: toHttpError
          prompt: "Реализуйте toHttpError(err, correlationId) по таблице маппинга из урока: статусы и коды по kind, фиксированные сообщения там, где собственный message наружу не выходит, details только для validation."
          starter: |
            type DomainError = {
              kind?: string;
              message?: string;
              details?: { field: string; issue: string }[];
            };

            type HttpError = {
              status: number;
              body: {
                code: string;
                message: string;
                correlationId: string;
                details?: { field: string; issue: string }[];
              };
            };

            export function toHttpError(err: DomainError, correlationId: string): HttpError {
              // ...
              return { status: 500, body: { code: "internal", message: "Внутренняя ошибка", correlationId } };
            }
          cases:
            - args:
                - { kind: "not-found", message: "Обращение не найдено" }
                - "req-1"
              expected:
                status: 404
                body: { code: "not_found", message: "Обращение не найдено", correlationId: "req-1" }
            - args:
                - { kind: "conflict", message: "Обращение уже закрыто", details: [{ field: "status", issue: "closed" }] }
                - "req-2"
              expected:
                status: 409
                body: { code: "conflict", message: "Обращение уже закрыто", correlationId: "req-2" }
            - args:
                - { kind: "validation", details: [{ field: "customerId", issue: "required" }] }
                - "req-3"
              expected:
                status: 422
                body:
                  code: "validation_failed"
                  message: "Запрос не прошёл валидацию"
                  correlationId: "req-3"
                  details: [{ field: "customerId", issue: "required" }]
            - args:
                - { kind: "validation", message: "field x is broken: internal path /srv/app" }
                - "req-4"
              expected:
                status: 422
                body: { code: "validation_failed", message: "Запрос не прошёл валидацию", correlationId: "req-4" }
            - args:
                - { kind: "boom", message: "connect ECONNREFUSED 10.0.3.17:5432" }
                - "req-5"
              expected:
                status: 500
                body: { code: "internal", message: "Внутренняя ошибка", correlationId: "req-5" }
            - args:
                - {}
                - "req-6"
              expected:
                status: 500
                body: { code: "internal", message: "Внутренняя ошибка", correlationId: "req-6" }
            - args:
                - { kind: "not-found" }
                - "req-7"
              expected:
                status: 404
                body: { code: "not_found", message: "Не найдено", correlationId: "req-7" }
            - args:
                - { kind: "upstream-unavailable", message: "customers at 10.0.4.8 timed out" }
                - "req-8"
              expected:
                status: 503
                body: { code: "upstream_unavailable", message: "Сервис временно недоступен", correlationId: "req-8" }
            - args:
                - { kind: "forbidden", message: "user 42 lacks role supervisor on dept 7" }
                - "req-9"
              expected:
                status: 403
                body: { code: "forbidden", message: "Недостаточно прав", correlationId: "req-9" }
          solution: |
            type DomainError = {
              kind?: string;
              message?: string;
              details?: { field: string; issue: string }[];
            };

            type HttpError = {
              status: number;
              body: {
                code: string;
                message: string;
                correlationId: string;
                details?: { field: string; issue: string }[];
              };
            };

            export function toHttpError(err: DomainError, correlationId: string): HttpError {
              switch (err.kind) {
                case "not-found":
                  return { status: 404, body: { code: "not_found", message: err.message ?? "Не найдено", correlationId } };
                case "conflict":
                  return { status: 409, body: { code: "conflict", message: err.message ?? "Конфликт", correlationId } };
                case "validation": {
                  const body: HttpError["body"] = {
                    code: "validation_failed",
                    message: "Запрос не прошёл валидацию",
                    correlationId,
                  };
                  if (err.details) body.details = err.details;
                  return { status: 422, body };
                }
                case "unauthenticated":
                  return { status: 401, body: { code: "unauthenticated", message: "Требуется вход", correlationId } };
                case "forbidden":
                  return { status: 403, body: { code: "forbidden", message: "Недостаточно прав", correlationId } };
                case "upstream-unavailable":
                  return { status: 503, body: { code: "upstream_unavailable", message: "Сервис временно недоступен", correlationId } };
                default:
                  return { status: 500, body: { code: "internal", message: "Внутренняя ошибка", correlationId } };
              }
            }
      - id: http-frameworks-choice
        title: "Express, Fastify, NestJS, hapi: как выбирать и что говорить на собеседовании"
        content: lessons/http/http-frameworks-choice.md
        quiz:
          question: "Команда из двенадцати человек начинает продуктовый сервис банковской платформы, где уже есть сервисы на NestJS. Тимлид предлагает писать на Fastify, «потому что он быстрее». Какой ответ здесь уровня сеньора?"
          options:
            - id: context
              text: "Сервис CRUD-типа упрётся в базу, а не во фреймворк; единообразие платформы и структура Nest для большой команды весят больше, чем скорость сериализации"
              correct: true
            - id: agree
              text: "Согласиться: бенчмарки показывают двукратное преимущество Fastify, и для банка производительность критична"
              explanation: "Бенчмарки на hello world не переносятся на сервис, который 90 % времени ждёт базу и соседние сервисы. Аргумент «быстрее» без профиля нагрузки — выбор по моде, и в нём нет ни команды, ни контекста платформы."
            - id: express
              text: "Предложить Express как компромисс: его знают все, а спор о скорости отпадёт сам"
              explanation: "Express добавляет третий стек в платформу и не даёт ни структуры для двенадцати человек, ни валидации из коробки. Компромисс, ухудшающий обе альтернативы, — не решение."
            - id: nest-fastify
              text: "Взять Nest поверх Fastify-адаптера: и структура, и скорость — возражений не останется"
              explanation: "Технически возможно и иногда осмысленно, но как ответ уходит от сути: выбор обосновывается свойствами под задачу и команду, а не тем, чтобы «возражений не осталось». Адаптер Fastify стоит брать, когда профиль нагрузки этого просит."
      - id: http-bun-hono
        title: "Bun и Hono: новый рантайм и фреймворк на веб-стандартах"
        content: lessons/http/http-bun-hono.md
        quiz:
          question: "Команда предлагает перевести агрегирующий BFF с Node на Bun: «бенчмарки показывают вдвое больше запросов в секунду». Какой ответ отличает сеньора?"
          options:
            - id: profile-first
              text: "Бенчмарк hello world сюда не переносится: BFF ждёт внутренние сервисы, а не рантайм; сначала профиль нагрузки и аудит зависимостей"
              correct: true
            - id: agree-bench
              text: "Согласиться: рантайм, дающий вдвое больший RPS в бенчмарках, даст сопоставимый прирост пропускной способности и в проде"
              explanation: "Hello world меряет парсинг и сериализацию, а BFF почти всё время ждёт соседние сервисы — это ожидание от рантайма не зависит. Прирост на проде утонет в сети, а цена совместимости и эксплуатации останется."
            - id: refuse-rewrite
              text: "Отказаться: Bun несовместим с Node, сервис пришлось бы переписывать целиком"
              explanation: "Bun реализует большую часть node:*-API и запускает большинство пакетов npm без правок. Вопрос не «переписывать ли всё», а совместимы ли конкретные зависимости и инструменты эксплуатации — это проверяется аудитом, а не постулируется."
            - id: hono-instead
              text: "Предложить компромисс: перевести BFF на Hono — он даст ту же скорость, оставаясь на Node"
              explanation: "Hono — фреймворк, а не рантайм: его смысл — переносимость кода между средами исполнения через веб-стандарты, а не ускорение Node. Подмена рантайма фреймворком в таком споре выдаёт кашу в уровнях платформы."

  - id: api
    title: "Модуль 3. Проектирование API и контрактов"
    lessons:
      - id: api-rest-design
        title: "REST по-взрослому: ресурсы, методы, статус-коды"
        content: lessons/api/api-rest-design.md
        quiz:
          question: "Оператор с валидной сессией, но без роли супервизора, запрашивает GET на служебный отчёт своего отдела. Отдельно: неавторизованный запрос пришёл на историю операций чужого клиента. Какая пара статусов правильная?"
          options:
            - id: right
              text: "403 на отчёт (знаем, кто ты, но нельзя) и 401 на историю (не знаем, кто ты)"
              correct: true
            - id: swap
              text: "401 на отчёт, потому что прав не хватает; 403 на историю, потому что ресурс чужой"
              explanation: "Ровно наоборот: 401 — «я не знаю, кто ты» (нет или протух токен), 403 — «знаю, и тебе нельзя». У оператора сессия валидна — это 403; у второго запроса аутентификации нет вовсе — это 401."
            - id: all404
              text: "404 в обоих случаях: так безопаснее всего, ресурсы просто не существуют для посторонних"
              explanation: "404 уместен, чтобы не подтверждать существование чужого приватного ресурса аутентифицированному пользователю. Но неаутентифицированный запрос должен получать 401 — клиенту нужно понять, что требуется вход, иначе он не сможет починиться."
            - id: all403
              text: "403 в обоих случаях: доступ запрещён, и не важно почему"
              explanation: "403 неаутентифицированному прячет от клиента причину: он не поймёт, что нужно просто войти или обновить токен. Разделение 401/403 — часть контракта, по нему ветвится логика клиента."
      - id: api-idempotency
        title: "Идемпотентность и ключ идемпотентности"
        content: lessons/api/api-idempotency.md
        quiz:
          question: "Сервис принимает POST списания с Idempotency-Key. Реализация: обработчик проверяет SELECT-ом, есть ли ключ; если нет — выполняет списание и затем INSERT-ит ключ с результатом. Что с этой схемой не так?"
          options:
            - id: race
              text: "Между SELECT и INSERT есть окно: два одновременных запроса оба увидят «ключа нет» и оба спишут"
              correct: true
            - id: fine
              text: "Всё в порядке: повтор придёт позже первого запроса и увидит сохранённый ключ"
              explanation: "Повторы приходят и одновременно — двойной клик, агрессивный ретрай клиента. Между SELECT и INSERT есть окно, в котором второй запрос видит пустоту и выполняет списание второй раз."
            - id: server-key
              text: "Ключ должен генерировать сервер, а не клиент, иначе клиент может прислать неуникальный ключ"
              explanation: "Ключ обязан генерировать именно инициатор: только клиент знает, что два запроса — это одна и та же операция. Серверный ключ делает механизм бесполезным: повтор клиента получит новый ключ и создаст дубль."
            - id: get-too
              text: "Ключ идемпотентности нужно требовать и на GET-запросах, иначе защита неполная"
              explanation: "GET безопасен и идемпотентен по спецификации — его повтор ничего не меняет. Ключи нужны небезопасным операциям, в первую очередь POST."
      - id: api-practice-idempotency
        title: "Практика: обработчик с Idempotency-Key"
        content: lessons/api/api-practice-idempotency.md
        practice:
          type: code
          language: typescript
          entry: processRequests
          prompt: "Реализуйте processRequests(requests): обработку последовательности запросов с Idempotency-Key — первое выполнение, replay, конфликт тела, конкурентный повтор. Форматы результатов — в уроке."
          starter: |
            type Request = {
              id: string;
              key: string;
              amount: number;
              concurrentWith?: string;
            };

            type Outcome = {
              log: { id: string; outcome: string }[];
              totalCharged: number;
            };

            export function processRequests(requests: Request[]): Outcome {
              // ...
              return { log: [], totalCharged: 0 };
            }
          cases:
            - args:
                - - { id: "r1", key: "k1", amount: 100 }
                  - { id: "r2", key: "k1", amount: 100 }
                  - { id: "r3", key: "k1", amount: 250 }
              expected:
                log:
                  - { id: "r1", outcome: "charged:100" }
                  - { id: "r2", outcome: "replay:charged:100" }
                  - { id: "r3", outcome: "error:key_reused_with_different_body" }
                totalCharged: 100
            - args:
                - - { id: "r1", key: "k1", amount: 100 }
                  - { id: "r2", key: "k1", amount: 100, concurrentWith: "r1" }
                  - { id: "r3", key: "k1", amount: 100 }
              expected:
                log:
                  - { id: "r1", outcome: "charged:100" }
                  - { id: "r2", outcome: "in_progress" }
                  - { id: "r3", outcome: "replay:charged:100" }
                totalCharged: 100
            - args:
                - - { id: "a", key: "k1", amount: 500 }
                  - { id: "b", key: "k2", amount: 500 }
              expected:
                log:
                  - { id: "a", outcome: "charged:500" }
                  - { id: "b", outcome: "charged:500" }
                totalCharged: 1000
            - args:
                - - { id: "r1", key: "k1", amount: 100 }
                  - { id: "r2", key: "k1", amount: 999 }
                  - { id: "r3", key: "k1", amount: 100 }
              expected:
                log:
                  - { id: "r1", outcome: "charged:100" }
                  - { id: "r2", outcome: "error:key_reused_with_different_body" }
                  - { id: "r3", outcome: "replay:charged:100" }
                totalCharged: 100
            - args:
                - - { id: "r1", key: "k1", amount: 100 }
                  - { id: "r2", key: "k2", amount: 200, concurrentWith: "r1" }
              expected:
                log:
                  - { id: "r1", outcome: "charged:100" }
                  - { id: "r2", outcome: "charged:200" }
                totalCharged: 300
            - args:
                - []
              expected:
                log: []
                totalCharged: 0
          solution: |
            type Request = {
              id: string;
              key: string;
              amount: number;
              concurrentWith?: string;
            };

            type Outcome = {
              log: { id: string; outcome: string }[];
              totalCharged: number;
            };

            export function processRequests(requests: Request[]): Outcome {
              const log: { id: string; outcome: string }[] = [];
              const stored = new Map<string, { amount: number; result: string }>();
              const keyOf = new Map<string, string>();
              let totalCharged = 0;

              for (const req of requests) {
                keyOf.set(req.id, req.key);
                const concurrentSameKey =
                  req.concurrentWith !== undefined && keyOf.get(req.concurrentWith) === req.key;
                if (concurrentSameKey) {
                  log.push({ id: req.id, outcome: "in_progress" });
                  continue;
                }
                const existing = stored.get(req.key);
                if (existing === undefined) {
                  const result = `charged:${req.amount}`;
                  stored.set(req.key, { amount: req.amount, result });
                  totalCharged += req.amount;
                  log.push({ id: req.id, outcome: result });
                } else if (existing.amount !== req.amount) {
                  log.push({ id: req.id, outcome: "error:key_reused_with_different_body" });
                } else {
                  log.push({ id: req.id, outcome: `replay:${existing.result}` });
                }
              }
              return { log, totalCharged };
            }
      - id: scr-crowdwiz
        title: "Пункт 1. Соло-проект: полный цикл от схемы данных до платежей"
        content: lessons/api/scr-crowdwiz.md
        quiz:
          question: "Платёжная система прислала вебхук «платёж прошёл» второй раз (первый ответ сервера до неё не дошёл). Что делает правильно написанный обработчик?"
          options:
            - id: dedupe
              text: "Находит платёж по его идентификатору, видит, что он уже обработан, и отвечает 200, не зачисляя доступ повторно"
              correct: true
            - id: error-409
              text: "Отвечает ошибкой 409: повторный вебхук — нарушение протокола, платёжная система должна разобраться у себя"
              explanation: "Повтор — не нарушение, а норма: доставка «хотя бы раз» означает, что при потерянном ответе событие придёт снова. Получив не-200, платёжная система продолжит слать повторы или поднимет тревогу."
            - id: trust-provider
              text: "Зачисляет ещё раз: платёжные системы не шлют дубликатов, второй вебхук — это второй платёж"
              explanation: "Шлют, и это записано в их документации: не получив ответа 200, система повторяет доставку того же события. Идентификатор платежа в обоих вебхуках один — а двойное зачисление по нему — прямой финансовый баг."
            - id: ignore
              text: "Молча игнорирует запрос без ответа: обработка уже была, отвечать второй раз не на что"
              explanation: "Без ответа 200 платёжная система считает доставку неудавшейся и будет повторять её снова и снова. Идемпотентность — это «обработать без повторного эффекта и подтвердить», а не «промолчать»."
      - id: api-pagination
        title: "Пагинация, фильтрация, сортировка: offset против cursor"
        content: lessons/api/api-pagination.md
        quiz:
          question: "Журнал аудита листается keyset-курсором по created_at по убыванию. Пользователи жалуются: на границах страниц записи иногда дублируются, иногда пропадают. В чём причина?"
          options:
            - id: tiebreaker
              text: "created_at не уникален: курсор по одному времени не указывает на строку однозначно — нужна пара (created_at, id)"
              correct: true
            - id: inserts
              text: "Во время листания вставляются новые записи, и они сдвигают границы страниц"
              explanation: "Сдвиг границ от вставок — болезнь offset-пагинации. Keyset от неё как раз свободен: граница задана значениями строки, и новые записи выше границы её не двигают. Причина здесь в неоднозначности самой границы."
            - id: base64
              text: "Курсор закодирован в base64, и при передаче теряется точность метки времени"
              explanation: "base64 — обратимое кодирование без потерь, точность в нём потеряться не может. Проблема в содержимом курсора: одного created_at мало, чтобы однозначно назвать последнюю увиденную строку."
            - id: index
              text: "Нет индекса по created_at, и база возвращает строки в непредсказуемом порядке"
              explanation: "Без индекса запрос был бы медленным, но ORDER BY порядок всё равно гарантирует. Непредсказуема здесь не сортировка, а положение границы среди строк с одинаковым временем — это решается tiebreaker-ом по id."
      - id: api-practice-cursor
        title: "Практика: курсорная пагинация"
        content: lessons/api/api-practice-cursor.md
        practice:
          type: code
          language: typescript
          entry: getPage
          prompt: "Реализуйте getPage(operations, cursor, limit): keyset-страница по (createdAt, id) по убыванию, base64-курсор {\"c\":...,\"i\":...}, nextCursor: null на последней странице, bad_cursor на испорченном курсоре."
          starter: |
            type Operation = { id: number; createdAt: string; amount: number };
            type Page = { items: Operation[]; nextCursor: string | null; error?: string };

            export function getPage(
              operations: Operation[],
              cursor: string | null,
              limit: number,
            ): Page {
              // ...
              return { items: [], nextCursor: null };
            }
          cases:
            - args:
                - - { id: 5, createdAt: "2026-03-07T12:00:00Z", amount: 100 }
                  - { id: 3, createdAt: "2026-03-06T09:00:00Z", amount: 50 }
                  - { id: 4, createdAt: "2026-03-07T12:00:00Z", amount: 70 }
                - null
                - 2
              expected:
                items:
                  - { id: 5, createdAt: "2026-03-07T12:00:00Z", amount: 100 }
                  - { id: 4, createdAt: "2026-03-07T12:00:00Z", amount: 70 }
                nextCursor: "eyJjIjoiMjAyNi0wMy0wN1QxMjowMDowMFoiLCJpIjo0fQ=="
            - args:
                - - { id: 5, createdAt: "2026-03-07T12:00:00Z", amount: 100 }
                  - { id: 3, createdAt: "2026-03-06T09:00:00Z", amount: 50 }
                  - { id: 4, createdAt: "2026-03-07T12:00:00Z", amount: 70 }
                - "eyJjIjoiMjAyNi0wMy0wN1QxMjowMDowMFoiLCJpIjo0fQ=="
                - 2
              expected:
                items:
                  - { id: 3, createdAt: "2026-03-06T09:00:00Z", amount: 50 }
                nextCursor: null
            - args:
                - - { id: 1, createdAt: "2026-01-01T00:00:00Z", amount: 10 }
                  - { id: 2, createdAt: "2026-01-02T00:00:00Z", amount: 20 }
                - null
                - 2
              expected:
                items:
                  - { id: 2, createdAt: "2026-01-02T00:00:00Z", amount: 20 }
                  - { id: 1, createdAt: "2026-01-01T00:00:00Z", amount: 10 }
                nextCursor: null
            - args:
                - - { id: 1, createdAt: "2026-01-01T00:00:00Z", amount: 10 }
                - "not-a-cursor!!!"
                - 5
              expected:
                items: []
                nextCursor: null
                error: "bad_cursor"
            - args:
                - []
                - null
                - 3
              expected:
                items: []
                nextCursor: null
          solution: |
            type Operation = { id: number; createdAt: string; amount: number };
            type Page = { items: Operation[]; nextCursor: string | null; error?: string };

            export function getPage(
              operations: Operation[],
              cursor: string | null,
              limit: number,
            ): Page {
              let boundary: { c: string; i: number } | null = null;
              if (cursor !== null) {
                try {
                  const parsed = JSON.parse(Buffer.from(cursor, "base64").toString("utf8"));
                  if (typeof parsed?.c !== "string" || typeof parsed?.i !== "number") throw new Error();
                  boundary = parsed;
                } catch {
                  return { items: [], nextCursor: null, error: "bad_cursor" };
                }
              }

              const sorted = [...operations].sort((a, b) =>
                a.createdAt === b.createdAt ? b.id - a.id : (a.createdAt < b.createdAt ? 1 : -1),
              );
              const after = boundary
                ? sorted.filter(
                    (op) =>
                      op.createdAt < boundary.c ||
                      (op.createdAt === boundary.c && op.id < boundary.i),
                  )
                : sorted;
              const items = after.slice(0, limit);
              const hasMore = after.length > items.length;
              const last = items[items.length - 1];
              const nextCursor =
                hasMore && last
                  ? Buffer.from(JSON.stringify({ c: last.createdAt, i: last.id })).toString("base64")
                  : null;
              return { items, nextCursor };
            }
      - id: api-evolution
        title: "Версионирование и эволюция контракта: OpenAPI, contract-first, deprecation"
        content: lessons/api/api-evolution.md
        quiz:
          question: "Сервису customers нужно добавить новый статус карты «на перевыпуске» в ответ, которым уже пользуются три команды. Какое утверждение верно?"
          options:
            - id: breaking
              text: "Расширение enum в ответе — несовместимое изменение: старые клиенты встретят незнакомый статус; нужен план — новое поле, версия или согласованный переезд потребителей"
              correct: true
            - id: additive
              text: "Это совместимое изменение: добавление нового значения — то же, что добавление нового поля, клиенты обязаны его игнорировать"
              explanation: "Правило «игнорируй незнакомое» работает для новых полей: клиент их просто не читает. Незнакомое значение в поле, которое клиент читает и по которому ветвится, проигнорировать нельзя — switch без ветки default падает или ведёт себя неверно."
            - id: request-same
              text: "Несовместимо в обе стороны: и в ответе, и в запросе расширение enum ломает клиентов одинаково"
              explanation: "В запросе enum расширяет сервер у себя — старые клиенты продолжают слать старые значения, и для них ничего не меняется. Асимметрия «запрос расширять можно, ответ — нельзя» — суть этого вопроса."
            - id: semver
              text: "Достаточно поднять минорную версию в семвере пакета клиента, это и есть сигнал о совместимом изменении"
              explanation: "Версия пакета ничего не делает с уже развёрнутыми потребителями: они узнают о новом статусе, только встретив его в проде. Совместимость определяется поведением контракта, а не числом в манифесте."
      - id: api-bff
        title: "BFF: зачем нужен, чем опасен и как устроен ваш"
        content: lessons/api/api-bff.md
        quiz:
          question: "BFF собирает экран обращения из пяти сервисов через Promise.all. Сервис справочников начал отдавать 500, и у всех операторов перестал открываться весь экран. Какой вывод правильный?"
          options:
            - id: settled
              text: "Агрегация должна строиться на allSettled с таймаутом на каждый вызов: обязательные блоки решают судьбу ответа, необязательные деградируют заглушкой"
              correct: true
            - id: retry-fix
              text: "Нужно добавить ретраи вызова справочников — три попытки, и экран снова будет открываться"
              explanation: "Ретраи в лежащий сервис умножают нагрузку на него и удлиняют ответ BFF, а при устойчивом отказе экран всё равно не откроется. Первичен дизайн деградации: некритичный блок не должен решать судьбу всего экрана."
            - id: cache-fix
              text: "Справочники нужно закэшировать в BFF, тогда их сервис вообще не будет участвовать в сборке экрана"
              explanation: "Кэш справочников — хорошая практика и смягчил бы именно этот случай, но не отвечает на системный вопрос: любой из пяти сервисов может упасть, и судьбу экрана должна решать явная политика частичных ответов, а не наличие кэша у одного из них."
            - id: split
              text: "Фронтенд должен ходить в пять сервисов сам: тогда падение одного не затронет остальные запросы"
              explanation: "Это отменяет BFF и возвращает исходные проблемы: раундтрипы по медленной сети, пять форматов ошибок, привязку экранов к устройству сервисов. Частичность ответа достигается внутри BFF, а не отказом от него."
      - id: scr-bff
        title: "Пункт 2. Альфа-Банк: BFF как полноценный сервис"
        content: lessons/api/scr-bff.md
        quiz:
          question: "Экран оператора собирается из пяти внутренних сервисов. Сервис истории операций стал отвечать за 8 секунд вместо 200 мс. Как должен повести себя правильно спроектированный BFF?"
          options:
            - id: partial
              text: "Ограничить ожидание истории таймаутом и отдать экран без неё, пометив блок недоступным: остальные данные оператор получает сразу"
              correct: true
            - id: wait-all
              text: "Дождаться всех пяти ответов и отдать экран целиком: оператору нужна полная картина по клиенту"
              explanation: "Оператор с клиентом на линии ждёт 8 секунд из-за одного второстепенного блока — и так на каждом открытии карточки. Частичный ответ с пометкой честнее: полнота здесь дешевле доступности."
            - id: fail-fast
              text: "Сразу отдать ошибку 500: раз один из источников данных деградировал, целостного ответа не существует"
              explanation: "Четыре сервиса из пяти ответили нормально — превращать частичную деградацию в полный отказ рабочего места означает усилить аварию своими руками."
            - id: retry-until
              text: "Повторять запрос к истории, пока она не ответит: данные в итоге доедут, оператор увидит полный экран"
              explanation: "Повторы добавляют нагрузки и без того замедлившемуся сервису и не снимают главного: оператор всё это время смотрит на спиннер. Ожидание ограничивают, а не растягивают повторами."
      - id: api-graphql-grpc
        title: "GraphQL и gRPC против REST: схемы, N+1, стриминг"
        content: lessons/api/api-graphql-grpc.md
        quiz:
          question: "GraphQL-запрос забирает 50 обращений с именем клиента у каждого. В логах базы — 51 запрос: один за списком и по одному за каждым клиентом. Что происходит и как чинить?"
          options:
            - id: dataloader
              text: "Классический N+1 резолверов: резолвер customer вызывается на каждое обращение; лечится батчингом — собрать id за тик и забрать всех одним WHERE id = ANY"
              correct: true
            - id: join-schema
              text: "Ошибка в схеме: поле customer нужно объявить вложенным типом, тогда GraphQL сам сделает JOIN"
              explanation: "GraphQL ничего не знает о базе и никаких JOIN не делает: схема описывает форму данных, а способ их получения — целиком дело резолверов. Вложенность типа как раз и порождает по вызову резолвера на элемент."
            - id: http-cache
              text: "Нужно включить HTTP-кэширование ответов GraphQL, чтобы повторные клиенты не порождали запросы к базе"
              explanation: "HTTP-кэш с GraphQL почти не работает (POST на одну точку), но главное — он про повторные запросы клиентов, а здесь 51 запрос к базе рождает один единственный запрос клиента."
            - id: parallel
              text: "Это нормально: 50 запросов уходят параллельно и по времени равны одному, просто логи выглядят страшно"
              explanation: "Параллельность смягчает задержку, но не цену: 50 отдельных запросов — это 50 раундтрипов, 50 разборов запроса и захваченных соединений пула. Под нагрузкой именно так базы и умирают."
      - id: api-practice-dataloader
        title: "Практика: DataLoader — батчинг и кэш на тик"
        content: lessons/api/api-practice-dataloader.md
        practice:
          type: code
          language: typescript
          entry: demo
          prompt: "Реализуйте createLoader(batchFn) с батчингом за тик, схлопыванием дублей, кэшем и некэшируемыми ошибками — и demo(keysets), прогоняющую раунды по правилам урока."
          starter: |
            type BatchFn = (keys: number[]) => Promise<(string | Error)[]>;

            function createLoader(batchFn: BatchFn) {
              return {
                load(key: number): Promise<string> {
                  // ...
                  return Promise.reject(new Error("not implemented"));
                },
              };
            }

            export async function demo(keysets: number[][]): Promise<{
              batches: number[][];
              results: (string | { error: string })[][];
            }> {
              const batches: number[][] = [];
              const batchFn: BatchFn = async (keys) => {
                batches.push([...keys]);
                return keys.map((k) => (k > 0 ? "v" + k : new Error("no " + k)));
              };
              const loader = createLoader(batchFn);
              const results: (string | { error: string })[][] = [];
              // для каждого набора: load всех ключей, allSettled, затем следующий
              return { batches, results };
            }
          cases:
            - args: [[[1, 2, 1], [2, 3]]]
              expected:
                batches: [[1, 2], [3]]
                results: [["v1", "v2", "v1"], ["v2", "v3"]]
            - args: [[[5]]]
              expected:
                batches: [[5]]
                results: [["v5"]]
            - args: [[[1, -3, 2]]]
              expected:
                batches: [[1, -3, 2]]
                results: [["v1", { error: "no -3" }, "v2"]]
            - args: [[[-1], [-1]]]
              expected:
                batches: [[-1], [-1]]
                results: [[{ error: "no -1" }], [{ error: "no -1" }]]
            - args: [[[], [7]]]
              expected:
                batches: [[7]]
                results: [[], ["v7"]]
            - args: [[[4, 4, 4]]]
              expected:
                batches: [[4]]
                results: [["v4", "v4", "v4"]]
          solution: |
            type BatchFn = (keys: number[]) => Promise<(string | Error)[]>;

            function createLoader(batchFn: BatchFn) {
              const cache = new Map<number, string>();
              let pending: Map<number, { resolve: (v: string) => void; reject: (e: Error) => void }[]> | null = null;

              function schedule() {
                if (pending !== null) return;
                pending = new Map();
                queueMicrotask(async () => {
                  const batch = pending!;
                  pending = null;
                  const keys = [...batch.keys()];
                  if (keys.length === 0) return;
                  let values: (string | Error)[];
                  try {
                    values = await batchFn(keys);
                  } catch (err) {
                    for (const waiters of batch.values())
                      for (const w of waiters) w.reject(err as Error);
                    return;
                  }
                  if (values.length !== keys.length) {
                    const err = new Error("batch length mismatch");
                    for (const waiters of batch.values())
                      for (const w of waiters) w.reject(err);
                    return;
                  }
                  keys.forEach((key, i) => {
                    const value = values[i];
                    const waiters = batch.get(key)!;
                    if (value instanceof Error) {
                      for (const w of waiters) w.reject(value);
                    } else {
                      cache.set(key, value);
                      for (const w of waiters) w.resolve(value);
                    }
                  });
                });
              }

              return {
                load(key: number): Promise<string> {
                  const cached = cache.get(key);
                  if (cached !== undefined) return Promise.resolve(cached);
                  return new Promise<string>((resolve, reject) => {
                    schedule();
                    const waiters = pending!.get(key) ?? [];
                    waiters.push({ resolve, reject });
                    pending!.set(key, waiters);
                  });
                },
              };
            }

            export async function demo(keysets: number[][]): Promise<{
              batches: number[][];
              results: (string | { error: string })[][];
            }> {
              const batches: number[][] = [];
              const batchFn: BatchFn = async (keys) => {
                batches.push([...keys]);
                return keys.map((k) => (k > 0 ? "v" + k : new Error("no " + k)));
              };
              const loader = createLoader(batchFn);
              const results: (string | { error: string })[][] = [];
              for (const set of keysets) {
                const settled = await Promise.allSettled(set.map((k) => loader.load(k)));
                results.push(
                  settled.map((s) =>
                    s.status === "fulfilled" ? s.value : { error: (s.reason as Error).message },
                  ),
                );
              }
              return { batches, results };
            }
      - id: scr-innotech
        title: "Пункт 3. Иннотех: GraphQL-контракты и кодогенерация"
        content: lessons/api/scr-innotech.md
        quiz:
          question: "Бэк-команда переименовала поле в GraphQL-схеме. При каком подходе фронтенд узнаёт об этом до прода?"
          options:
            - id: codegen
              text: "Типы и клиенты сгенерированы из схемы: после регенерации сборка падает на обращении к исчезнувшему полю"
              correct: true
            - id: manual-types
              text: "Типы написаны руками по документации: TypeScript строгий и сам заметит несоответствие поля"
              explanation: "TypeScript проверяет код против типов, а не против живой схемы сервера. Рукописный тип продолжит утверждать, что поле существует, — и правда вскроется только в рантайме."
            - id: e2e
              text: "Никак до прода не узнать: расхождение контракта ловится только сквозными тестами на стенде"
              explanation: "Сквозные тесты — поздний и дырявый рубеж: они проверяют пройденные сценарии, а не контракт целиком. Кодогенерация ловит то же самое раньше и полностью — на сборке."
            - id: review
              text: "Через code review: изменение схемы обязано пройти через ревьюера, который знает, какие поля использует фронт"
              explanation: "Держать в голове все места использования всех полей ревьюер не может — это и есть работа для машины. Ревью контракта полезно для смысла изменения, а совместимость проверяет генерация."
      - id: api-realtime
        title: "WebSocket, SSE, long polling: реалтайм со стороны сервера и его масштабирование"
        content: lessons/api/api-realtime.md
        quiz:
          question: "BFF масштабировали с одного инстанса до трёх, и уведомления «вам назначено обращение» стали доходить примерно до трети операторов. Почему и что чинить?"
          options:
            - id: pubsub
              text: "Событие обрабатывает один инстанс, а соединение оператора живёт на другом; нужен pub/sub между инстансами: событие получают все, отправляет владелец соединения"
              correct: true
            - id: sticky
              text: "Нужно включить sticky sessions на балансировщике, чтобы оператор всегда попадал на свой инстанс"
              explanation: "Sticky привязывает клиента к инстансу, но событие рождается не из запроса клиента — оно приходит из шины на произвольный инстанс. Доставку решает мост между инстансами, а не привязка клиентов."
            - id: scale-back
              text: "WebSocket нельзя масштабировать горизонтально; нужно вернуть один инстанс помощнее"
              explanation: "Можно и масштабируют повсеместно: соединения остаются локальными, а события делаются глобальными через pub/sub. Возврат к одному инстансу — отказ от отказоустойчивости ради ложного ограничения."
            - id: polling
              text: "Треть — это совпадение с числом инстансов случайно; причина в том, что клиенты не переподключаются после обрывов"
              explanation: "Совпадение не случайно: уведомление доставляется только операторам, чьи соединения живут на том же инстансе, куда пришло событие, — это ровно треть. Переподключение — отдельная тема, но систематическую потерю двух третей объясняет именно локальность соединений."

  - id: postgres
    title: "Модуль 4. PostgreSQL и работа с данными"
    lessons:
      - id: pg-schema
        title: "Схема данных «Пульта»: нормализация, ключи, ограничения"
        content: lessons/postgres/pg-schema.md
        quiz:
          question: "В таблице карт хранится дневной лимит. Разработчик предлагает тип double precision — «числа как числа, зачем усложнять». Почему в банковской схеме это отклонят?"
          options:
            - id: float-broken
              text: "Двоичная плавающая точка не представляет десятичные доли точно: суммы поплывут на копейки; деньги — numeric или целые минорные единицы"
              correct: true
            - id: too-small
              text: "double слишком мал по диапазону для банковских сумм, большие лимиты не поместятся"
              explanation: "Диапазон double огромен — порядка 10^308, дело не в нём. Дело в точности представления: 0.1 в двоичной форме бесконечен, и арифметика накапливает расхождения в копейках."
            - id: no-index
              text: "По столбцам с плавающей точкой нельзя строить индексы, и запросы по лимиту станут медленными"
              explanation: "Индексы по float строятся как по любому типу. Проблема не в индексируемости, а в том, что само значение хранится неточно."
            - id: null-issue
              text: "double не умеет NULL, а лимит может быть не задан"
              explanation: "NULL — свойство столбца, а не типа: любой тип может быть nullable. Возражение против double — точность десятичной арифметики."
      - id: pg-practice-report
        title: "Практика: отчёт по нагрузке операторов"
        content: lessons/postgres/pg-practice-report.md
        practice:
          type: sql
          sandbox: pult
          prompt: "По каждому оператору: имя, число открытых обращений (open или in_progress; 0 — если нет) и время создания самого раннего открытого (NULL — если нет). Сортировка: по числу открытых по убыванию, затем по имени по алфавиту. Столбцы и их порядок — как в уроке."
          expected: |
            select
              o.full_name,
              count(c.id) as open_cases,
              min(c.created_at) as oldest_open
            from operators o
            left join cases c
              on c.assignee_id = o.id
              and c.status in ('open', 'in_progress')
            group by o.id, o.full_name
            order by open_cases desc, o.full_name
          ordered: true
      - id: pg-indexes
        title: "Индексы: B-tree, составные, частичные, покрывающие и EXPLAIN"
        content: lessons/postgres/pg-indexes.md
        quiz:
          question: "Запрос WHERE assignee_id = $1 AND status = 'open' ORDER BY created_at DESC LIMIT 50 обслуживается индексом. Какой индекс подходит лучше всего?"
          options:
            - id: right-order
              text: "(assignee_id, status, created_at DESC) — равенства слева, сортировка последним столбцом"
              correct: true
            - id: created-first
              text: "(created_at DESC, assignee_id, status) — сортировка важнее всего, значит created_at должен быть первым"
              explanation: "Составной B-tree работает слева направо: без равенства по ведущему столбцу спуститься по дереву к нужному оператору нельзя. Такой индекс заставит читать все свежие обращения подряд, фильтруя чужие."
            - id: three-separate
              text: "Три отдельных индекса по assignee_id, status и created_at — планировщик сам их объединит"
              explanation: "Объединение возможно (bitmap), но это дороже одного составного: сортировку из битовой карты не получить, ORDER BY придётся выполнять отдельно, и LIMIT 50 перестаёт быть дешёвым."
            - id: covering-any
              text: "Любой из перечисленных, если добавить INCLUDE со всеми столбцами запроса: покрывающий индекс всегда быстрее"
              explanation: "INCLUDE избавляет от походов в таблицу, но не чинит порядок ключевых столбцов: по индексу с created_at во главе всё равно нельзя спуститься к конкретному оператору. Сначала правильные ключи, потом покрытие."
      - id: pg-practice-index
        title: "Практика: частичный индекс под горячий запрос"
        content: lessons/postgres/pg-practice-index.md
        practice:
          type: sql
          sandbox: pult
          prompt: "Создайте частичный индекс cases_open_by_assignee на cases: ключи (assignee_id, created_at DESC), условие status in ('open', 'in_progress'). Имя индекса — часть задания."
          # Настоящую проверку делает check по каталогу pg_indexes:
          # сравнение состояния видит только строки таблиц, а не
          # индексы. solution всё же объявлен — он сторожит одно:
          # попытка не должна менять данные (иначе состояние разойдётся
          # с эталонным «данные нетронуты»).
          solution: |
            create index cases_open_by_assignee
            on cases (assignee_id, created_at desc)
            where status in ('open', 'in_progress');
          check: |
            select exists (
              select 1
              from pg_indexes
              where schemaname = current_schema()
                and tablename = 'cases'
                and indexname = 'cases_open_by_assignee'
                and indexdef ilike '%(assignee_id, created_at DESC)%'
                and indexdef ilike '%where%status%'
            )
      - id: pg-transactions
        title: "Транзакции, уровни изоляции, аномалии и MVCC"
        content: lessons/postgres/pg-transactions.md
        quiz:
          question: "Ночной отчёт читает базу двадцать минут в одной транзакции Read Committed. Пишущие запросы он не блокирует, но админ жалуется, что после таких ночей таблицы «пухнут». Почему?"
          options:
            - id: vacuum
              text: "Пока жива транзакция со старым снимком, VACUUM не может убрать мёртвые версии строк, которые ей ещё видны, — bloat растёт"
              correct: true
            - id: locks
              text: "Отчёт всё-таки берёт разделяемые блокировки строк, и UPDATE-ы копятся в очереди, порождая лишние версии"
              explanation: "Обычные SELECT в Postgres не берут блокировок строк — читатели не мешают писателям, это суть MVCC. Вред длинного чтения в другом: его снимок мешает уборке старых версий."
            - id: wal
              text: "Долгое чтение раздувает WAL: все прочитанные страницы журналируются заново"
              explanation: "Чтение ничего не пишет в WAL — журнал растёт от изменений. Рост объёма таблиц после долгих читающих транзакций объясняется задержанной уборкой мёртвых версий."
            - id: normal
              text: "Это нормальное поведение кэша страниц, к утру размер вернётся сам"
              explanation: "Bloat сам не рассасывается: место, занятое мёртвыми версиями, возвращается в оборот только VACUUM-ом, а сам файл таблицы не уменьшается вовсе. Длинные снимки — реальная причина, и её называют в любом разборе такого инцидента."
      - id: pg-locks
        title: "Блокировки: FOR UPDATE, SKIP LOCKED, deadlock, оптимистичная блокировка"
        content: lessons/postgres/pg-locks.md
        quiz:
          question: "Оператор открывает карточку обращения, думает минуту и жмёт «Сохранить». Нужно, чтобы правки двух операторов не затирали друг друга молча. Какой механизм уместен?"
          options:
            - id: optimistic
              text: "Оптимистичная блокировка: version в строке, UPDATE ... WHERE id = $1 AND version = $2; ноль строк — конфликт, 409 и перечитать"
              correct: true
            - id: for-update
              text: "SELECT FOR UPDATE при открытии карточки и держать транзакцию, пока оператор не сохранит"
              explanation: "Транзакция на время человеческого раздумья — это минуты удержания соединения из пула и блокировки строки: второй оператор просто зависнет на открытии карточки. Пессимистичная блокировка — для коротких машинных секций, не для «пока человек думает»."
            - id: serializable
              text: "Перевести оба запроса на Serializable — база сама разрулит конфликт"
              explanation: "Чтение карточки и её сохранение — разные транзакции с минутой между ними; ни один уровень изоляции не связывает их между собой. Изоляция работает внутри транзакции, а здесь конфликт между двумя парами «прочитал-записал», разнесёнными во времени."
            - id: last-wins
              text: "Ничего не делать: последний записавший прав, это стандартное поведение баз"
              explanation: "Это и есть lost update: правка первого оператора исчезает без следа и без предупреждения. Для рабочего инструмента банка молчаливая потеря изменений — дефект, а не стандарт."
      - id: pg-practice-claim
        title: "Практика: взять обращение в работу без гонки"
        content: lessons/postgres/pg-practice-claim.md
        practice:
          type: sql
          sandbox: pult
          prompt: "Возьмите обращение 4 в работу оператором 3 оптимистично: UPDATE с условием version = 1 (assignee_id = 3, status = 'in_progress', version + 1), затем событие assigned в case_events (case_id 4, actor_id 3, payload {\"assignee\":3}, created_at '2026-03-07T10:00:00Z'), последним оператором выведите id, assignee_id, status, version обращения 4."
          solution: |
            update cases
            set assignee_id = 3, status = 'in_progress', version = version + 1
            where id = 4 and version = 1;
            insert into case_events (case_id, kind, actor_id, payload, created_at)
            values (4, 'assigned', 3, '{"assignee":3}'::jsonb, '2026-03-07T10:00:00Z');
            select id, assignee_id, status, version from cases where id = 4;
      - id: pg-practice-queue
        title: "Практика: очередь задач на SKIP LOCKED"
        content: lessons/postgres/pg-practice-queue.md
        practice:
          type: sql
          sandbox: pult
          prompt: "Запрос воркера: задачи status = 'queued' с run_at не позже '2026-03-07T10:01:00Z', три самые приоритетные (priority больше — раньше, при равенстве — меньший id), столбцы id и kind, порядок строк — часть ответа. Добавьте FOR UPDATE SKIP LOCKED."
          expected: |
            select id, kind
            from jobs
            where status = 'queued' and run_at <= '2026-03-07T10:01:00Z'
            order by priority desc, id
            limit 3
          ordered: true
      - id: pg-practice-latest
        title: "Практика: последнее событие каждого обращения"
        content: lessons/postgres/pg-practice-latest.md
        practice:
          type: sql
          sandbox: pult
          prompt: "По каждому обращению — его последнее по created_at событие: case_id, kind, created_at. Сортировка по case_id по возрастанию. Решается DISTINCT ON или оконной функцией."
          expected: |
            select distinct on (case_id) case_id, kind, created_at
            from case_events
            order by case_id, created_at desc
          ordered: true
      - id: pg-orm-n1-pool
        title: "ORM, N+1 и пул соединений: Prisma, TypeORM, Knex, Drizzle"
        content: lessons/postgres/pg-orm-n1-pool.md
        quiz:
          question: "Под нагрузкой латентность API выросла в разы, при этом метрики Postgres спокойны: CPU низкий, запросы быстрые. В логах сервиса — ожидания на «acquire connection». Что происходит?"
          options:
            - id: pool-leak
              text: "Исчерпан пул соединений сервиса: запросы ждут свободного клиента, а база скучает"
              correct: true
            - id: db-slow
              text: "База деградировала: нужно срочно поднять max_connections, чтобы пропустить больше запросов"
              explanation: "Метрики базы спокойны — деградации нет; ожидание живёт на стороне сервиса, в очереди его пула. Поднятие max_connections не чинит утечку клиентов и часто делает хуже: больше конкурирующих процессов на тех же ядрах."
            - id: gc
              text: "Паузы сборщика мусора Node блокируют обработчики, и запросы копятся"
              explanation: "Паузы GC видны как рост лага цикла событий, а не как ожидание «acquire connection»: это ожидание — явный признак того, что свободных соединений в пуле нет."
            - id: indexes
              text: "Отвалились индексы, запросы стали медленными, и соединения заняты дольше"
              explanation: "Медленные запросы были бы видны в метриках базы — а они спокойны и запросы быстрые. Соединения заняты не запросами: они не возвращаются в пул (забытый release) или пул меньше реальной конкуренции."
      - id: pg-migrations
        title: "Миграции без даунтайма: expand/contract и блокировки DDL"
        content: lessons/postgres/pg-migrations.md
        quiz:
          question: "Нужно переименовать колонку cases.topic в cases.category. Деплой rolling: во время выката живут обе версии кода. Как делать?"
          options:
            - id: expand
              text: "Expand/contract: добавить category, писать в обе и читать новую, перелить старые данные пачками, удалить topic отдельным релизом после метрик"
              correct: true
            - id: rename
              text: "ALTER TABLE ... RENAME COLUMN — переименование мгновенно и не переписывает таблицу, значит безопасно"
              explanation: "Мгновенно — да, но в ту же секунду старая версия кода, которая ещё обслуживает запросы, перестаёт находить колонку topic и падает. Совместимость версий кода — отдельное требование, которое скорость DDL не закрывает."
            - id: maintenance
              text: "Объявить технологическое окно ночью и переименовать со остановкой сервиса"
              explanation: "Для банковской платформы остановка — крайняя мера, и здесь она не нужна: expand/contract делает то же самое без окна. Ответ «остановим сервис» на вопрос про rolling-деплой — уход от вопроса."
            - id: view
              text: "Создать view со старым именем колонки поверх таблицы — обе версии кода будут работать вечно"
              explanation: "View с именем таблицы поверх переименованной колонки — трюк, который иногда используют как костыль перехода, но он требует подменить саму таблицу, ломает планы, права и инструменты, и «вечно» превращается в неубираемый слой. Стандартная дисциплина — expand/contract."
      - id: pg-scaling
        title: "Репликация, лаг реплики, партиционирование, шардирование, pgbouncer"
        content: lessons/postgres/pg-scaling.md
        quiz:
          question: "Списки обращений перевели на чтение с асинхронной реплики. Операторы жалуются: создал обращение — а в списке его нет, появляется через несколько секунд. Что это и как чинить?"
          options:
            - id: ryw
              text: "Лаг реплики и read-your-writes: свежие свои записи нужно читать с праймери"
              correct: true
            - id: cache
              text: "Браузер кэширует список; нужно добавить no-store в заголовки ответа"
              explanation: "Задержка «несколько секунд и само появляется» с недавно включённым чтением с реплики — картина лага репликации, а не браузерного кэша: кэш не истёк бы сам через пару секунд без обновления страницы."
            - id: sync-all
              text: "Перевести репликацию в синхронный режим — реплика перестанет отставать"
              explanation: "Синхронный коммит гарантирует получение WAL репликой, но не мгновенное проигрывание для чтения (нужен ещё и remote_apply — самая дорогая настройка: каждая запись в системе ждёт реплику). Платить латентностью всех записей ради списка — плохой обмен; точечное чтение своих записей с праймери дешевле."
            - id: bug
              text: "Гонка в коде сервиса: вставка и чтение идут параллельно, нужен await"
              explanation: "Код здесь последователен: запись подтверждена, затем чтение. Расходятся не операции, а узлы: запись ушла в праймери, чтение — в отставшую реплику."
      - id: pg-storage-choice
        title: "Выбор хранилища: PostgreSQL, MongoDB, Redis, ClickHouse, S3"
        content: lessons/postgres/pg-storage-choice.md
        quiz:
          question: "В чат «Пульта» добавляют вложения: сканы документов до 20 МБ. Куда их класть?"
          options:
            - id: s3
              text: "В объектное хранилище S3, в Postgres — метаданные и ссылку; клиенту — presigned URL, чтобы байты шли мимо сервиса"
              correct: true
            - id: bytea
              text: "В bytea-колонку рядом с сообщением: данные в одном месте, транзакции работают"
              explanation: "Файлы в таблице раздувают её, бэкапы и WAL, а каждая выдача файла гоняет мегабайты через базу и сервис. Транзакционность нужна метаданным — они и остаются в Postgres."
            - id: mongo
              text: "В MongoDB GridFS: она создана для хранения файлов кусками"
              explanation: "GridFS — способ хранить файлы в Mongo, а не причина добавлять новую СУБД в платформу. Объектное хранилище дешевле, проще и отдаёт файлы напрямую по подписанной ссылке."
            - id: disk
              text: "На локальный диск инстанса сервиса чата, отдавая по HTTP оттуда"
              explanation: "Инстансов несколько и они смертны: файл, загруженный через один, не найдётся на другом, а деплой контейнера сотрёт диск. Локальный диск — не хранилище в горизонтально масштабируемой системе."

  - id: auth
    title: "Модуль 5. Аутентификация, сессии, безопасность"
    lessons:
      - id: auth-basics
        title: "Аутентификация против авторизации, пароли, 401 против 403"
        content: lessons/auth/auth-basics.md
        quiz:
          question: "В базе identity пароли операторов хранятся как sha256(пароль + общая для всех соль). Что здесь главная проблема?"
          options:
            - id: fast-hash
              text: "sha256 — быстрый хеш: утёкшая база перебирается на GPU; нужны медленные bcrypt/argon2 с фактором стоимости и солью на каждый пароль"
              correct: true
            - id: fine
              text: "Всё в порядке: хеш односторонний, пароль из него не восстановить"
              explanation: "Односторонность не спасает от перебора: sha256 считается миллиардами в секунду, и словарные пароли вскрываются за минуты. Медленность хеша — не издержка, а сама защита."
            - id: encrypt
              text: "Хеширование устарело — пароли нужно шифровать ключом, который хранится в секретном хранилище"
              explanation: "Шифрование обратимо: у кого ключ, у того и пароли, и утечка ключа раскрывает всё разом. Пароли именно хешируют — медленно и с солью."
            - id: salt-secret
              text: "Соль нужно хранить отдельно от хешей в секретном месте, иначе она бесполезна"
              explanation: "Соль — не секрет, её задача — сделать одинаковые пароли разными хешами и убить предвычисленные таблицы. Проблема здесь в том, что соль общая (одинаковые пароли снова дают одинаковые хеши) и хеш быстрый."
      - id: auth-sessions-jwt
        title: "Сессии против JWT: где хранить, как отзывать, CSRF"
        content: lessons/auth/auth-sessions-jwt.md
        quiz:
          question: "Оператора уволили в 10:00, запись о нём деактивировали. В 10:20 он всё ещё выгружает данные клиентов. Аутентификация — JWT со сроком жизни 8 часов, проверяется сервисами локально. Что пошло не так по построению?"
          options:
            - id: revocation
              text: "JWT не отзывается: подпись валидна до exp, а сервер токенов не помнит — 8 часов и есть предел ущерба"
              correct: true
            - id: forgot-delete
              text: "Забыли удалить его запись из хранилища сессий — после удаления доступ бы прекратился"
              explanation: "Хранилища сессий в этой схеме нет: сервисы проверяют подпись локально и никуда не ходят. В том и дефект — отзывать нечего и негде."
            - id: rotate-keys
              text: "Нужно было немедленно ротировать ключ подписи — все старые токены стали бы невалидными"
              explanation: "Сработает, но это отзыв токенов всех пользователей сразу: тысячи операторов разлогинены из-за одного увольнения. Ключи ротируют по расписанию, а не как средство точечного отзыва."
            - id: expected
              text: "Всё штатно: 8 часов — разумный срок, увольнения можно обрабатывать на следующий день"
              explanation: "Для банковской системы окно в 8 часов у уволенного сотрудника — инцидент безопасности. Предел ущерба задаётся сроком access-токена, поэтому он и делается минутным."
      - id: auth-multisession
        title: "Многосессионная авторизация: устройства, ротация refresh-токенов, отзыв"
        content: lessons/auth/auth-multisession.md
        quiz:
          question: "Identity получает refresh-токен, который уже был обменян десять минут назад. Что это значит и что делать по строгой политике ротации?"
          options:
            - id: family
              text: "Токеном владеют двое — вероятна кража: отозвать всё семейство этой сессии, остальные сессии пользователя не трогать"
              correct: true
            - id: just-deny
              text: "Просто отказать в обмене: токен использован, новый уже выдан, система в безопасности"
              explanation: "Отказ без реакции оставляет вора с рабочей парой токенов: возможно, второй обмен — это жертва, а первый сделал вор. Повторное использование — сигнал компрометации, а не бытовая ошибка."
            - id: all-sessions
              text: "Отозвать все сессии пользователя на всех устройствах и заставить войти заново везде"
              explanation: "Скомпрометирована одна цепочка — одно устройство; отзыв всех сессий наказывает пользователя сверх необходимого. Семейство — это одна сессия, и строгая политика бьёт по нему."
            - id: extend
              text: "Выдать новую пару: пользователь мог обменять из двух вкладок, это обычная гонка"
              explanation: "Гонка вкладок реальна, но лечится узким окном прощения с выдачей той же пары или синхронизацией на клиенте — а десять минут в это окно не помещаются. Молча выдавать новую пару на любой повтор — отключить обнаружение кражи вовсе."
      - id: auth-practice-sessions
        title: "Практика: менеджер сессий с ротацией refresh-токенов"
        content: lessons/auth/auth-practice-sessions.md
        practice:
          type: code
          language: typescript
          entry: runSessions
          prompt: "Реализуйте runSessions(ops): многосессионный менеджер — login, ротация refresh, обнаружение повторного использования с отзывом семейства, logout, logoutAll, list. Форматы журнала и правила — в уроке; refresh живёт 3600 с."
          starter: |
            type Op =
              | { op: "login"; at: number; user: string; device: string }
              | { op: "refresh"; at: number; token: string }
              | { op: "logout"; at: number; token: string }
              | { op: "logoutAll"; at: number; user: string }
              | { op: "list"; at: number; user: string };

            export function runSessions(ops: Op[]): { log: string[] } {
              // ...
              return { log: [] };
            }
          cases:
            - args:
                - - { op: "login", at: 0, user: "ivan", device: "work" }
                  - { op: "refresh", at: 100, token: "t1" }
                  - { op: "refresh", at: 200, token: "t1" }
                  - { op: "refresh", at: 300, token: "t2" }
              expected:
                log:
                  - "login:ivan:s1:t1"
                  - "rotated:t1->t2"
                  - "reuse-detected:t1:revoked:s1"
                  - "denied:t2"
            - args:
                - - { op: "login", at: 0, user: "ivan", device: "work" }
                  - { op: "login", at: 10, user: "ivan", device: "phone" }
                  - { op: "refresh", at: 100, token: "t1" }
                  - { op: "refresh", at: 200, token: "t1" }
                  - { op: "refresh", at: 300, token: "t2" }
                  - { op: "list", at: 400, user: "ivan" }
              expected:
                log:
                  - "login:ivan:s1:t1"
                  - "login:ivan:s2:t2"
                  - "rotated:t1->t3"
                  - "reuse-detected:t1:revoked:s1"
                  - "rotated:t2->t4"
                  - "sessions:ivan:s2"
            - args:
                - - { op: "login", at: 0, user: "anna", device: "a" }
                  - { op: "refresh", at: 4000, token: "t1" }
                  - { op: "login", at: 4100, user: "anna", device: "b" }
                  - { op: "list", at: 4200, user: "anna" }
              expected:
                log:
                  - "login:anna:s1:t1"
                  - "denied:t1"
                  - "login:anna:s2:t2"
                  - "sessions:anna:s1,s2"
            - args:
                - - { op: "login", at: 0, user: "u", device: "a" }
                  - { op: "login", at: 1, user: "u", device: "b" }
                  - { op: "logout", at: 2, token: "t1" }
                  - { op: "refresh", at: 3, token: "t1" }
                  - { op: "list", at: 4, user: "u" }
                  - { op: "logoutAll", at: 5, user: "u" }
                  - { op: "list", at: 6, user: "u" }
              expected:
                log:
                  - "login:u:s1:t1"
                  - "login:u:s2:t2"
                  - "logout:s1"
                  - "denied:t1"
                  - "sessions:u:s2"
                  - "logout-all:u:1"
                  - "sessions:u:-"
            - args:
                - - { op: "logoutAll", at: 0, user: "ghost" }
                  - { op: "refresh", at: 1, token: "t9" }
              expected:
                log:
                  - "logout-all:ghost:0"
                  - "denied:t9"
            - args:
                - - { op: "login", at: 0, user: "u", device: "a" }
                  - { op: "refresh", at: 3500, token: "t1" }
                  - { op: "refresh", at: 7000, token: "t2" }
                  - { op: "refresh", at: 10700, token: "t3" }
              expected:
                log:
                  - "login:u:s1:t1"
                  - "rotated:t1->t2"
                  - "rotated:t2->t3"
                  - "denied:t3"
          solution: |
            type Op =
              | { op: "login"; at: number; user: string; device: string }
              | { op: "refresh"; at: number; token: string }
              | { op: "logout"; at: number; token: string }
              | { op: "logoutAll"; at: number; user: string }
              | { op: "list"; at: number; user: string };

            const TTL = 3600;

            type Session = { id: string; user: string; active: boolean; created: number };
            type Token = { id: string; sessionId: string; issuedAt: number; used: boolean };

            export function runSessions(ops: Op[]): { log: string[] } {
              const log: string[] = [];
              const sessions = new Map<string, Session>();
              const tokens = new Map<string, Token>();
              let sessionSeq = 0;
              let tokenSeq = 0;

              const newToken = (sessionId: string, at: number): string => {
                const id = `t${++tokenSeq}`;
                tokens.set(id, { id, sessionId, issuedAt: at, used: false });
                return id;
              };

              for (const op of ops) {
                switch (op.op) {
                  case "login": {
                    const sid = `s${++sessionSeq}`;
                    sessions.set(sid, { id: sid, user: op.user, active: true, created: op.at });
                    const tid = newToken(sid, op.at);
                    log.push(`login:${op.user}:${sid}:${tid}`);
                    break;
                  }
                  case "refresh": {
                    const t = tokens.get(op.token);
                    const s = t ? sessions.get(t.sessionId) : undefined;
                    if (!t || !s || !s.active) {
                      log.push(`denied:${op.token}`);
                      break;
                    }
                    if (t.used) {
                      s.active = false;
                      log.push(`reuse-detected:${op.token}:revoked:${s.id}`);
                      break;
                    }
                    if (op.at - t.issuedAt > TTL) {
                      log.push(`denied:${op.token}`);
                      break;
                    }
                    t.used = true;
                    const nid = newToken(s.id, op.at);
                    log.push(`rotated:${op.token}->${nid}`);
                    break;
                  }
                  case "logout": {
                    const t = tokens.get(op.token);
                    const s = t ? sessions.get(t.sessionId) : undefined;
                    if (!t || !s || !s.active || t.used || op.at - t.issuedAt > TTL) {
                      log.push(`denied:${op.token}`);
                      break;
                    }
                    s.active = false;
                    log.push(`logout:${s.id}`);
                    break;
                  }
                  case "logoutAll": {
                    let count = 0;
                    for (const s of sessions.values()) {
                      if (s.user === op.user && s.active) {
                        s.active = false;
                        count++;
                      }
                    }
                    log.push(`logout-all:${op.user}:${count}`);
                    break;
                  }
                  case "list": {
                    const active = [...sessions.values()]
                      .filter((s) => s.user === op.user && s.active)
                      .sort((a, b) => a.created - b.created)
                      .map((s) => s.id);
                    log.push(`sessions:${op.user}:${active.length > 0 ? active.join(",") : "-"}`);
                    break;
                  }
                }
              }
              return { log };
            }
      - id: auth-service-to-service
        title: "Межсервисная аутентификация и передача контекста пользователя"
        content: lessons/auth/auth-service-to-service.md
        quiz:
          question: "BFF аутентифицирует оператора по cookie и вызывает cases, передавая заголовок X-Operator-Id: 42. Внутренняя сеть закрыта снаружи. Что не так?"
          options:
            - id: signed
              text: "Голый заголовок подделает любой изнутри сети; контекст пользователя передаётся только подписанным"
              correct: true
            - id: ok-internal
              text: "Ничего: сеть внутренняя, снаружи заголовок не подставить, а внутри все свои"
              explanation: "«Внутри все свои» умирает при первой компрометации любого сервиса или контейнера: с этого плацдарма можно выполнять действия от имени любого оператора. Zero trust существует ровно поэтому."
            - id: header-name
              text: "Проблема в имени заголовка: X-префиксы устарели, нужно называть его по-современному"
              explanation: "Имя — вкусовщина; уязвимость в том, что содержимому заголовка нельзя верить: он не подписан и не проверяем."
            - id: mtls-only
              text: "Нужен mTLS между BFF и cases — тогда заголовок можно оставить как есть"
              explanation: "mTLS докажет, что вызывает именно BFF, — это ответ на вопрос «кто вызывает». Но заголовок по-прежнему утверждает «от чьего имени» бездоказательно: скомпрометированный BFF или ошибка в нём подставит любой id. Контекст пользователя должен быть подписан выпускающей стороной."
      - id: auth-oauth-oidc
        title: "OAuth 2.0, OIDC, PKCE и корпоративный SSO"
        content: lessons/auth/auth-oauth-oidc.md
        quiz:
          question: "Зачем в authorization code flow нужен PKCE, если код и так одноразовый и меняется на токены сервер-сервером?"
          options:
            - id: verifier
              text: "Перехваченный код бесполезен: обменять его может только тот, кто предъявит code_verifier — исходный секрет, чей хеш отправлялся в начале потока"
              correct: true
            - id: replaces-secret
              text: "PKCE шифрует код при передаче через браузер, чтобы его нельзя было прочитать в URL"
              explanation: "Код в URL редиректа виден как был — PKCE ничего не шифрует. Он делает видимый код бесполезным для чужого: без verifier обмен не пройдёт."
            - id: csrf
              text: "PKCE защищает колбэк от CSRF — подделки ответа авторизации"
              explanation: "От CSRF на колбэке защищает параметр state — случайная строка, которую клиент сверяет при возврате. PKCE решает другую задачу: привязывает обмен кода к тому, кто начинал поток."
            - id: legacy
              text: "PKCE нужен только мобильным приложениям без client secret; для серверных клиентов он избыточен"
              explanation: "Родился он для публичных клиентов, но сейчас рекомендован всем: перехват кода возможен и у конфиденциальных клиентов (утечки редиректов, логи), а PKCE дёшев и закрывает этот класс атак целиком."
      - id: auth-access-models
        title: "RBAC, ABAC, ReBAC: модели доступа и где их проверять"
        content: lessons/auth/auth-access-models.md
        quiz:
          question: "Требование: «оператор видит обращения только своего отдела, аудитор — все». Список отделов и операторов меняется. Как это выразить?"
          options:
            - id: hybrid
              text: "RBAC-каркас плюс атрибутное правило: сравнение отдела субъекта и обращения в доменной can() и фильтр по отделу прямо в запросе списков"
              correct: true
            - id: role-per-dept
              text: "Создать роль на каждый отдел: operator-dept1, operator-dept2, — и выдавать по принадлежности"
              explanation: "Взрыв ролей: новые отделы требуют новых ролей и переназначений, а вопрос «что может оператор» перестаёт иметь единый ответ. Контекст «свой отдел» — атрибутное условие, а не новая роль."
            - id: frontend
              text: "Фильтровать список отделом на фронтенде: BFF отдаёт всё, интерфейс показывает своё"
              explanation: "Фронтенд — не рубеж: прямой запрос к API вернёт чужие обращения. Скрытие в интерфейсе — UX; фильтр обязан жить в самом запросе к данным."
            - id: after-select
              text: "Выбирать все обращения и отбрасывать чужие в коде сервиса перед ответом"
              explanation: "Протекает через пагинацию и счётчики: страница на 50 строк после фильтрации превращается в 7, total врёт, а база гоняет чужие данные впустую. Фильтр по правам — часть SQL-запроса."
      - id: auth-practice-access
        title: "Практика: проверка доступа оператора к обращению"
        content: lessons/auth/auth-practice-access.md
        practice:
          type: code
          language: typescript
          entry: can
          prompt: "Реализуйте can(subject, action, caseInfo) по восьми правилам урока: роли operator/senior/supervisor/auditor, свой отдел, назначенность, запрет действий над закрытым; вердикты allow и четыре deny с приоритетом foreign-department > closed > role > not-assignee."
          starter: |
            type Role = "operator" | "senior" | "supervisor" | "auditor";
            type Subject = { operatorId: number; role: Role; departmentId: number };
            type CaseInfo = {
              id: number;
              departmentId: number;
              assigneeId: number | null;
              status: "open" | "in_progress" | "resolved" | "closed";
            };
            type Action = "read" | "update" | "reassign" | "close";

            export function can(subject: Subject, action: Action, caseInfo: CaseInfo): string {
              // ...
              return "deny:role";
            }
          cases:
            - args:
                - { operatorId: 1, role: "operator", departmentId: 1 }
                - "read"
                - { id: 10, departmentId: 1, assigneeId: 2, status: "open" }
              expected: "allow"
            - args:
                - { operatorId: 1, role: "operator", departmentId: 1 }
                - "update"
                - { id: 10, departmentId: 1, assigneeId: 2, status: "open" }
              expected: "deny:not-assignee"
            - args:
                - { operatorId: 1, role: "operator", departmentId: 1 }
                - "update"
                - { id: 10, departmentId: 1, assigneeId: 1, status: "in_progress" }
              expected: "allow"
            - args:
                - { operatorId: 11, role: "auditor", departmentId: 4 }
                - "read"
                - { id: 10, departmentId: 2, assigneeId: null, status: "closed" }
              expected: "allow"
            - args:
                - { operatorId: 11, role: "auditor", departmentId: 4 }
                - "close"
                - { id: 10, departmentId: 4, assigneeId: null, status: "open" }
              expected: "deny:role"
            - args:
                - { operatorId: 7, role: "supervisor", departmentId: 2 }
                - "close"
                - { id: 10, departmentId: 2, assigneeId: 5, status: "closed" }
              expected: "deny:closed"
            - args:
                - { operatorId: 7, role: "supervisor", departmentId: 2 }
                - "close"
                - { id: 10, departmentId: 2, assigneeId: 5, status: "in_progress" }
              expected: "allow"
            - args:
                - { operatorId: 1, role: "operator", departmentId: 1 }
                - "reassign"
                - { id: 10, departmentId: 1, assigneeId: 1, status: "open" }
              expected: "deny:role"
            - args:
                - { operatorId: 3, role: "senior", departmentId: 1 }
                - "close"
                - { id: 10, departmentId: 1, assigneeId: 2, status: "open" }
              expected: "deny:not-assignee"
            - args:
                - { operatorId: 3, role: "senior", departmentId: 1 }
                - "update"
                - { id: 10, departmentId: 2, assigneeId: 3, status: "closed" }
              expected: "deny:foreign-department"
            - args:
                - { operatorId: 1, role: "operator", departmentId: 1 }
                - "update"
                - { id: 10, departmentId: 1, assigneeId: null, status: "open" }
              expected: "deny:not-assignee"
          solution: |
            type Role = "operator" | "senior" | "supervisor" | "auditor";
            type Subject = { operatorId: number; role: Role; departmentId: number };
            type CaseInfo = {
              id: number;
              departmentId: number;
              assigneeId: number | null;
              status: "open" | "in_progress" | "resolved" | "closed";
            };
            type Action = "read" | "update" | "reassign" | "close";

            export function can(subject: Subject, action: Action, caseInfo: CaseInfo): string {
              if (subject.role === "auditor") {
                if (action === "read") return "allow";
                if (subject.departmentId !== caseInfo.departmentId) return "deny:foreign-department";
                if (caseInfo.status === "closed") return "deny:closed";
                return "deny:role";
              }
              if (subject.departmentId !== caseInfo.departmentId) return "deny:foreign-department";
              if (action === "read") return "allow";
              if (caseInfo.status === "closed") return "deny:closed";
              const assigned = caseInfo.assigneeId === subject.operatorId;
              switch (action) {
                case "update":
                  if (subject.role === "operator") return assigned ? "allow" : "deny:not-assignee";
                  return "allow";
                case "reassign":
                  return subject.role === "operator" ? "deny:role" : "allow";
                case "close":
                  if (subject.role === "supervisor") return "allow";
                  return assigned ? "allow" : "deny:not-assignee";
              }
              return "deny:role";
            }
      - id: auth-security
        title: "Безопасность API: OWASP, инъекции, секреты, заголовки, SSRF"
        content: lessons/auth/auth-security.md
        quiz:
          question: "Клиент банка с валидным токеном меняет номер счёта в GET /accounts/{id}/operations на чужой и получает выписку другого человека. Как называется уязвимость и в чём её причина?"
          options:
            - id: bola
              text: "BOLA/IDOR: аутентификация есть, а проверки принадлежности объекта субъекту нет"
              correct: true
            - id: injection
              text: "SQL-инъекция: id из URL попадает в запрос без параметризации"
              explanation: "Инъекции здесь нет: id — легальное число, запрос синтаксически честный. Уязвимость логическая: сервис не спросил, принадлежит ли счёт предъявителю токена."
            - id: uuid-fix
              text: "Проблема в предсказуемых номерах: перейти на uuid — и перебор станет невозможен"
              explanation: "Непредсказуемость id замедляет перебор, но чужой uuid утекает сотней способов (логи, ссылки, поддержка) — и без проверки принадлежности открывает те же данные. uuid — дополнение, а не защита."
            - id: csrf
              text: "CSRF: чужой сайт заставил браузер клиента выполнить запрос с его cookie"
              explanation: "Здесь запрос делает сам владелец токена и читает ответ — CSRF ни при чём. Дыра в авторизации объекта: сервис верит, что раз токен валиден, любой id можно."
      - id: scr-foundation
        title: "Пункт 5в. Фундамент: транзакции Postgres, refresh-сессии, DI-контейнер"
        content: lessons/auth/scr-foundation.md
        quiz:
          question: "Злоумышленник украл refresh-токен и уже обменял его на новую пару. Через час легитимное устройство приходит со своим — уже погашенным — refresh-токеном. Что делает правильно спроектированный менеджер сессий?"
          options:
            - id: revoke-family
              text: "Фиксирует повторное использование погашенного токена и отзывает всю цепочку: разлогинены оба, включая вора, кража обнаружена"
              correct: true
            - id: reissue
              text: "Выдаёт устройству новую пару: токен был выдан легитимно, а отказ разлогинил бы честного пользователя"
              explanation: "Если погашенный токен продолжает работать, ротация теряет смысл: вор и жертва бесконечно обновляются параллельно, и кража не обнаруживается никогда. Разовый повторный вход — приемлемая цена."
            - id: revoke-old-only
              text: "Отклоняет только этот запрос: погашенный токен недействителен, но выданная по нему новая цепочка продолжает работать"
              explanation: "Новая цепочка — в руках вора: именно он успел обменять токен первым. Отклонить жертву и оставить вора — худший из исходов; сигнал «токен использован дважды» требует отзыва всей цепочки."
            - id: lock-account
              text: "Блокирует учётную запись до обращения в поддержку: раз токен скомпрометирован, доверять нельзя ни одной сессии"
              explanation: "Отзыв всех сессий и повторный вход по паролю решают ту же задачу без участия поддержки. Блокировка аккаунта на каждый обрыв сети (обычная причина повторной отправки старого токена) — самострел."

  - id: cache
    title: "Модуль 6. Кэширование и Redis"
    lessons:
      - id: cache-strategies
        title: "Где и что кэшировать: уровни, TTL, cache-aside, write-through"
        content: lessons/cache/cache-strategies.md
        quiz:
          question: "Справочник тем обращений читается на каждый экран и меняется раз в месяц. Команда предлагает кэшировать его в памяти каждого инстанса BFF навсегда, сбрасывая деплоем. Что здесь главный изъян?"
          options:
            - id: no-ttl
              text: "Без TTL и инвалидации изменение справочника не доедет до инстансов до ближайшего деплоя; нужен хотя бы TTL как страховка"
              correct: true
            - id: memory
              text: "Справочник займёт слишком много памяти процесса — двадцать строк на инстанс это расточительно"
              explanation: "Двадцать строк — байты; память здесь не аргумент. Аргумент — доставка изменений: кэш без срока жизни узнаёт о новом справочнике только со смертью процесса."
            - id: redis-only
              text: "Кэшировать в памяти процесса вообще нельзя — только в Redis, иначе инстансы разойдутся"
              explanation: "Локальный кэш перед общим — нормальный слой (наносекунды против сетевого вызова), и для справочника короткое расхождение инстансов терпимо. Нетерпимо отсутствие срока жизни: расхождение до следующего деплоя."
            - id: db-cache
              text: "База и так кэширует такие запросы — прикладной кэш дублирует её работу впустую"
              explanation: "Кэш страниц базы экономит диск, но не сетевой раундтрип и не работу запроса на каждый экран. Прикладной кэш решает другую задачу; вопрос лишь в его инвалидации."
      - id: cache-invalidation
        title: "Инвалидация, cache stampede, склейка запросов, негативный кэш"
        content: lessons/cache/cache-invalidation.md
        quiz:
          question: "Горячий ключ справочника истёк в 10:00:00.000, и за следующие 200 мс тысяча запросов получила промах и пошла в базу за одним и тем же. Как называется эффект и что его чинит?"
          options:
            - id: stampede
              text: "Cache stampede; чинят склейка промахов в один запрос, блокировка на пересчёт между инстансами, вероятностное раннее обновление и джиттер TTL"
              correct: true
            - id: thundering-lock
              text: "Deadlock кэша: запросы заблокировали друг друга на одном ключе; нужно убрать блокировки из кэша"
              explanation: "Никто никого не блокирует — наоборот, все свободно побежали в базу одновременно. Проблема в отсутствии координации промахов, и лечится она как раз добавлением склейки или блокировки на пересчёт."
            - id: negative
              text: "Отсутствие негативного кэша: база отвечает пусто, и ответы не запоминаются"
              explanation: "Негативный кэш — про запросы к несуществующим объектам. Здесь объект существует, просто его копия истекла у всех сразу — это stampede."
            - id: shorten-ttl
              text: "TTL слишком длинный: с коротким TTL истечения будут чаще и мельче, база привыкнет"
              explanation: "Короткий TTL делает волны промахов чаще, а не безопаснее: каждая всё равно собирает всех читателей горячего ключа. Лечится не частотой истечений, а тем, чтобы промахи не шли в базу толпой."
      - id: cache-practice-singleflight
        title: "Практика: кэш с TTL и склейкой одновременных промахов"
        content: lessons/cache/cache-practice-singleflight.md
        practice:
          type: code
          language: typescript
          entry: demo
          prompt: "Реализуйте createCache(ttlMs) с cache-aside, склейкой одновременных промахов и некэшируемыми ошибками — и demo(plan) по правилам урока: значения k@now, журнал load:<key>@<now>, ERR для отказов."
          starter: |
            type Round = { now: number; keys: string[] };

            export async function demo(plan: {
              ttlMs: number;
              rounds: Round[];
              failKeys?: string[];
            }): Promise<{ results: (string | "ERR")[][]; loaderCalls: number; log: string[] }> {
              // ...
              return { results: [], loaderCalls: 0, log: [] };
            }
          cases:
            - args:
                - ttlMs: 100
                  rounds:
                    - { now: 0, keys: ["a", "a", "b"] }
                    - { now: 50, keys: ["a"] }
                    - { now: 200, keys: ["a"] }
              expected:
                results: [["a@0", "a@0", "b@0"], ["a@0"], ["a@200"]]
                loaderCalls: 3
                log: ["load:a@0", "load:b@0", "load:a@200"]
            - args:
                - ttlMs: 100
                  rounds:
                    - { now: 0, keys: ["x", "y", "x"] }
                  failKeys: ["x"]
              expected:
                results: [["ERR", "y@0", "ERR"]]
                loaderCalls: 2
                log: ["load:x@0", "load:y@0"]
            - args:
                - ttlMs: 100
                  rounds:
                    - { now: 0, keys: ["x"] }
                    - { now: 10, keys: ["x"] }
                  failKeys: ["x"]
              expected:
                results: [["ERR"], ["ERR"]]
                loaderCalls: 2
                log: ["load:x@0", "load:x@10"]
            - args:
                - ttlMs: 100
                  rounds:
                    - { now: 0, keys: ["a"] }
                    - { now: 100, keys: ["a"] }
              expected:
                results: [["a@0"], ["a@100"]]
                loaderCalls: 2
                log: ["load:a@0", "load:a@100"]
            - args:
                - ttlMs: 50
                  rounds:
                    - { now: 0, keys: [] }
                    - { now: 1, keys: ["k"] }
              expected:
                results: [[], ["k@1"]]
                loaderCalls: 1
                log: ["load:k@1"]
          solution: |
            type Round = { now: number; keys: string[] };

            type Entry = { value: string; setAt: number };

            function createCache(ttlMs: number) {
              const store = new Map<string, Entry>();
              const inflight = new Map<string, Promise<string>>();
              let hits = 0;
              let misses = 0;
              let loaderCalls = 0;

              return {
                get(key: string, now: number, loader: () => Promise<string>): Promise<string> {
                  const entry = store.get(key);
                  if (entry && now - entry.setAt < ttlMs) {
                    hits++;
                    return Promise.resolve(entry.value);
                  }
                  misses++;
                  const existing = inflight.get(key);
                  if (existing) return existing;
                  loaderCalls++;
                  const p = loader()
                    .then((value) => {
                      store.set(key, { value, setAt: now });
                      return value;
                    })
                    .finally(() => {
                      inflight.delete(key);
                    });
                  inflight.set(key, p);
                  return p;
                },
                stats() {
                  return { hits, misses, loaderCalls };
                },
              };
            }

            export async function demo(plan: {
              ttlMs: number;
              rounds: Round[];
              failKeys?: string[];
            }): Promise<{ results: (string | "ERR")[][]; loaderCalls: number; log: string[] }> {
              const cache = createCache(plan.ttlMs);
              const fail = new Set(plan.failKeys ?? []);
              const log: string[] = [];
              const results: (string | "ERR")[][] = [];

              for (const round of plan.rounds) {
                const settled = await Promise.allSettled(
                  round.keys.map((key) =>
                    cache.get(key, round.now, async () => {
                      log.push(`load:${key}@${round.now}`);
                      if (fail.has(key)) throw new Error(`fail ${key}`);
                      return `${key}@${round.now}`;
                    }),
                  ),
                );
                results.push(settled.map((s) => (s.status === "fulfilled" ? s.value : "ERR")));
              }
              return { results, loaderCalls: cache.stats().loaderCalls, log };
            }
      - id: cache-redis
        title: "Redis: структуры, персистентность, pub/sub, streams, cluster, горячие ключи"
        content: lessons/cache/cache-redis.md
        quiz:
          question: "Инстансы BFF инвалидируют локальные кэши справочников по сообщению в Redis pub/sub. Инстанс перезапускался 30 секунд и пропустил сообщение об изменении. Что с его кэшем и что должно страховать?"
          options:
            - id: at-most-once
              text: "Pub/sub не хранит сообщения — отключённый пропустил навсегда; страхуют TTL на локальных записях и перечитывание при старте"
              correct: true
            - id: replay
              text: "Ничего страшного: при переподключении Redis доставит пропущенные сообщения из буфера канала"
              explanation: "У pub/sub нет буфера и повторной доставки — это доставка «сейчас подключённым», at-most-once. Хранение и догон — это Streams, другой механизм."
            - id: restart-clean
              text: "Кэш инстанса пуст после перезапуска, поэтому пропущенное сообщение ему безразлично"
              explanation: "В этот раз повезло: память процесса действительно пуста. Но тот же пропуск случается при сетевом разрыве без перезапуска — и тогда живой кэш остаётся со старьём. Рассчитывать на «пропустил — значит пустой» нельзя, нужна страховка TTL."
            - id: sub-ack
              text: "Нужно включить подтверждения подписчиков в pub/sub, чтобы Redis повторял недоставленное"
              explanation: "Подтверждений у pub/sub нет как класса — механизм спроектирован без хранения. Подтверждения и группы потребителей есть у Redis Streams; либо смириться и страховаться TTL."
      - id: cache-distributed-lock
        title: "Распределённая блокировка: lease, fencing token, Redlock"
        content: lessons/cache/cache-distributed-lock.md
        quiz:
          question: "Воркер взял Redis-замок с TTL 60 с на выгрузку, завис на GC-паузу 90 секунд, аренда истекла, замок взял второй воркер. Первый ожил и продолжил писать в внешнюю систему параллельно со вторым. Что защищает от этого сценария?"
          options:
            - id: fencing
              text: "Fencing token: растущий номер от замка, и принимающая система отвергает номера меньше виденного"
              correct: true
            - id: longer-ttl
              text: "TTL побольше — 10 минут, чтобы никакая пауза не пережила аренду"
              explanation: "Любой TTL проигрывает достаточно долгой паузе, а длинная аренда означает, что после настоящего падения замок висит мёртвым в десять раз дольше. Порог всегда угадывается неправильно — нужен механизм, а не константа."
            - id: del-token
              text: "Проверка токена при снятии замка через Lua-скрипт — она и существует для этого случая"
              explanation: "Токен при снятии защищает от другого: чтобы оживший держатель не удалил чужой замок. Писать в защищаемый ресурс он всё равно продолжит — снятие замка тут ни при чём."
            - id: redlock-fix
              text: "Redlock: кворум из пяти узлов Redis гарантирует, что два держателя невозможны"
              explanation: "Кворум защищает от падения узлов Redis, но пауза процесса обманывает и его — это ядро известной критики Redlock. Строгая защита живёт на стороне ресурса: fencing token и идемпотентность."
      - id: cache-practice-lru
        title: "Практика: LRU-кэш с TTL"
        content: lessons/cache/cache-practice-lru.md
        practice:
          type: code
          language: typescript
          entry: runLru
          prompt: "Реализуйте runLru(capacity, ttlMs, ops): LRU-кэш с TTL — set/get/delete/keys, вытеснение давно не использованных, протухшие записи освобождают место. Форматы журнала — в уроке."
          starter: |
            type Op =
              | ["set", string, string, number]
              | ["get", string, number]
              | ["delete", string, number]
              | ["keys", number];

            export function runLru(capacity: number, ttlMs: number, ops: Op[]): { log: string[] } {
              // ...
              return { log: [] };
            }
          cases:
            - args:
                - 2
                - 100
                - - ["set", "a", "1", 0]
                  - ["set", "b", "2", 10]
                  - ["get", "a", 20]
                  - ["set", "c", "3", 30]
                  - ["keys", 40]
              expected:
                log: ["set:a", "set:b", "get:a:1", "set:c:evicted:b", "keys:c,a"]
            - args:
                - 2
                - 100
                - - ["set", "a", "1", 0]
                  - ["set", "b", "2", 10]
                  - ["set", "a", "9", 20]
                  - ["set", "c", "3", 30]
                  - ["get", "a", 40]
              expected:
                log: ["set:a", "set:b", "set:a", "set:c:evicted:b", "get:a:9"]
            - args:
                - 2
                - 100
                - - ["set", "a", "1", 0]
                  - ["set", "b", "2", 10]
                  - ["set", "c", "3", 105]
                  - ["keys", 106]
              expected:
                log: ["set:a", "set:b", "set:c", "keys:c,b"]
            - args:
                - 1
                - 100
                - - ["set", "a", "1", 0]
                  - ["set", "b", "2", 1]
                  - ["get", "a", 2]
                  - ["get", "b", 3]
              expected:
                log: ["set:a", "set:b:evicted:a", "get:a:miss", "get:b:2"]
            - args:
                - 2
                - 100
                - - ["set", "a", "1", 0]
                  - ["get", "a", 100]
                  - ["delete", "a", 101]
                  - ["keys", 102]
              expected:
                log: ["set:a", "get:a:miss", "del:a:none", "keys:-"]
            - args:
                - 3
                - 1000
                - - ["set", "a", "1", 0]
                  - ["set", "b", "2", 1]
                  - ["set", "c", "3", 2]
                  - ["get", "b", 3]
                  - ["delete", "a", 4]
                  - ["keys", 5]
              expected:
                log: ["set:a", "set:b", "set:c", "get:b:2", "del:a:ok", "keys:b,c"]
          solution: |
            type Op =
              | ["set", string, string, number]
              | ["get", string, number]
              | ["delete", string, number]
              | ["keys", number];

            type Entry = { value: string; setAt: number };

            export function runLru(capacity: number, ttlMs: number, ops: Op[]): { log: string[] } {
              const log: string[] = [];
              // Map хранит порядок вставки: последний — самый свежий.
              const store = new Map<string, Entry>();

              const isDead = (e: Entry, now: number) => now - e.setAt >= ttlMs;
              const purge = (now: number) => {
                for (const [k, e] of store) if (isDead(e, now)) store.delete(k);
              };
              const touch = (key: string, e: Entry) => {
                store.delete(key);
                store.set(key, e);
              };

              for (const op of ops) {
                if (op[0] === "set") {
                  const [, key, value, now] = op;
                  purge(now);
                  if (store.has(key)) {
                    touch(key, { value, setAt: now });
                    log.push(`set:${key}`);
                  } else if (store.size >= capacity) {
                    const victim = store.keys().next().value as string;
                    store.delete(victim);
                    store.set(key, { value, setAt: now });
                    log.push(`set:${key}:evicted:${victim}`);
                  } else {
                    store.set(key, { value, setAt: now });
                    log.push(`set:${key}`);
                  }
                } else if (op[0] === "get") {
                  const [, key, now] = op;
                  const e = store.get(key);
                  if (!e || isDead(e, now)) {
                    if (e) store.delete(key);
                    log.push(`get:${key}:miss`);
                  } else {
                    touch(key, e);
                    log.push(`get:${key}:${e.value}`);
                  }
                } else if (op[0] === "delete") {
                  const [, key, now] = op;
                  const e = store.get(key);
                  if (e && !isDead(e, now)) {
                    store.delete(key);
                    log.push(`del:${key}:ok`);
                  } else {
                    if (e) store.delete(key);
                    log.push(`del:${key}:none`);
                  }
                } else {
                  const [, now] = op;
                  purge(now);
                  const keys = [...store.keys()].reverse();
                  log.push(`keys:${keys.length > 0 ? keys.join(",") : "-"}`);
                }
              }
              return { log };
            }

  - id: queues
    title: "Модуль 7. Очереди, брокеры, фоновые задачи"
    lessons:
      - id: queues-why
        title: "Зачем очередь: развязка по времени, сглаживание нагрузки, фоновая работа"
        content: lessons/queues/queues-why.md
        quiz:
          question: "Создание обращения синхронно вызывает notifications, который синхронно зовёт провайдера SMS. Провайдер деградировал до 5 секунд на запрос. Что произойдёт и что даст очередь между cases и notifications?"
          options:
            - id: decouple
              text: "Каждый оператор ждёт провайдера 5 секунд, а его отказ валит создание обращений; очередь это развяжет"
              correct: true
            - id: faster-sms
              text: "Очередь ускорит отправку SMS: сообщения будут уходить провайдеру пачками и быстрее"
              explanation: "Очередь не ускоряет работу — провайдер как отвечал 5 секунд, так и отвечает. Она убирает это ожидание из ответа оператору и сглаживает пики; суммарная работа не меняется."
            - id: no-problem
              text: "Проблемы нет: Node асинхронный, и пока ждём провайдера, цикл событий обслуживает других операторов"
              explanation: "Поток действительно не блокируется, но оператор-то ждёт свой ответ 5 секунд, соединения и память копятся, а отказ провайдера по-прежнему превращается в отказ создания обращений. Асинхронность Node не разрывает связь доступности сервисов."
            - id: retry-solves
              text: "Достаточно добавить ретраи в вызов провайдера — очередь избыточна"
              explanation: "Ретраи внутри синхронного запроса удлиняют ожидание оператора ещё больше и умирают вместе с процессом. Повторы без участия инициатора — как раз то, что даёт очередь."
      - id: queues-rabbitmq
        title: "RabbitMQ: exchange, routing, ack, prefetch, DLX"
        content: lessons/queues/queues-rabbitmq.md
        quiz:
          question: "Воркер notifications читает очередь с autoAck и prefetch по умолчанию. При деплое воркер перезапускается, и часть SMS не уходит клиентам без каких-либо следов. Почему?"
          options:
            - id: autoack
              text: "autoAck подтвердил сообщения при доставке: погибшее у воркера брокер считает обработанным"
              correct: true
            - id: not-durable
              text: "Очередь не durable, и при деплое сервиса брокер теряет её содержимое"
              explanation: "Durable касается рестарта брокера, а деплоился воркер — брокер жил. Сообщения пропали не из хранилища, а из-за того, что брокер считает их доставленными: autoAck подтвердил их в момент отправки потребителю."
            - id: dlx-missing
              text: "Нет DLX: сообщения упавшего воркера ушли в никуда вместо очереди мёртвых писем"
              explanation: "DLX принимает отвергнутые и протухшие сообщения. Здесь сообщения никто не отвергал — они были формально подтверждены самим фактом доставки; до DLX-логики дело не доходит."
            - id: prefetch-big
              text: "Слишком большой prefetch: воркер забрал больше, чем успел, — нужно prefetch: 1"
              explanation: "Prefetch определяет, сколько сообщений в полёте, и усугубляет масштаб потери, но не её причину: с ack после обработки даже большая пачка вернулась бы в очередь при смерти воркера."
      - id: queues-kafka
        title: "Kafka: лог, партиции, offset, consumer group, retention"
        content: lessons/queues/queues-kafka.md
        quiz:
          question: "Топик case-events разбит на 8 партиций, ключ — caseId. Группа audit не успевает: lag растёт. Ops добавляет воркеров в группу с 8 до 16. Что изменится?"
          options:
            - id: capped
              text: "Ничего: партиция читается одним членом группы, 8 лишних воркеров простаивают; потолок параллелизма — число партиций"
              correct: true
            - id: doubles
              text: "Пропускная способность удвоится: 16 воркеров разберут поток вдвое быстрее"
              explanation: "Параллелизм группы ограничен партициями: 8 партиций — максимум 8 работающих членов. Девятый и дальше не получат ни одной партиции. Расширять нужно топик — а это решение, которое стоило принять при его создании."
            - id: rebalance-fix
              text: "Поможет, но не сразу: после ребалансировки партиции перераспределятся по 16 воркерам равномерно"
              explanation: "Ребалансировка перераспределит те же 8 партиций: у половины воркеров окажется по одной, у другой половины — ни одной. Меньше партиции не делятся."
            - id: keys
              text: "Зависит от ключей: если caseId-ов больше 8, Kafka сама раскинет их по 16 воркерам"
              explanation: "Ключи распределяются по партициям, а не по воркерам: сколько бы ни было caseId-ов, они хешируются в 8 партиций, и читать каждую будет по-прежнему один член группы."
      - id: queues-guarantees
        title: "Гарантии доставки: at-most-once, at-least-once, exactly-once и порядок"
        content: lessons/queues/queues-guarantees.md
        quiz:
          question: "Команда включила «exactly-once» в Kafka (идемпотентный продюсер + транзакции) и убрала дедупликацию в notifications: «дублей больше не бывает». Отправка SMS идёт HTTP-вызовом провайдера. Что с этим решением?"
          options:
            - id: boundary
              text: "Exactly-once Kafka кончается на её границе: HTTP-вызов может повториться, дедупликация обязана остаться"
              correct: true
            - id: correct
              text: "Решение верно: транзакции Kafka гарантируют однократную обработку каждого сообщения"
              explanation: "Транзакции Kafka покрывают цепочки «прочитал из топика — записал в топик». HTTP-вызов провайдера в транзакцию Kafka не входит: повторная доставка после сбоя воркера повторит и вызов."
            - id: http-idempotent
              text: "Решение верно при условии, что провайдер SMS сам идемпотентен по номеру телефона"
              explanation: "Идемпотентность по телефону означала бы «один SMS навсегда» — клиент должен получать разные уведомления. Нужна идемпотентность по ключу конкретной отправки, и это как раз та дедупликация, которую убрали."
            - id: at-most
              text: "Правильнее переключиться на at-most-once: коммитить offset до обработки, тогда дублей точно не будет"
              explanation: "Дублей не будет — будут потери: упавший после коммита воркер молча съест сообщения, и клиенты не получат уведомлений. Для уведомлений банка потеря хуже дубля, который к тому же лечится дедупликацией."
      - id: queues-practice-idempotent-consumer
        title: "Практика: идемпотентный консьюмер"
        content: lessons/queues/queues-practice-idempotent-consumer.md
        practice:
          type: code
          language: typescript
          entry: consume
          prompt: "Реализуйте consume(events): идемпотентный консьюмер с дедупликацией по messageId и отбрасыванием устаревших версий. Журнал dup/stale/apply и правила — в уроке."
          starter: |
            type Event = { messageId: string; cardId: number; version: number; status: string };
            type Result = {
              state: Record<number, { version: number; status: string }>;
              log: string[];
              applied: number;
            };

            export function consume(events: Event[]): Result {
              // ...
              return { state: {}, log: [], applied: 0 };
            }
          cases:
            - args:
                - - { messageId: "m1", cardId: 5, version: 1, status: "active" }
                  - { messageId: "m2", cardId: 5, version: 2, status: "blocked" }
                  - { messageId: "m2", cardId: 5, version: 2, status: "blocked" }
                  - { messageId: "m3", cardId: 5, version: 1, status: "active" }
              expected:
                state: { "5": { version: 2, status: "blocked" } }
                log: ["apply:m1:v1", "apply:m2:v2", "dup:m2", "stale:m3:v1"]
                applied: 2
            - args:
                - - { messageId: "a", cardId: 1, version: 3, status: "reissue" }
                  - { messageId: "b", cardId: 1, version: 2, status: "blocked" }
                  - { messageId: "c", cardId: 2, version: 1, status: "active" }
              expected:
                state:
                  "1": { version: 3, status: "reissue" }
                  "2": { version: 1, status: "active" }
                log: ["apply:a:v3", "stale:b:v2", "apply:c:v1"]
                applied: 2
            - args:
                - - { messageId: "x", cardId: 7, version: 4, status: "blocked" }
                  - { messageId: "y", cardId: 7, version: 4, status: "active" }
              expected:
                state: { "7": { version: 4, status: "blocked" } }
                log: ["apply:x:v4", "stale:y:v4"]
                applied: 1
            - args:
                - - { messageId: "m9", cardId: 3, version: 2, status: "blocked" }
                  - { messageId: "m9", cardId: 3, version: 5, status: "active" }
              expected:
                state: { "3": { version: 2, status: "blocked" } }
                log: ["apply:m9:v2", "dup:m9"]
                applied: 1
            - args:
                - []
              expected:
                state: {}
                log: []
                applied: 0
          solution: |
            type Event = { messageId: string; cardId: number; version: number; status: string };
            type Result = {
              state: Record<number, { version: number; status: string }>;
              log: string[];
              applied: number;
            };

            export function consume(events: Event[]): Result {
              const state: Record<number, { version: number; status: string }> = {};
              const seen = new Set<string>();
              const log: string[] = [];
              let applied = 0;

              for (const event of events) {
                if (seen.has(event.messageId)) {
                  log.push(`dup:${event.messageId}`);
                  continue;
                }
                seen.add(event.messageId);
                const current = state[event.cardId];
                if (current !== undefined && event.version <= current.version) {
                  log.push(`stale:${event.messageId}:v${event.version}`);
                  continue;
                }
                state[event.cardId] = { version: event.version, status: event.status };
                log.push(`apply:${event.messageId}:v${event.version}`);
                applied++;
              }
              return { state, log, applied };
            }
      - id: queues-outbox
        title: "Transactional outbox, inbox и CDC"
        content: lessons/queues/queues-outbox.md
        quiz:
          question: "Разработчик предлагает вместо outbox публиковать событие в Kafka сразу после commit-а, а при ошибке публикации — логировать и повторять из catch. Чем это хуже outbox?"
          options:
            - id: crash-window
              text: "Смерть процесса между commit-ом и публикацией теряет событие безвозвратно: повторять некому"
              correct: true
            - id: same
              text: "Ничем: повторы из catch дают ту же надёжность, что и реле outbox"
              explanation: "Catch работает, пока жив процесс. Убитый контейнер, OOM или деплой между commit-ом и публикацией не оставит ни события, ни записи об ошибке — эту дыру и закрывает outbox, где событие уже лежит в базе."
            - id: order-only
              text: "Хуже только порядком: события из catch могут публиковаться не в исходной последовательности"
              explanation: "Порядок — второстепенная разница. Главная — окно потери: между фиксацией транзакции и публикацией процесс смертен, и повтор после смерти невозможен без записанного события."
            - id: kafka-tx
              text: "Ничем, если включить транзакции Kafka: они свяжут commit Postgres и публикацию атомарно"
              explanation: "Транзакции Kafka не распространяются на Postgres — это две независимые системы, и атомарной пары «commit базы + publish» не существует. Атомарность даёт только запись события в ту же базу."
      - id: queues-practice-outbox
        title: "Практика: обращение и событие outbox в одной транзакции"
        content: lessons/queues/queues-practice-outbox.md
        practice:
          type: sql
          sandbox: pult
          prompt: "В одной транзакции создайте обращение клиента 4 (disputed-operation, open, priority 1, created_at '2026-03-07T11:00:00Z'), событие created в case_events (payload {\"channel\":\"chat\"}, то же время) и строку outbox (topic case.created, payload {\"caseId\":<id>}, то же время, published_at NULL). id обращения возьмите из insert ... returning. После commit выведите topic и payload неопубликованных строк outbox."
          solution: |
            begin;
            with new_case as (
              insert into cases (customer_id, assignee_id, topic, status, priority, created_at, closed_at)
              values (4, null, 'disputed-operation', 'open', 1, '2026-03-07T11:00:00Z', null)
              returning id
            ), ev as (
              insert into case_events (case_id, kind, actor_id, payload, created_at)
              select id, 'created', null, '{"channel":"chat"}'::jsonb, '2026-03-07T11:00:00Z' from new_case
            )
            insert into outbox (topic, payload, created_at, published_at)
            select 'case.created', jsonb_build_object('caseId', id), '2026-03-07T11:00:00Z', null from new_case;
            commit;
            select topic, payload from outbox where published_at is null;
      - id: queues-retry-dlq
        title: "Повторы, backoff, DLQ, ядовитые сообщения и порядок"
        content: lessons/queues/queues-retry-dlq.md
        quiz:
          question: "Сообщение с нечитаемым payload валит обработчик, возвращается в очередь через nack с requeue и немедленно приходит снова — воркер крутится в вечном цикле. Как это чинится системно?"
          options:
            - id: classify
              text: "Классификацией ошибок: постоянные (битый payload) — сразу в DLQ без повторов, транзиентные — отложенный повтор с backoff и лимитом попыток"
              correct: true
            - id: try-catch
              text: "Обернуть разбор payload в try/catch и просто пропускать нечитаемые сообщения"
              explanation: "Молчаливый пропуск — это потеря: недоставленный эффект без следа и алёрта. Ядовитое сообщение должно попасть в DLQ, где его увидят, починят причину и переиграют."
            - id: more-workers
              text: "Добавить воркеров: пока один крутится на ядовитом сообщении, остальные разберут очередь"
              explanation: "Ядовитое сообщение после requeue достанется и другим воркерам — цикл размножится, а не рассосётся. Причина не в мощности, а в том, что постоянную ошибку повторяют."
            - id: bigger-ttl
              text: "Поставить сообщениям TTL: нечитаемое само протухнет и исчезнет из очереди"
              explanation: "До истечения TTL цикл продолжит жечь воркеров, а после — сообщение исчезнет (или уйдёт в DLX, если он настроен) без разбора причины. TTL — не замена классификации ошибок и осмысленному маршруту в DLQ."
      - id: queues-practice-partitioner
        title: "Практика: параллельная обработка с порядком внутри ключа"
        content: lessons/queues/queues-practice-partitioner.md
        practice:
          type: code
          language: typescript
          entry: planWaves
          prompt: "Реализуйте planWaves(messages, limit): разложите сообщения по волнам — не больше limit в волне, ключ не повторяется в волне, внутри ключа строгий порядок, набор волны слева направо по оставшимся."
          starter: |
            type Message = { id: string; key: string };

            export function planWaves(messages: Message[], limit: number): string[][] {
              // ...
              return [];
            }
          cases:
            - args:
                - - { id: "a1", key: "A" }
                  - { id: "a2", key: "A" }
                  - { id: "b1", key: "B" }
                  - { id: "c1", key: "C" }
                  - { id: "b2", key: "B" }
                - 2
              expected: [["a1", "b1"], ["a2", "c1"], ["b2"]]
            - args:
                - - { id: "x1", key: "X" }
                  - { id: "x2", key: "X" }
                  - { id: "x3", key: "X" }
                - 5
              expected: [["x1"], ["x2"], ["x3"]]
            - args:
                - - { id: "a", key: "A" }
                  - { id: "b", key: "B" }
                  - { id: "c", key: "C" }
                - 1
              expected: [["a"], ["b"], ["c"]]
            - args:
                - []
                - 3
              expected: []
            - args:
                - - { id: "a1", key: "A" }
                  - { id: "b1", key: "B" }
                  - { id: "a2", key: "A" }
                  - { id: "b2", key: "B" }
                  - { id: "c1", key: "C" }
                  - { id: "d1", key: "D" }
                - 3
              expected: [["a1", "b1", "c1"], ["a2", "b2", "d1"]]
            - args:
                - - { id: "a1", key: "A" }
                  - { id: "a2", key: "A" }
                  - { id: "b1", key: "B" }
                - 2
              expected: [["a1", "b1"], ["a2"]]
          solution: |
            type Message = { id: string; key: string };

            export function planWaves(messages: Message[], limit: number): string[][] {
              const waves: string[][] = [];
              const remaining = messages.map((m, index) => ({ ...m, index }));
              const doneUpTo = new Map<string, number>(); // key -> index последнего обработанного

              while (remaining.length > 0) {
                const wave: string[] = [];
                const keysInWave = new Set<string>();
                const taken = new Set<number>();

                for (const msg of remaining) {
                  if (wave.length >= limit) break;
                  if (keysInWave.has(msg.key)) continue;
                  // все предыдущие сообщения этого ключа обработаны?
                  const hasEarlierPending = remaining.some(
                    (other) => other.key === msg.key && other.index < msg.index && !taken.has(other.index),
                  );
                  if (hasEarlierPending) continue;
                  wave.push(msg.id);
                  keysInWave.add(msg.key);
                  taken.add(msg.index);
                }

                waves.push(wave);
                for (let i = remaining.length - 1; i >= 0; i--) {
                  if (taken.has(remaining[i].index)) remaining.splice(i, 1);
                }
              }
              return waves;
            }
      - id: queues-jobs
        title: "Фоновые задачи: BullMQ, состояния, cron, приоритеты, массовые операции"
        content: lessons/queues/queues-jobs.md
        quiz:
          question: "Массовое переназначение 10 000 обращений сделано одной задачей BullMQ: цикл по обращениям внутри одного обработчика. На 7-й минуте воркер убит деплоем, задача вернулась как stalled и запустилась заново. Что произойдёт и как надо было проектировать?"
          options:
            - id: checkpoints
              text: "Задача начнёт с нуля, и уже переназначенные обращения обработаются повторно; резать на идемпотентные куски-чекпоинты, чтобы повтор продолжал, а не повторял эффект"
              correct: true
            - id: resume-auto
              text: "BullMQ продолжит задачу с места остановки: состояние цикла сохраняется в Redis автоматически"
              explanation: "BullMQ хранит статус и данные задачи, но не переменные вашего цикла: stalled-задача запускается обработчиком с начала. Продолжение с места — забота дизайна задачи: чекпоинты и идемпотентные шаги."
            - id: disable-stalled
              text: "Отключить обнаружение stalled: пусть недоделанная задача считается выполненной, а хвост доделают вручную"
              explanation: "Это превращает каждый деплой в молчаливо недоделанную операцию и ручную работу. Механизм stalled — страховка от потери, проблема не в нём, а в неidempотентном монолитном шаге."
            - id: single-tx
              text: "Обернуть все 10 000 обновлений в одну транзакцию Postgres: прерванная откатится, и повтор будет чистым"
              explanation: "Повтор будет чистым, но цена — многоминутная транзакция: блокировки на тысячах строк, раздутый WAL, мешает VACUUM (модуль Postgres). Для массовых операций стандарт — пачки с чекпоинтами, а не мегатранзакция."
      - id: queues-practice-jobs
        title: "Практика: планировщик задач с приоритетом, задержкой и повторами"
        content: lessons/queues/queues-practice-jobs.md
        practice:
          type: code
          language: typescript
          entry: runQueue
          prompt: "Реализуйте runQueue(cmds): очередь задач с приоритетом, отложенным запуском и повторами с экспоненциальным backoff (1000·2^(n-1)); tick берёт одну готовую задачу по правилам урока. Форматы журнала и сводки — в уроке."
          starter: |
            type Cmd =
              | { cmd: "add"; at: number; id: string; priority?: number; delayMs?: number; attempts?: number }
              | { cmd: "tick"; at: number; result: "ok" | "fail" };

            type Result = {
              log: string[];
              summary: { done: string[]; failed: string[]; pending: string[] };
            };

            export function runQueue(cmds: Cmd[]): Result {
              // ...
              return { log: [], summary: { done: [], failed: [], pending: [] } };
            }
          cases:
            - args:
                - - { cmd: "add", at: 0, id: "low", priority: 1 }
                  - { cmd: "add", at: 5, id: "high", priority: 9 }
                  - { cmd: "add", at: 10, id: "later", priority: 9, delayMs: 5000 }
                  - { cmd: "tick", at: 20, result: "ok" }
                  - { cmd: "tick", at: 30, result: "ok" }
                  - { cmd: "tick", at: 40, result: "ok" }
              expected:
                log: ["added:low", "added:high", "added:later", "done:high", "done:low", "idle"]
                summary: { done: ["high", "low"], failed: [], pending: ["later"] }
            - args:
                - - { cmd: "add", at: 0, id: "flaky", attempts: 3 }
                  - { cmd: "tick", at: 10, result: "fail" }
                  - { cmd: "tick", at: 500, result: "ok" }
                  - { cmd: "tick", at: 1200, result: "fail" }
                  - { cmd: "tick", at: 3000, result: "fail" }
                  - { cmd: "tick", at: 6000, result: "ok" }
              expected:
                log: ["added:flaky", "retry:flaky:in:1000", "idle", "retry:flaky:in:2000", "idle", "done:flaky"]
                summary: { done: ["flaky"], failed: [], pending: [] }
            - args:
                - - { cmd: "add", at: 0, id: "one" }
                  - { cmd: "tick", at: 5, result: "fail" }
                  - { cmd: "tick", at: 10, result: "ok" }
              expected:
                log: ["added:one", "failed:one", "idle"]
                summary: { done: [], failed: ["one"], pending: [] }
            - args:
                - - { cmd: "add", at: 0, id: "a", priority: 5 }
                  - { cmd: "add", at: 0, id: "b", priority: 5 }
                  - { cmd: "tick", at: 1, result: "ok" }
                  - { cmd: "tick", at: 2, result: "ok" }
              expected:
                log: ["added:a", "added:b", "done:a", "done:b"]
                summary: { done: ["a", "b"], failed: [], pending: [] }
            - args:
                - - { cmd: "add", at: 0, id: "delayed", priority: 9, delayMs: 100 }
                  - { cmd: "add", at: 0, id: "now", priority: 1 }
                  - { cmd: "tick", at: 50, result: "ok" }
                  - { cmd: "tick", at: 150, result: "ok" }
              expected:
                log: ["added:delayed", "added:now", "done:now", "done:delayed"]
                summary: { done: ["now", "delayed"], failed: [], pending: [] }
            - args:
                - - { cmd: "add", at: 0, id: "r", attempts: 2 }
                  - { cmd: "add", at: 0, id: "other", priority: -1 }
                  - { cmd: "tick", at: 10, result: "fail" }
                  - { cmd: "tick", at: 20, result: "ok" }
                  - { cmd: "tick", at: 1500, result: "fail" }
              expected:
                log: ["added:r", "added:other", "retry:r:in:1000", "done:other", "failed:r"]
                summary: { done: ["other"], failed: ["r"], pending: [] }
          solution: |
            type Cmd =
              | { cmd: "add"; at: number; id: string; priority?: number; delayMs?: number; attempts?: number }
              | { cmd: "tick"; at: number; result: "ok" | "fail" };

            type Result = {
              log: string[];
              summary: { done: string[]; failed: string[]; pending: string[] };
            };

            type Job = {
              id: string;
              priority: number;
              addedAt: number;
              order: number;
              readyAt: number;
              attemptsLeft: number;
              attemptsUsed: number;
              status: "pending" | "done" | "failed";
            };

            export function runQueue(cmds: Cmd[]): Result {
              const log: string[] = [];
              const jobs: Job[] = [];
              let order = 0;

              for (const cmd of cmds) {
                if (cmd.cmd === "add") {
                  jobs.push({
                    id: cmd.id,
                    priority: cmd.priority ?? 0,
                    addedAt: cmd.at,
                    order: order++,
                    readyAt: cmd.at + (cmd.delayMs ?? 0),
                    attemptsLeft: cmd.attempts ?? 1,
                    attemptsUsed: 0,
                    status: "pending",
                  });
                  log.push(`added:${cmd.id}`);
                } else {
                  const ready = jobs
                    .filter((j) => j.status === "pending" && j.readyAt <= cmd.at)
                    .sort(
                      (a, b) =>
                        b.priority - a.priority || a.addedAt - b.addedAt || a.order - b.order,
                    );
                  const job = ready[0];
                  if (!job) {
                    log.push("idle");
                    continue;
                  }
                  job.attemptsUsed++;
                  job.attemptsLeft--;
                  if (cmd.result === "ok") {
                    job.status = "done";
                    log.push(`done:${job.id}`);
                  } else if (job.attemptsLeft > 0) {
                    const backoff = 1000 * 2 ** (job.attemptsUsed - 1);
                    job.readyAt = cmd.at + backoff;
                    log.push(`retry:${job.id}:in:${backoff}`);
                  } else {
                    job.status = "failed";
                    log.push(`failed:${job.id}`);
                  }
                }
              }
              const byOrder = [...jobs].sort((a, b) => a.order - b.order);
              return {
                log,
                summary: {
                  done: log.filter((l) => l.startsWith("done:")).map((l) => l.slice(5)),
                  failed: log.filter((l) => l.startsWith("failed:")).map((l) => l.slice(7)),
                  pending: byOrder.filter((j) => j.status === "pending").map((j) => j.id),
                },
              };
            }
      - id: scr-queues
        title: "Пункт 5б. Очереди и Kafka: партиции, consumer groups, идемпотентный консьюмер"
        content: lessons/queues/scr-queues.md
        quiz:
          question: "У топика 2 партиции, в consumer group запустили 3 экземпляра сервиса. Что делает третий?"
          options:
            - id: idle
              text: "Простаивает в резерве: партицию читает ровно один член группы, поэтому параллелизм чтения ограничен числом партиций"
              correct: true
            - id: share
              text: "Читает обе партиции наравне с первыми двумя: чем больше читателей, тем быстрее разбирается поток"
              explanation: "Тогда одно событие обрабатывалось бы в группе дважды и порядок внутри партиции рассыпался бы. Правило одно: в пределах группы у партиции один читатель."
            - id: copy
              text: "Получает собственную копию всех событий топика и обрабатывает их независимо от первых двух"
              explanation: "Копию всего потока получает другая consumer group — отдельный сервис-подписчик со своей закладкой. Члены одной группы делят поток, а не дублируют его."
            - id: autoscale
              text: "Kafka создаёт третью партицию, чтобы каждому читателю досталось по одной"
              explanation: "Число партиций — свойство топика, заданное при создании; брокер не меняет его под число читателей. Наоборот: параллелизм потребителей планируют от числа партиций."

  - id: fintech
    title: "Модуль 8. Финтех-домен: деньги, платежи и их учёт"
    lessons:
      - id: fin-domain
        title: "Финтех-домен: необанк на стейблкоинах изнутри"
        content: lessons/fintech/fin-domain.md
        quiz:
          question: "Клиент «Монеты» видит в приложении баланс 250 USDT. Что это на самом деле в кастодиальной модели?"
          options:
            - id: ledger-record
              text: "Запись в учёте платформы: сумма проводок по счёту клиента в её ledger; адресами и ключами в блокчейне управляет сама платформа"
              correct: true
            - id: own-address
              text: "Остаток на личном блокчейн-адресе клиента, ключи от которого хранятся в его приложении"
              explanation: "Кастодиальная модель означает ровно обратное: ключи держит платформа, а у клиента — учётная запись в её системе. Кошелёк, где ключи у клиента, называется некастодиальным — это другой продукт с другой ответственностью платформы."
            - id: bank-reserve
              text: "Деньги на счёте платформы в местном банке-партнёре, зарезервированные один к одному под этого клиента"
              explanation: "Резервы под выпущенные токены держит эмитент стейблкоина, а не необанк под каждого клиента. Балансы клиентов платформа учитывает сама — в собственном ledger, и в этом её главная инженерная ответственность."
            - id: balance-column
              text: "Значение колонки balance в таблице клиентов, которое сервисы увеличивают и уменьшают при каждой операции"
              explanation: "Так финтех деньги не хранит: колонка не отвечает на вопрос «откуда взялась эта сумма» и не переживает первый же спор с клиентом. Как устроен настоящий учёт — следующий урок про ledger."
      - id: fin-ledger
        title: "Ledger: баланс — это сумма проводок"
        content: lessons/fintech/fin-ledger.md
        quiz:
          question: "Неделю назад клиенту ошибочно зачислили 500, сегодня это заметили. Как исправляет ошибку правильно устроенный ledger?"
          options:
            - id: correction
              text: "Новой корректирующей операцией на −500 со ссылкой на ошибочную: история сохраняет и ошибку, и исправление"
              correct: true
            - id: update-entry
              text: "UPDATE исходной проводки на верную сумму: история остаётся чистой, без следов ошибки"
              explanation: "Отчёты и выписки, снятые за прошедшую неделю, перестанут сходиться с базой — прошлое изменилось под ногами у аудита. Append-only и существует для того, чтобы записанное однажды не менялось никогда."
            - id: delete-entry
              text: "Удалить ошибочную проводку вместе с парной: операции как не было"
              explanation: "«Как не было» — это дыра в учёте, а для регулятора — признак подделки журнала. В правильном ledger у роли приложения вообще нет прав на DELETE: инвариант держит база, а не договорённость."
            - id: fix-cache
              text: "Поправить кэшированный остаток счёта: он главный, а проводки — просто история для отчётов"
              explanation: "Главный — журнал проводок, остаток — производное от него значение. Кэш, поправленный без корректирующей проводки, разойдётся с журналом при первом же пересчёте — и вопрос «кому верить» встанет снова."
      - id: fin-kyc
        title: "KYC и онбординг: асинхронный флоу с провайдером"
        content: lessons/fintech/fin-kyc.md
        quiz:
          question: "Клиент с базовым уровнем KYC отправляет через API запрос на вывод суммы выше лимита своего уровня. Кнопку такого вывода приложение ему не показывает. Что должен сделать бэкенд?"
          options:
            - id: server-check
              text: "Отклонить операцию и предложить пройти следующий уровень проверки: уровень KYC и его лимиты сервер проверяет на каждой денежной операции"
              correct: true
            - id: trust-ui
              text: "Ничего особенного: раз интерфейс не показывает кнопку, такой запрос в нормальной работе не придёт"
              explanation: "Запрос приходит и мимо приложения — из скрипта, по украденному токену, из старой версии клиента. Спрятанная кнопка — удобство интерфейса, а не защита; серверная проверка обязана существовать независимо от него."
            - id: kyc-passed
              text: "Пропустить: KYC уже пройден при онбординге, повторять проверку на каждой операции избыточно"
              explanation: "Пройден базовый уровень — а лимиты привязаны к уровню. «Можно ли эту операцию этому клиенту» — вопрос каждой операции, и ответ зависит от её суммы и текущего уровня клиента, а не от факта давнего онбординга."
            - id: block-account
              text: "Заблокировать учётную запись: попытка провести операцию выше лимита — признак мошенничества"
              explanation: "Чаще всего это честный клиент, не знавший о лимите. Правильный ответ системы — отказ с понятной причиной и предложением поднять уровень проверки; блокировка за легитимный запрос — потерянный клиент."
      - id: fin-limits
        title: "Anti-fraud и лимиты: счётчики, правила, решения"
        content: lessons/fintech/fin-limits.md
        quiz:
          question: "Дневной лимит клиента 1 000, потрачено 900. Он отправляет два платежа по 100 одновременно, и оба должны упереться в остаток лимита — пройти может только один. Как построить проверку?"
          options:
            - id: atomic-update
              text: "Проверка и списание лимита — одно атомарное действие: условный UPDATE «прибавить 100, если итог не превысит 1 000»; ноль обновлённых строк — отказ"
              correct: true
            - id: read-check-write
              text: "В транзакции прочитать счётчик, сравнить с лимитом и записать новое значение — транзакция защитит от гонки"
              explanation: "На уровне Read Committed обе транзакции спокойно прочитают 900 и обе запишут 1 000 — транзакция сама по себе гонку «прочитал-проверил-записал» не убирает. Нужна атомарность самой проверки-траты: условный UPDATE или блокировка строки счётчика."
            - id: client-side
              text: "Показывать остаток лимита в приложении и не давать отправить второй платёж, пока не завершился первый"
              explanation: "Проверка на клиенте — удобство, а не защита: запросы приходят и мимо приложения, и с двух устройств сразу. Лимит, который держится только интерфейсом, — это отсутствие лимита."
            - id: check-after
              text: "Исполнить оба платежа, а фоновая проверка лимитов откатит лишний"
              explanation: "Деньги уже ушли: откат внешнего перевода — не UPDATE в своей базе, а отдельная операция возврата, которая может и не удаться. Лимит, проверяемый после исполнения, защищает отчёт, а не деньги."
      - id: fin-providers
        title: "Платёжные провайдеры: вебхуки, подписи, сверка"
        content: lessons/fintech/fin-providers.md
        quiz:
          question: "«Монета» отправила провайдеру запрос на вывод 500 в местный банк и не получила ответа за таймаут. Что делает правильно построенный сервис?"
          options:
            - id: query-status
              text: "Переводит операцию в статус «неизвестно» и запрашивает у провайдера её статус по своему идемпотентному ключу; повтор — только с тем же ключом"
              correct: true
            - id: retry-new-key
              text: "Повторяет запрос с новым идемпотентным ключом, чтобы провайдер не отбросил его как дубль"
              explanation: "Ключ и существует ровно для того, чтобы повтор не исполнился вторым переводом. Новый ключ превращает защиту в двойную отправку: если первый запрос дошёл, клиент получит два вывода."
            - id: mark-failed
              text: "Помечает вывод неуспешным и возвращает 500 на баланс клиента: ответа нет — значит, операции не было"
              explanation: "Таймаут — это «неизвестно», а не «нет»: запрос мог дойти, потеряться мог только ответ. Вернув деньги на баланс, платформа рискует заплатить дважды — клиенту на счёт и в банк."
            - id: mark-success
              text: "Помечает вывод успешным: провайдер надёжный, ответ наверняка потерялся в сети"
              explanation: "А мог и не дойти сам запрос — тогда клиент увидит «выведено», а деньги никуда не ушли. Определённость даёт только запрос статуса операции у провайдера, надежда — не механизм."
      - id: fin-practice-ledger
        title: "Практика: вебхуки провайдера поверх ledger"
        content: lessons/fintech/fin-practice-ledger.md
        practice:
          type: code
          language: typescript
          entry: processWebhooks
          prompt: "Реализуйте processWebhooks(events): дедупликация по id события, валидация суммы, проводки двойной записи deposit/withdrawal, отказ при недостатке средств; верните results, entries и balances."
          starter: |
            type WebhookEvent = {
              id: string;
              type: "deposit" | "withdrawal";
              account: string;
              amount: number;
            };

            type Entry = { account: string; delta: number };

            type Result =
              | { id: string; status: "applied" | "duplicate" }
              | { id: string; status: "rejected"; reason: "invalid" | "insufficient_funds" };

            type Outcome = {
              results: Result[];
              entries: Entry[];
              balances: Record<string, number>;
            };

            export function processWebhooks(events: WebhookEvent[]): Outcome {
              // ...
              return { results: [], entries: [], balances: {} };
            }
          cases:
            - args:
                - - { id: "d1", type: "deposit", account: "alice", amount: 1000 }
                  - { id: "w1", type: "withdrawal", account: "alice", amount: 300 }
              expected:
                results:
                  - { id: "d1", status: "applied" }
                  - { id: "w1", status: "applied" }
                entries:
                  - { account: "treasury", delta: -1000 }
                  - { account: "alice", delta: 1000 }
                  - { account: "alice", delta: -300 }
                  - { account: "treasury", delta: 300 }
                balances: { treasury: -700, alice: 700 }
            - args:
                - - { id: "d1", type: "deposit", account: "alice", amount: 500 }
                  - { id: "d1", type: "deposit", account: "alice", amount: 500 }
                  - { id: "d2", type: "deposit", account: "alice", amount: 500 }
              expected:
                results:
                  - { id: "d1", status: "applied" }
                  - { id: "d1", status: "duplicate" }
                  - { id: "d2", status: "applied" }
                entries:
                  - { account: "treasury", delta: -500 }
                  - { account: "alice", delta: 500 }
                  - { account: "treasury", delta: -500 }
                  - { account: "alice", delta: 500 }
                balances: { treasury: -1000, alice: 1000 }
            - args:
                - - { id: "w1", type: "withdrawal", account: "bob", amount: 100 }
                  - { id: "d1", type: "deposit", account: "bob", amount: 100 }
                  - { id: "w2", type: "withdrawal", account: "bob", amount: 100 }
              expected:
                results:
                  - { id: "w1", status: "rejected", reason: "insufficient_funds" }
                  - { id: "d1", status: "applied" }
                  - { id: "w2", status: "applied" }
                entries:
                  - { account: "treasury", delta: -100 }
                  - { account: "bob", delta: 100 }
                  - { account: "bob", delta: -100 }
                  - { account: "treasury", delta: 100 }
                balances: { treasury: 0, bob: 0 }
            - args:
                - - { id: "d1", type: "deposit", account: "alice", amount: 0 }
                  - { id: "d2", type: "deposit", account: "alice", amount: -5 }
                  - { id: "d3", type: "deposit", account: "alice", amount: 10.5 }
                  - { id: "d4", type: "deposit", account: "alice", amount: 100 }
              expected:
                results:
                  - { id: "d1", status: "rejected", reason: "invalid" }
                  - { id: "d2", status: "rejected", reason: "invalid" }
                  - { id: "d3", status: "rejected", reason: "invalid" }
                  - { id: "d4", status: "applied" }
                entries:
                  - { account: "treasury", delta: -100 }
                  - { account: "alice", delta: 100 }
                balances: { treasury: -100, alice: 100 }
            - args:
                - - { id: "w1", type: "withdrawal", account: "dave", amount: 50 }
                  - { id: "w1", type: "deposit", account: "dave", amount: 500 }
              expected:
                results:
                  - { id: "w1", status: "rejected", reason: "insufficient_funds" }
                  - { id: "w1", status: "duplicate" }
                entries: []
                balances: {}
            - args:
                - []
              expected:
                results: []
                entries: []
                balances: {}
          solution: |
            type WebhookEvent = {
              id: string;
              type: "deposit" | "withdrawal";
              account: string;
              amount: number;
            };

            type Entry = { account: string; delta: number };

            type Result =
              | { id: string; status: "applied" | "duplicate" }
              | { id: string; status: "rejected"; reason: "invalid" | "insufficient_funds" };

            type Outcome = {
              results: Result[];
              entries: Entry[];
              balances: Record<string, number>;
            };

            export function processWebhooks(events: WebhookEvent[]): Outcome {
              const results: Result[] = [];
              const entries: Entry[] = [];
              const balances: Record<string, number> = {};
              const seen = new Set<string>();

              const post = (account: string, delta: number) => {
                entries.push({ account, delta });
                balances[account] = (balances[account] ?? 0) + delta;
              };

              for (const event of events) {
                if (seen.has(event.id)) {
                  results.push({ id: event.id, status: "duplicate" });
                  continue;
                }
                seen.add(event.id);
                if (!Number.isInteger(event.amount) || event.amount <= 0) {
                  results.push({ id: event.id, status: "rejected", reason: "invalid" });
                  continue;
                }
                if (event.type === "deposit") {
                  post("treasury", -event.amount);
                  post(event.account, event.amount);
                  results.push({ id: event.id, status: "applied" });
                  continue;
                }
                const balance = balances[event.account] ?? 0;
                if (balance < event.amount) {
                  results.push({ id: event.id, status: "rejected", reason: "insufficient_funds" });
                  continue;
                }
                post(event.account, -event.amount);
                post("treasury", event.amount);
                results.push({ id: event.id, status: "applied" });
              }

              return { results, entries, balances };
            }

  - id: arch
    title: "Модуль 9. Архитектура: принципы, паттерны, распределённые системы"
    lessons:
      - id: arch-oop-solid
        title: "ООП и SOLID на бэкенде: что спрашивают и как отвечать примерами"
        content: lessons/arch/arch-oop-solid.md
        quiz:
          question: "В коде notifications в пяти местах есть switch (channel) с ветками sms и push; добавление мессенджера потребовало править все пять. Какой принцип нарушен и каков рефакторинг?"
          options:
            - id: ocp
              text: "OCP: код закрыт для расширения — новый канал требует модификаций; лечится Strategy с реестром каналов за общим интерфейсом"
              correct: true
            - id: srp
              text: "SRP: у switch-а слишком много веток, нужно разнести ветки по отдельным функциям в том же модуле"
              explanation: "Разнос по функциям не убирает главного: добавление канала по-прежнему правит существующий код в пяти местах. Проблема не в размере блока, а в закрытости к расширению — это OCP и стратегии."
            - id: lsp
              text: "LSP: sms и push ведут себя по-разному, значит их нельзя прятать за общий интерфейс"
              explanation: "Разное поведение за общим контрактом — это и есть штатный полиморфизм; LSP нарушился бы, если бы реализация не выполняла контракт интерфейса. Здесь интерфейса ещё нет — в этом и беда."
            - id: dip-only
              text: "DIP: каналы нужно внедрять через DI-контейнер, и switch станет не нужен сам собой"
              explanation: "Контейнер — механизм, а не решение: без интерфейса канала и реестра стратегий внедрять нечего. DIP здесь появится как следствие рефакторинга к Strategy, но диагноз — нарушение OCP."
      - id: arch-principles
        title: "DRY, KISS, YAGNI, композиция против наследования, связность и зацепление"
        content: lessons/arch/arch-principles.md
        quiz:
          question: "Валидации «создать поручение» и «обновить поручение» сегодня текстуально совпадают. Джун предлагает вынести в validatePayload(data, { isUpdate }) — «DRY же». Что ответит сеньор?"
          options:
            - id: false-dry
              text: "Это случайное сходство, а не одно знание: флаг isUpdate — признак ложного DRY"
              correct: true
            - id: agree-dry
              text: "Согласиться: любое дублирование — техдолг, и чем раньше вынести, тем дешевле"
              explanation: "DRY — про единственность знания, а не про отсутствие похожих строк. Создание и обновление меняются по разным причинам; склейка с флагом заставит каждую правку одного сценария оглядываться на другой."
            - id: inherit
              text: "Вынести общий BaseValidator и отнаследовать CreateValidator и UpdateValidator"
              explanation: "Наследование ради переиспользования кода — хрупкая база: изменение базового валидатора молча меняет обоих потомков — та же склейка разных знаний, только с иерархией сверху."
            - id: copy-forever
              text: "Никогда не выносить валидации в общее: у каждого эндпоинта всегда своя копия"
              explanation: "Обратная крайность: устойчиво совпадающие правила (формат номера счёта) — одно знание, и ему положено одно место. Решение принимается по причине изменения, а не догмой в любую сторону."
      - id: arch-patterns
        title: "Паттерны, которые живут на сервере: Strategy, Decorator, Chain, Observer, Factory, Builder"
        content: lessons/arch/arch-patterns.md
        quiz:
          question: "Канал уведомлений оборачивают: withMetrics(withRetry(smsChannel)) — обе обёртки реализуют тот же интерфейс NotificationChannel и всегда делегируют внутрь, добавляя своё. Какой это паттерн и чем он отличается от Chain of Responsibility?"
          options:
            - id: decorator
              text: "Decorator: слои дополняют и всегда зовут обёрнутого; звено Chain решает, идти ли дальше"
              correct: true
            - id: chain
              text: "Это Chain of Responsibility: обёртки образуют цепочку обработчиков запроса"
              explanation: "Внешне похоже — вызовы идут по цепочке, — но семантика другая: декоратор безусловно делегирует и дополняет, а звено Chain владеет решением «обработать, передать, оборвать». Middleware — Chain; withRetry — Decorator."
            - id: proxy
              text: "Это Proxy: обёртка стоит между клиентом и реальным каналом"
              explanation: "Структура у Proxy та же, но намерение — контролировать доступ к объекту (кэш, ленивость, права), а не наращивать поведение слоями. Метрики и ретраи поверх — классический Decorator."
            - id: template
              text: "Это Template Method: базовый алгоритм отправки с переопределяемыми шагами"
              explanation: "Template Method — про наследование: база зовёт шаги потомка. Здесь наследования нет вовсе — поведение собирается композицией обёрток, что и есть декоратор."
      - id: arch-practice-chain
        title: "Практика: конвейер проверок поручения"
        content: lessons/arch/arch-practice-chain.md
        practice:
          type: code
          language: typescript
          entry: runPipeline
          prompt: "Реализуйте runPipeline(checks, orders, mode): конвейер проверок по типу поручения с приоритетами, режимы fail-fast и collect-all. Правила отбора и форматы — в уроке."
          starter: |
            type Check = {
              name: string;
              priority: number;
              appliesTo: string[];
              failsFor: string[];
            };
            type Order = { id: string; type: string };
            type Verdict = { id: string; ok: boolean; passed: string[]; failed: string[] };

            export function runPipeline(
              checks: Check[],
              orders: Order[],
              mode: "fail-fast" | "collect-all",
            ): Verdict[] {
              // ...
              return [];
            }
          cases:
            - args:
                - - { name: "form", priority: 10, appliesTo: ["payment", "transfer"], failsFor: [] }
                  - { name: "rights", priority: 9, appliesTo: ["payment", "transfer"], failsFor: ["p2"] }
                  - { name: "limits", priority: 5, appliesTo: ["payment"], failsFor: ["p2", "p3"] }
                - - { id: "p1", type: "payment" }
                  - { id: "p2", type: "payment" }
                  - { id: "p3", type: "transfer" }
                - "fail-fast"
              expected:
                - { id: "p1", ok: true, passed: ["form", "rights", "limits"], failed: [] }
                - { id: "p2", ok: false, passed: ["form"], failed: ["rights"] }
                - { id: "p3", ok: true, passed: ["form", "rights"], failed: [] }
            - args:
                - - { name: "form", priority: 10, appliesTo: ["payment"], failsFor: ["x"] }
                  - { name: "limits", priority: 5, appliesTo: ["payment"], failsFor: ["x"] }
                - - { id: "x", type: "payment" }
                - "collect-all"
              expected:
                - { id: "x", ok: false, passed: [], failed: ["form", "limits"] }
            - args:
                - - { name: "a", priority: 5, appliesTo: ["t"], failsFor: [] }
                  - { name: "b", priority: 5, appliesTo: ["t"], failsFor: [] }
                  - { name: "c", priority: 7, appliesTo: ["t"], failsFor: [] }
                - - { id: "o1", type: "t" }
                - "fail-fast"
              expected:
                - { id: "o1", ok: true, passed: ["c", "a", "b"], failed: [] }
            - args:
                - - { name: "form", priority: 10, appliesTo: ["payment"], failsFor: [] }
                - - { id: "z", type: "unknown-type" }
                - "fail-fast"
              expected:
                - { id: "z", ok: true, passed: [], failed: [] }
          solution: |
            type Check = {
              name: string;
              priority: number;
              appliesTo: string[];
              failsFor: string[];
            };
            type Order = { id: string; type: string };
            type Verdict = { id: string; ok: boolean; passed: string[]; failed: string[] };

            export function runPipeline(
              checks: Check[],
              orders: Order[],
              mode: "fail-fast" | "collect-all",
            ): Verdict[] {
              return orders.map((order) => {
                const pipeline = checks
                  .map((check, index) => ({ check, index }))
                  .filter(({ check }) => check.appliesTo.includes(order.type))
                  .sort((a, b) => b.check.priority - a.check.priority || a.index - b.index)
                  .map(({ check }) => check);

                const passed: string[] = [];
                const failed: string[] = [];
                for (const check of pipeline) {
                  if (check.failsFor.includes(order.id)) {
                    failed.push(check.name);
                    if (mode === "fail-fast") break;
                  } else {
                    passed.push(check.name);
                  }
                }
                return { id: order.id, ok: failed.length === 0, passed, failed };
              });
            }
      - id: arch-layers
        title: "Слои, чистая и гексагональная архитектура, порты и адаптеры"
        content: lessons/arch/arch-layers.md
        quiz:
          question: "Сценарий «создать обращение» нужно вызывать и по HTTP, и из воркера очереди, и из cron-задачи. В текущем коде логика живёт в Express-обработчике. Что даёт переход к «домен объявляет порты, инфраструктура — адаптеры»?"
          options:
            - id: ports
              text: "Сценарий становится доменной функцией с портами, а HTTP, воркер и cron — три входных адаптера к ней"
              correct: true
            - id: copy
              text: "Логику копируют в воркер и cron с общими утилитами — так каждый вход независим и надёжнее"
              explanation: "Три копии бизнес-правила — три места для расхождения: это ровно та болезнь, которую слои лечат. Независимость входов достигается адаптерами вокруг одного сценария, а не размножением сценария."
            - id: http-internal
              text: "Воркер и cron должны вызывать существующий HTTP-эндпоинт сервиса — код один, дублирования нет"
              explanation: "Вызов самого себя по сети ради переиспользования кода добавляет сетевые отказы, таймауты и сериализацию там, где мог быть вызов функции. Общая точка — доменный сценарий, транспорт — деталь адаптера."
            - id: orm-layer
              text: "Достаточно вынести SQL в репозиторий: слой данных и есть гексагональная архитектура"
              explanation: "Репозиторий — один порт из нескольких. Пока сценарий живёт в Express-обработчике, он привязан к HTTP-транспорту, и воркер его не вызовет. Суть — направление зависимостей: домен не знает ни о fastify, ни о pg."
      - id: arch-ddd
        title: "DDD без фанатизма: агрегаты, инварианты, репозитории, доменные события"
        content: lessons/arch/arch-ddd.md
        quiz:
          question: "Архитектор предлагает агрегат «Клиент», включающий все его счета, карты и обращения: «так всё будет согласованно». Что с этим не так?"
          options:
            - id: too-big
              text: "Агрегат — граница транзакции и минимальный кластер немедленной согласованности; здесь он слишком велик"
              correct: true
            - id: good
              text: "Всё так: чем больше агрегат, тем больше инвариантов он может защитить одной транзакцией"
              explanation: "Защищает — и одновременно сериализует: два оператора, работающие с разными обращениями одного клиента, будут толкаться на одной версии агрегата. Между обращениями нет инвариантов немедленной согласованности — им незачем жить в одной транзакции."
            - id: no-aggregates
              text: "Проблема в самих агрегатах: проще открытые модели и проверки в сервисах"
              explanation: "Публичные сеттеры с проверками «по договорённости» — это правило, которое можно обойти, что и приводит к «закрыто без резолюции». Вопрос не в отказе от агрегатов, а в их правильном размере."
            - id: fk-refs
              text: "Не так только хранение: если счета и обращения ссылаются на клиента внешними ключами, агрегат уже правильный"
              explanation: "Внешние ключи — про целостность ссылок в базе, а агрегат — про границу изменения и транзакции в домене. Ссылаться агрегаты должны по id, оставаясь отдельными единицами согласованности."
      - id: arch-practice-aggregate
        title: "Практика: агрегат «Обращение» с инвариантами"
        content: lessons/arch/arch-practice-aggregate.md
        practice:
          type: code
          language: typescript
          entry: runCase
          prompt: "Реализуйте агрегат обращения: runCase(commands) применяет команды create/assign/escalate/resolve/close с инвариантами и переходами из урока; ошибки не меняют состояние и не прерывают поток."
          starter: |
            type Command =
              | { cmd: "create" }
              | { cmd: "assign"; operatorId: number }
              | { cmd: "escalate" }
              | { cmd: "resolve"; resolution: string }
              | { cmd: "close" };

            type Result = {
              state: {
                status: string;
                assigneeId: number | null;
                priority: number;
                resolution: string | null;
              };
              events: string[];
              errors: string[];
            };

            export function runCase(commands: Command[]): Result {
              // ...
              return {
                state: { status: "open", assigneeId: null, priority: 1, resolution: null },
                events: [],
                errors: [],
              };
            }
          cases:
            - args:
                - - { cmd: "create" }
                  - { cmd: "resolve", resolution: "починили" }
                  - { cmd: "assign", operatorId: 3 }
                  - { cmd: "resolve", resolution: "починили" }
                  - { cmd: "close" }
              expected:
                state: { status: "closed", assigneeId: 3, priority: 1, resolution: "починили" }
                events: ["created", "assigned:3", "resolved", "closed"]
                errors: ["resolve:invalid_transition"]
            - args:
                - - { cmd: "create" }
                  - { cmd: "assign", operatorId: 1 }
                  - { cmd: "assign", operatorId: 2 }
                  - { cmd: "escalate" }
                  - { cmd: "escalate" }
                  - { cmd: "escalate" }
              expected:
                state: { status: "in_progress", assigneeId: 2, priority: 3, resolution: null }
                events: ["created", "assigned:1", "assigned:2", "escalated:2", "escalated:3"]
                errors: ["escalate:priority_max"]
            - args:
                - - { cmd: "create" }
                  - { cmd: "assign", operatorId: 5 }
                  - { cmd: "resolve", resolution: "   " }
                  - { cmd: "close" }
              expected:
                state: { status: "in_progress", assigneeId: 5, priority: 1, resolution: null }
                events: ["created", "assigned:5"]
                errors: ["resolve:resolution_required", "close:invalid_transition"]
            - args:
                - - { cmd: "create" }
                  - { cmd: "assign", operatorId: 5 }
                  - { cmd: "resolve", resolution: "done" }
                  - { cmd: "close" }
                  - { cmd: "close" }
                  - { cmd: "escalate" }
                  - { cmd: "assign", operatorId: 7 }
              expected:
                state: { status: "closed", assigneeId: 5, priority: 1, resolution: "done" }
                events: ["created", "assigned:5", "resolved", "closed"]
                errors: ["close:already_closed", "escalate:already_closed", "assign:already_closed"]
            - args:
                - - { cmd: "create" }
                  - { cmd: "escalate" }
                  - { cmd: "resolve", resolution: "сам починился" }
              expected:
                state: { status: "open", assigneeId: null, priority: 2, resolution: null }
                events: ["created", "escalated:2"]
                errors: ["resolve:invalid_transition"]
          solution: |
            type Command =
              | { cmd: "create" }
              | { cmd: "assign"; operatorId: number }
              | { cmd: "escalate" }
              | { cmd: "resolve"; resolution: string }
              | { cmd: "close" };

            type Result = {
              state: {
                status: string;
                assigneeId: number | null;
                priority: number;
                resolution: string | null;
              };
              events: string[];
              errors: string[];
            };

            export function runCase(commands: Command[]): Result {
              let status = "open";
              let assigneeId: number | null = null;
              let priority = 1;
              let resolution: string | null = null;
              const events: string[] = [];
              const errors: string[] = [];

              for (const command of commands) {
                if (command.cmd === "create") {
                  events.push("created");
                  continue;
                }
                if (status === "closed") {
                  errors.push(`${command.cmd}:already_closed`);
                  continue;
                }
                switch (command.cmd) {
                  case "assign":
                    if (status !== "open" && status !== "in_progress") {
                      errors.push("assign:invalid_transition");
                      break;
                    }
                    assigneeId = command.operatorId;
                    if (status === "open") status = "in_progress";
                    events.push(`assigned:${command.operatorId}`);
                    break;
                  case "escalate":
                    if (priority >= 3) {
                      errors.push("escalate:priority_max");
                      break;
                    }
                    priority++;
                    events.push(`escalated:${priority}`);
                    break;
                  case "resolve":
                    if (status !== "in_progress") {
                      errors.push("resolve:invalid_transition");
                      break;
                    }
                    if (!command.resolution.trim()) {
                      errors.push("resolve:resolution_required");
                      break;
                    }
                    if (assigneeId === null) {
                      errors.push("resolve:not_assigned");
                      break;
                    }
                    status = "resolved";
                    resolution = command.resolution;
                    events.push("resolved");
                    break;
                  case "close":
                    if (status !== "resolved") {
                      errors.push("close:invalid_transition");
                      break;
                    }
                    status = "closed";
                    events.push("closed");
                    break;
                }
              }
              return { state: { status, assigneeId, priority, resolution }, events, errors };
            }
      - id: arch-monolith-microservices
        title: "Монолит, модульный монолит, микросервисы: границы и цена"
        content: lessons/arch/arch-monolith-microservices.md
        quiz:
          question: "Платформа нарезана на восемь сервисов, но все ходят в одну базу, типовая фича требует правок в трёх сервисах, а релизы согласуются в общем чате. Как это называется и что не так?"
          options:
            - id: dist-monolith
              text: "Распределённый монолит: цены микросервисов платятся, а независимость релизов не получена"
              correct: true
            - id: normal
              text: "Это штатный этап зрелости микросервисов: общая база упрощает согласованность, а правки в трёх сервисах — цена продуманной декомпозиции"
              explanation: "Общая база связывает сервисы через схему, а фича через три сервиса и согласованные релизы — прямой признак неправильных границ. Штатной такая картина не бывает — это антипаттерн с именем."
            - id: need-mesh
              text: "Не хватает service mesh: он развяжет сервисы, и релизы станут независимыми"
              explanation: "Mesh управляет синхронным трафиком — таймауты, mTLS, метрики. Связанность здесь не в транспорте, а в общей схеме данных и границах, порезанных не по бизнес-способностям; никакая инфраструктура это не чинит."
            - id: merge-back
              text: "Единственный выход — слить всё обратно в монолит и признать эксперимент неудачным"
              explanation: "Иногда слияние — честный ход, но это не единственный выход: чаще выправляют границы и владение данными — сервис за сервисом отдают каждому его таблицы и режут по bounded context-ам. Диагноз важнее приговора."
      - id: arch-communication
        title: "Связь сервисов: синхронно и асинхронно, API gateway, service discovery, service mesh"
        content: lessons/arch/arch-communication.md
        quiz:
          question: "Экран обращения синхронно собирается из пяти сервисов, у каждого доступность 99,9 % в месяц. Продукт требует 99,9 % на весь экран. Что говорит арифметика и что с этим делать?"
          options:
            - id: multiply
              text: "Доступности перемножаются — цепочка даёт около 99,5 %; лечат короткая цепочка и деградация блоков"
              correct: true
            - id: min
              text: "Доступность экрана равна доступности худшего из пяти сервисов — 99,9 %, требование выполняется"
              explanation: "Отказы разных сервисов независимы и складываются: экран падает, когда падает любой из пяти. Вероятность успеха — произведение 0,999^5 ≈ 0,995, то есть впятеро больше простоя, чем у одного сервиса."
            - id: retry-fix
              text: "Добавить агрессивные ретраи на каждый вызов — они компенсируют отказы, и произведение снова станет 99,9 %"
              explanation: "Ретраи спасают от коротких сбоев, но при деградации сервиса они умножают нагрузку и удлиняют ответ; арифметику цепочки они не отменяют. Системное лечение — короче цепочка и деградация блоков."
            - id: cache-all
              text: "Закэшировать ответы всех пяти сервисов — тогда их доступность перестанет влиять на экран"
              explanation: "Кэш помогает некритичным справочникам, но карточка обращения и клиента должны быть свежими — их из кэша не отдашь. Кэш — один из инструментов деградации, а не отмена зависимости."
      - id: arch-consistency
        title: "CAP, PACELC, eventual consistency и распределённые транзакции"
        content: lessons/arch/arch-consistency.md
        quiz:
          question: "На собеседовании просят: «Сформулируйте CAP-теорему точно». Какая формулировка верна?"
          options:
            - id: correct
              text: "При разрыве сети выбор между доступностью и консистентностью; сам разрыв — не опция, сеть рвётся сама"
              correct: true
            - id: pick-two
              text: "Из консистентности, доступности и устойчивости к разрывам любая система выбирает две буквы на этапе проектирования"
              explanation: "Популярная и неточная версия: «отказаться от P» нельзя — разрывы случаются независимо от проекта. Выбор C против A существует, и только на время разрыва."
            - id: databases
              text: "Каждая СУБД принадлежит классу CA, CP или AP, и выбор базы — это выбор класса"
              explanation: "Классификация баз по буквам — маркетинговое упрощение: поведение зависит от настроек (кворумы, режимы репликации), и одна система настраивается в разные стороны. CAP описывает поведение при разрыве, а не сорт продукта."
            - id: latency
              text: "CAP утверждает, что консистентность всегда оплачивается латентностью, даже когда сеть цела"
              explanation: "Компромисс «латентность против строгости» в здоровой сети — это уже PACELC, полезное расширение. Сама CAP-теорема — только про поведение при разрыве."
      - id: arch-saga
        title: "Сага: оркестрация, хореография, компенсации"
        content: lessons/arch/arch-saga.md
        quiz:
          question: "В саге заказа «резерв → оплата → доставка» шаг доставки отказал, и оплату нужно компенсировать возвратом. Чем компенсация принципиально отличается от rollback-а транзакции?"
          options:
            - id: new-action
              text: "Rollback отменяет незафиксированное; компенсация — новое бизнес-действие поверх зафиксированного"
              correct: true
            - id: same
              text: "Ничем, кроме масштаба: компенсация — это распределённый rollback, который брокер выполняет за нас"
              explanation: "Брокер ничего не откатывает — он доставляет команды. Оплата зафиксирована у платёжного сервиса и, возможно, у внешнего провайдера; отменить её «как не было» нельзя — можно только совершить обратную операцию со всеми её свойствами."
            - id: instant
              text: "Компенсация быстрее: rollback ждёт конца транзакции, а компенсация выполняется немедленно"
              explanation: "Скорость тут ни при чём, и обычно наоборот: возврат платежа — операция со своим временем и внешним провайдером. Различие в природе: новое действие против отмены незафиксированного."
            - id: no-trace
              text: "Rollback оставляет след в журнале, а компенсация возвращает систему в состояние, неотличимое от исходного"
              explanation: "Ровно наоборот: компенсация оставляет следы по определению — запись о возврате, письмо об отмене, история платежа. Неотличимость от исходного состояния — свойство rollback-а."
      - id: arch-practice-saga
        title: "Практика: оркестратор саги с компенсациями"
        content: lessons/arch/arch-practice-saga.md
        practice:
          type: code
          language: typescript
          entry: runSaga
          prompt: "Реализуйте runSaga(steps): шаги по порядку, при отказе — компенсации выполненных в обратном порядке; skip-compensation для некомпенсируемых, один retry упавшей компенсации. Форматы журнала — в уроке."
          starter: |
            type Step = {
              name: string;
              action: "ok" | "fail" | "timeout";
              compensation?: "ok" | "fail";
              compensable?: boolean;
            };

            type SagaResult = {
              status: "completed" | "compensated";
              log: string[];
              completedSteps: string[];
            };

            export function runSaga(steps: Step[]): SagaResult {
              // ...
              return { status: "completed", log: [], completedSteps: [] };
            }
          cases:
            - args:
                - - { name: "reserve", action: "ok" }
                  - { name: "charge", action: "ok", compensation: "fail" }
                  - { name: "delivery", action: "timeout" }
              expected:
                status: "compensated"
                log:
                  - "do:reserve:ok"
                  - "do:charge:ok"
                  - "do:delivery:timeout"
                  - "undo:charge:fail"
                  - "undo:charge:retry"
                  - "undo:charge:ok"
                  - "undo:reserve:ok"
                completedSteps: ["reserve", "charge"]
            - args:
                - - { name: "reserve", action: "ok" }
                  - { name: "charge", action: "ok" }
                  - { name: "delivery", action: "ok" }
              expected:
                status: "completed"
                log: ["do:reserve:ok", "do:charge:ok", "do:delivery:ok"]
                completedSteps: ["reserve", "charge", "delivery"]
            - args:
                - - { name: "reserve", action: "fail" }
              expected:
                status: "compensated"
                log: ["do:reserve:fail"]
                completedSteps: []
            - args:
                - - { name: "notify", action: "ok", compensable: false }
                  - { name: "reserve", action: "ok" }
                  - { name: "charge", action: "fail" }
              expected:
                status: "compensated"
                log:
                  - "do:notify:ok"
                  - "do:reserve:ok"
                  - "do:charge:fail"
                  - "undo:reserve:ok"
                  - "skip-compensation:notify"
                completedSteps: ["notify", "reserve"]
            - args:
                - []
              expected:
                status: "completed"
                log: []
                completedSteps: []
          solution: |
            type Step = {
              name: string;
              action: "ok" | "fail" | "timeout";
              compensation?: "ok" | "fail";
              compensable?: boolean;
            };

            type SagaResult = {
              status: "completed" | "compensated";
              log: string[];
              completedSteps: string[];
            };

            export function runSaga(steps: Step[]): SagaResult {
              const log: string[] = [];
              const completed: Step[] = [];
              let failed = false;

              for (const step of steps) {
                if (step.action === "ok") {
                  log.push(`do:${step.name}:ok`);
                  completed.push(step);
                } else {
                  log.push(`do:${step.name}:${step.action}`);
                  failed = true;
                  break;
                }
              }

              if (!failed) {
                return {
                  status: "completed",
                  log,
                  completedSteps: completed.map((s) => s.name),
                };
              }

              for (const step of [...completed].reverse()) {
                if (step.compensable === false) {
                  log.push(`skip-compensation:${step.name}`);
                  continue;
                }
                if ((step.compensation ?? "ok") === "ok") {
                  log.push(`undo:${step.name}:ok`);
                } else {
                  log.push(`undo:${step.name}:fail`);
                  log.push(`undo:${step.name}:retry`);
                  log.push(`undo:${step.name}:ok`);
                }
              }
              return {
                status: "compensated",
                log,
                completedSteps: completed.map((s) => s.name),
              };
            }
      - id: arch-cqrs-es
        title: "CQRS и Event Sourcing: когда нужно, когда вредно"
        content: lessons/arch/arch-cqrs-es.md
        quiz:
          question: "Аудит «Пульта» складывает события из Kafka в свою базу, но источник истины об обращениях — таблицы Postgres сервиса cases. Это event sourcing?"
          options:
            - id: not-es
              text: "Нет: это event-driven интеграция — события поверх обычного состояния, источник истины — таблицы"
              correct: true
            - id: yes-es
              text: "Да: раз события хранятся и по ним можно восстановить историю, это и есть event sourcing"
              explanation: "Хранение событий — необходимое, но не определяющее свойство. В ES состояние агрегата читается replay-ем событий, и другого источника нет; здесь же истина живёт в таблицах cases, а события — производная интеграция."
            - id: cqrs-es
              text: "Это CQRS, а CQRS и event sourcing — одно и то же"
              explanation: "CQRS — разделение моделей чтения и записи, ES — события как источник истины. Они дружат (ES почти требует CQRS), но независимы: CQRS прекрасно живёт поверх обычных таблиц."
            - id: half-es
              text: "Это event sourcing наполовину: чтобы стать полным, достаточно добавить снапшоты"
              explanation: "Снапшоты — оптимизация replay-я внутри ES, а не признак его наличия. Пока текущее состояние читается из таблиц, а не сворачивается из журнала, никакая доля ES здесь не присутствует."
      - id: arch-practice-projection
        title: "Практика: проекция из потока событий"
        content: lessons/arch/arch-practice-projection.md
        practice:
          type: code
          language: typescript
          entry: project
          prompt: "Реализуйте project(events): идемпотентный проектор витрины обращений — дубли по seq молча, неизвестные типы и сироты с предупреждениями, правила применения — в уроке."
          starter: |
            type Ev = { seq: number; type: string; caseId: number; [k: string]: unknown };

            type View = {
              cases: Record<number, {
                topic: string; status: string; assigneeId: number | null;
                priority: number; events: number;
              }>;
              applied: number;
              warnings: string[];
            };

            export function project(events: Ev[]): View {
              // ...
              return { cases: {}, applied: 0, warnings: [] };
            }
          cases:
            - args:
                - - { seq: 1, type: "created", caseId: 7, topic: "card-blocked" }
                  - { seq: 2, type: "assigned", caseId: 7, operatorId: 3 }
                  - { seq: 2, type: "assigned", caseId: 7, operatorId: 3 }
                  - { seq: 3, type: "starred", caseId: 7 }
                  - { seq: 4, type: "resolved", caseId: 9 }
              expected:
                cases:
                  "7": { topic: "card-blocked", status: "in_progress", assigneeId: 3, priority: 1, events: 2 }
                applied: 2
                warnings: ["unknown:starred:seq3", "orphan:seq4"]
            - args:
                - - { seq: 1, type: "created", caseId: 1, topic: "limits" }
                  - { seq: 2, type: "escalated", caseId: 1 }
                  - { seq: 3, type: "escalated", caseId: 1 }
                  - { seq: 4, type: "assigned", caseId: 1, operatorId: 8 }
                  - { seq: 5, type: "resolved", caseId: 1 }
                  - { seq: 6, type: "closed", caseId: 1 }
              expected:
                cases:
                  "1": { topic: "limits", status: "closed", assigneeId: 8, priority: 3, events: 6 }
                applied: 6
                warnings: []
            - args:
                - - { seq: 1, type: "created", caseId: 1, topic: "a" }
                  - { seq: 2, type: "created", caseId: 2, topic: "b" }
                  - { seq: 3, type: "assigned", caseId: 2, operatorId: 4 }
                  - { seq: 4, type: "assigned", caseId: 2, operatorId: 5 }
              expected:
                cases:
                  "1": { topic: "a", status: "open", assigneeId: null, priority: 1, events: 1 }
                  "2": { topic: "b", status: "in_progress", assigneeId: 5, priority: 1, events: 3 }
                applied: 4
                warnings: []
            - args:
                - []
              expected:
                cases: {}
                applied: 0
                warnings: []
          solution: |
            type Ev = { seq: number; type: string; caseId: number; [k: string]: unknown };

            type CaseView = {
              topic: string; status: string; assigneeId: number | null;
              priority: number; events: number;
            };
            type View = {
              cases: Record<number, CaseView>;
              applied: number;
              warnings: string[];
            };

            const KNOWN = new Set(["created", "assigned", "escalated", "resolved", "closed"]);

            export function project(events: Ev[]): View {
              const cases: Record<number, CaseView> = {};
              const seen = new Set<number>();
              const warnings: string[] = [];
              let applied = 0;

              for (const ev of events) {
                if (seen.has(ev.seq)) continue;
                seen.add(ev.seq);

                if (!KNOWN.has(ev.type)) {
                  warnings.push(`unknown:${ev.type}:seq${ev.seq}`);
                  continue;
                }
                if (ev.type === "created") {
                  cases[ev.caseId] = {
                    topic: String(ev.topic),
                    status: "open",
                    assigneeId: null,
                    priority: 1,
                    events: 1,
                  };
                  applied++;
                  continue;
                }
                const view = cases[ev.caseId];
                if (view === undefined) {
                  warnings.push(`orphan:seq${ev.seq}`);
                  continue;
                }
                switch (ev.type) {
                  case "assigned":
                    view.assigneeId = Number(ev.operatorId);
                    if (view.status === "open") view.status = "in_progress";
                    break;
                  case "escalated":
                    view.priority++;
                    break;
                  case "resolved":
                    view.status = "resolved";
                    break;
                  case "closed":
                    view.status = "closed";
                    break;
                }
                view.events++;
                applied++;
              }
              return { cases, applied, warnings };
            }
      - id: arch-migration-patterns
        title: "Strangler fig, anti-corruption layer, feature toggles: переезд без остановки"
        content: lessons/arch/arch-migration-patterns.md
        quiz:
          question: "При переезде с легаси новый сервис обращений вынужден читать статусы из старой системы с её кодами вида «STAT_07B». Команда начала использовать эти коды прямо в новой доменной модели «чтобы не конвертировать дважды». Что здесь не так и какой паттерн нужен?"
          options:
            - id: acl
              text: "Причуды легаси впитываются в новую модель навсегда; нужен anti-corruption layer на границе"
              correct: true
            - id: fine
              text: "Разумная экономия: конвертация в двух местах — дублирование, а коды всё равно исчезнут вместе с легаси"
              explanation: "Не исчезнут: коды, попавшие в доменную модель, расползутся по коду, базе и контрактам нового сервиса и переживут легаси на годы. ACL держит конвертацию в одном месте — и сносится одним движением."
            - id: toggle
              text: "Нужен feature toggle: включать новые статусы флагом, а старые коды оставить как fallback"
              explanation: "Флаги управляют включением маршрутов и функций, но не защищают модель от чужой семантики: с флагом или без, STAT_07B в домене — это протёкшая модель легаси. Границу держит слой трансляции."
            - id: strangler-wrong
              text: "Это нарушение strangler fig: читать из легаси нельзя, нужно сначала перенести все данные"
              explanation: "Strangler как раз предполагает долгую жизнь бок о бок и чтение из легаси на время переезда. Вопрос не «читать ли», а «на чьём языке»: на границе переводить в чистую модель — это и есть ACL."
      - id: scr-migration
        title: "Пункт 4. Два перевода на новую платформу без остановки"
        content: lessons/arch/scr-migration.md
        quiz:
          question: "Через неделю после перевода пилотного раздела на новую платформу в ней нашлась серьёзная ошибка. Что даёт схема strangler fig в этот момент?"
          options:
            - id: rollback
              text: "Переключить раздел обратно на старую систему изменением конфигурации: она жива и принимает трафик через тот же фасад"
              correct: true
            - id: hotfix-only
              text: "Ничего особенного: ошибку чинят хотфиксом в новой платформе, как чинили бы при любом способе перевода"
              explanation: "Хотфикс нужен в любом случае — разница в том, что происходит с пользователями, пока он пишется. При переводе разом деваться некуда, а фасад со старой системой позволяет убрать проблему с глаз за минуту."
            - id: restore-backup
              text: "Восстановить систему из резервной копии, сделанной перед переключением пилотного раздела"
              explanation: "Резервная копия недельной давности похоронит неделю работы пользователей. Смысл поэтапного перевода в том и состоит, что откат — это переключение трафика, а не восстановление данных."
            - id: pause-all
              text: "Остановить обе системы на время разбирательства, чтобы данные не разъехались между старой и новой"
              explanation: "Остановка обеих систем — ровно тот простой бизнеса, ради недопущения которого выбран поэтапный перевод. Согласованность данных обеспечивается двойной записью или синхронизацией, а не остановкой."

  - id: highload
    title: "Модуль 10. Высокая нагрузка и отказоустойчивость"
    lessons:
      - id: hl-scaling
        title: "Масштабирование: stateless, балансировка, sticky sessions, health checks"
        content: lessons/highload/hl-scaling.md
        quiz:
          question: "Кэш-ключи распределяются по 4 узлам как hash(key) % 4. Добавили пятый узел. Что произойдёт с попаданиями в кэш и как этого избежать?"
          options:
            - id: consistent
              text: "Почти все ключи сменят узел — кэш разом холодный; consistent hashing с виртуальными узлами переместил бы лишь около пятой части ключей"
              correct: true
            - id: fifth
              text: "Переедет ровно пятая часть ключей — новому узлу отдадут его долю, остальные не тронутся"
              explanation: "При смене модуля с 4 на 5 результат hash % N меняется почти у всех ключей — узел сохраняют лишь те, у кого остаток случайно совпал (около 20 %). Локальность переездов — как раз то свойство, которого у деления с остатком нет."
            - id: warm
              text: "Ничего страшного: узлы обменяются содержимым кэшей между собой при ребалансировке"
              explanation: "Кэш-узлы не переносят данные друг другу — переехавший ключ просто даёт промах и грузится из источника заново. Волна промахов от массового переезда и есть проблема."
            - id: sticky-fix
              text: "Достаточно включить sticky sessions: клиенты продолжат ходить на старые узлы"
              explanation: "Sticky привязывает клиента к инстансу приложения, а не ключ кэша к кэш-узлу: выбор узла делает код по хешу ключа. Липкость здесь ни на что не влияет."
      - id: hl-capacity
        title: "Оценка нагрузки: RPS, задержки, перцентили, закон Литтла"
        content: lessons/highload/hl-capacity.md
        quiz:
          question: "SLA сервиса сформулирован «средняя латентность < 200 мс» и выполняется. Экран оператора собирается из пяти последовательных вызовов этого сервиса, и операторы жалуются на регулярные подвисания. Как такое возможно?"
          options:
            - id: tail
              text: "Средняя маскирует хвост: каждый двадцатый экран цепляет p99-медленный вызов (1 − 0,99⁵)"
              correct: true
            - id: impossible
              text: "Невозможно: раз среднее 200 мс, пять вызовов дают около секунды, и это стабильно"
              explanation: "Среднее ничего не говорит о разбросе: 90 % запросов по 50 мс и 10 % по полторы секунды дают то же среднее. Хвост распределения бьёт по цепочке из пяти вызовов с вероятностью, которую среднее не показывает."
            - id: parallel
              text: "Проблема только в последовательности вызовов: распараллелить — и жалобы исчезнут"
              explanation: "Параллельность сокращает сумму, но экран всё равно ждёт самый медленный из пяти — вероятность зацепить хвост даже растёт с числом параллельных вызовов. Лечится хвост, а не только форма цепочки."
            - id: network
              text: "Виновата сеть между экраном и сервисом — серверные метрики её не видят"
              explanation: "Возможно, но необязательно: жалобы полностью объяснимы самим распределением латентности при честном выполнении «среднего» SLA. Сначала смотрят перцентили — и меряют на клиентской стороне вызова, что заодно покроет и сеть."
      - id: hl-practice-capacity
        title: "Практика: сколько инстансов нужно «Пульту»"
        content: lessons/highload/hl-practice-capacity.md
        practice:
          type: answer
          prompt: "Посчитайте по данным урока: конкурентность BFF, число инстансов с N+1, занятые соединения cases и запас пула. Ответы — числами."
          fields:
            - id: concurrency
              label: "1. Одновременных запросов у BFF в пик"
              kind: number
              expected: 100
            - id: instances
              label: "2. Инстансов BFF с учётом N+1"
              kind: number
              expected: 5
            - id: connections
              label: "3. Занятых соединений с Postgres у cases (в среднем, целое)"
              kind: number
              expected: 24
            - id: pool-headroom
              label: "4. Запас пула cases (отношение, один знак после запятой)"
              kind: number
              expected: 1.5
              tolerance: 0.05
      - id: hl-timeouts-retries
        title: "Таймауты, ретраи, jitter, retry storm и бюджет ретраев"
        content: lessons/highload/hl-timeouts-retries.md
        quiz:
          question: "Сервис справочников деградировал до 50 % отказов. Клиент ретраит BFF трижды, BFF ретраит справочники трижды, у справочников свой ретрай в базу тоже трижды. Что происходит с нагрузкой на дно цепочки и что это чинит?"
          options:
            - id: storm
              text: "Ретраи перемножаются по этажам — до 27-кратной нагрузки: retry storm; чинят бюджет ретраев и повторы только на одном уровне"
              correct: true
            - id: linear
              text: "Нагрузка вырастает втрое — по числу попыток верхнего уровня, это терпимо"
              explanation: "Попытки перемножаются, а не складываются: каждая из трёх попыток BFF порождает до трёх походов в справочники, каждый из них — до трёх запросов в базу. Итог — до 27 крат, и деградация превращается в лавину."
            - id: helps
              text: "Всё правильно настроено: при 50 % отказов ретраи как раз и доведут запрос до успеха"
              explanation: "При единичных сбоях — да; при массовой деградации ретраи умножают трафик на и так больной сервис, углубляя отказы. Ровно для этого различия существует бюджет ретраев: помогать при икоте, выключаться при пожаре."
            - id: more-timeouts
              text: "Проблему решают более длинные таймауты: запросы будут успевать, и ретраи не понадобятся"
              explanation: "Длинные таймауты умножают конкурентность по закону Литтла — обработчики и пулы копятся на ожидании больного сервиса, и падает уже вызывающий. Ожидать дольше — не лечение деградации."
      - id: hl-practice-retry
        title: "Практика: retry с экспоненциальным backoff и дедлайном"
        content: lessons/highload/hl-practice-retry.md
        practice:
          type: code
          language: typescript
          entry: runRetry
          prompt: "Реализуйте runRetry(plan): повторы только транзиентного, полный jitter delay = floor(random × base × 2^(n−1)), проверка дедлайна до ожидания. Форматы — в уроке."
          starter: |
            type Attempt = "ok" | "transient" | "permanent";
            type Plan = {
              attempts: Attempt[];
              baseMs: number;
              maxRetries: number;
              deadlineMs: number;
              randoms: number[];
            };
            type RetryResult = {
              outcome: "ok" | "permanent" | "exhausted" | "deadline";
              attemptsMade: number;
              timeline: number[];
              totalMs: number;
            };

            export function runRetry(plan: Plan): RetryResult {
              // ...
              return { outcome: "ok", attemptsMade: 0, timeline: [], totalMs: 0 };
            }
          cases:
            - args:
                - attempts: ["transient", "transient", "ok"]
                  baseMs: 100
                  maxRetries: 3
                  deadlineMs: 10000
                  randoms: [0.5, 1.0]
              expected:
                outcome: "ok"
                attemptsMade: 3
                timeline: [0, 50, 250]
                totalMs: 250
            - args:
                - attempts: ["transient", "permanent"]
                  baseMs: 100
                  maxRetries: 5
                  deadlineMs: 10000
                  randoms: [1.0]
              expected:
                outcome: "permanent"
                attemptsMade: 2
                timeline: [0, 100]
                totalMs: 100
            - args:
                - attempts: ["transient"]
                  baseMs: 100
                  maxRetries: 2
                  deadlineMs: 10000
                  randoms: [1.0, 1.0]
              expected:
                outcome: "exhausted"
                attemptsMade: 3
                timeline: [0, 100, 300]
                totalMs: 300
            - args:
                - attempts: ["transient", "transient"]
                  baseMs: 1000
                  maxRetries: 5
                  deadlineMs: 1500
                  randoms: [1.0, 1.0]
              expected:
                outcome: "deadline"
                attemptsMade: 2
                timeline: [0, 1000]
                totalMs: 1000
            - args:
                - attempts: ["transient"]
                  baseMs: 100
                  maxRetries: 0
                  deadlineMs: 10000
                  randoms: []
              expected:
                outcome: "exhausted"
                attemptsMade: 1
                timeline: [0]
                totalMs: 0
            - args:
                - attempts: ["transient", "ok"]
                  baseMs: 100
                  maxRetries: 1
                  deadlineMs: 10000
                  randoms: [0]
              expected:
                outcome: "ok"
                attemptsMade: 2
                timeline: [0, 0]
                totalMs: 0
          solution: |
            type Attempt = "ok" | "transient" | "permanent";
            type Plan = {
              attempts: Attempt[];
              baseMs: number;
              maxRetries: number;
              deadlineMs: number;
              randoms: number[];
            };
            type RetryResult = {
              outcome: "ok" | "permanent" | "exhausted" | "deadline";
              attemptsMade: number;
              timeline: number[];
              totalMs: number;
            };

            export function runRetry(plan: Plan): RetryResult {
              let now = 0;
              const timeline: number[] = [];
              let attemptIndex = 0;

              for (let retry = 0; ; retry++) {
                timeline.push(now);
                const result =
                  plan.attempts[Math.min(attemptIndex, plan.attempts.length - 1)];
                attemptIndex++;

                if (result === "ok") {
                  return { outcome: "ok", attemptsMade: timeline.length, timeline, totalMs: now };
                }
                if (result === "permanent") {
                  return { outcome: "permanent", attemptsMade: timeline.length, timeline, totalMs: now };
                }
                if (retry >= plan.maxRetries) {
                  return { outcome: "exhausted", attemptsMade: timeline.length, timeline, totalMs: now };
                }
                const random = plan.randoms[retry] ?? 0;
                const delay = Math.floor(random * plan.baseMs * 2 ** retry);
                if (now + delay > plan.deadlineMs) {
                  return { outcome: "deadline", attemptsMade: timeline.length, timeline, totalMs: now };
                }
                now += delay;
              }
            }
      - id: hl-circuit-breaker
        title: "Circuit breaker, bulkhead, load shedding и деградация"
        content: lessons/highload/hl-circuit-breaker.md
        quiz:
          question: "BFF ходит в критичный cases и в медленные справочники через один общий пул из 50 соединений. Справочники деградировали до 10 секунд на ответ. Что произойдёт с экранами обращений и какой приём это предотвращает?"
          options:
            - id: bulkhead
              text: "Ожидания справочников займут весь пул, и обращения тоже встанут; bulkhead — отдельные пулы и лимиты конкурентности на каждый ресурс"
              correct: true
            - id: fine
              text: "Ничего: 50 соединений много, а Node асинхронный — медленные ответы не мешают быстрым"
              explanation: "По закону Литтла медленный ресурс при том же RPS занимает в десятки раз больше соединений: 10-секундные ответы съедят пул целиком, и быстрым запросам к cases не достанется ничего. Асинхронность Node не увеличивает размер пула."
            - id: breaker-only
              text: "Достаточно circuit breaker-а на справочники: он разомкнётся и пул освободится"
              explanation: "Breaker поможет — но разомкнётся он только после накопления отказов, а до того пул уже съеден; и деградация без полного отказа (медленно, но отвечает) может вовсе не набрать порог. Изоляция пулов защищает сразу и безусловно; breaker — дополнение."
            - id: bigger-pool
              text: "Увеличить пул до 500 — запаса хватит на любую деградацию"
              explanation: "Большой пул лишь позволит накопить больше висящих ожиданий (память, сокеты, нагрузка на больной сервис) и отодвинет коллапс на минуты. Изоляция — разделение пулов, а не общий размер."
      - id: hl-practice-breaker
        title: "Практика: circuit breaker как конечный автомат"
        content: lessons/highload/hl-practice-breaker.md
        practice:
          type: code
          language: typescript
          entry: runBreaker
          prompt: "Реализуйте runBreaker(config, events): состояния closed/open/half-open, скользящее окно с порогом и минимумом вызовов, таймер open, пробы half-open. Форматы журнала — в уроке."
          starter: |
            type Config = {
              windowSize: number;
              failureThreshold: number;
              minCalls: number;
              openMs: number;
              halfOpenProbes: number;
            };
            type Event = { at: number; result: "success" | "failure" };

            export function runBreaker(
              config: Config,
              events: Event[],
            ): { log: string[]; finalState: string } {
              // ...
              return { log: [], finalState: "closed" };
            }
          cases:
            - args:
                - { windowSize: 4, failureThreshold: 0.6, minCalls: 4, openMs: 1000, halfOpenProbes: 2 }
                - - { at: 0, result: "success" }
                  - { at: 10, result: "failure" }
                  - { at: 20, result: "failure" }
                  - { at: 30, result: "success" }
                  - { at: 40, result: "failure" }
                  - { at: 50, result: "success" }
                  - { at: 1100, result: "success" }
                  - { at: 1200, result: "success" }
                  - { at: 1300, result: "success" }
              expected:
                log:
                  - "exec:success"
                  - "exec:failure"
                  - "exec:failure"
                  - "exec:success"
                  - "exec:failure"
                  - "->open"
                  - "reject"
                  - "->half-open"
                  - "probe:success"
                  - "probe:success"
                  - "->closed"
                  - "exec:success"
                finalState: "closed"
            - args:
                - { windowSize: 3, failureThreshold: 0.5, minCalls: 3, openMs: 100, halfOpenProbes: 1 }
                - - { at: 0, result: "failure" }
                  - { at: 1, result: "failure" }
              expected:
                log: ["exec:failure", "exec:failure"]
                finalState: "closed"
            - args:
                - { windowSize: 2, failureThreshold: 1, minCalls: 2, openMs: 100, halfOpenProbes: 1 }
                - - { at: 0, result: "failure" }
                  - { at: 1, result: "failure" }
                  - { at: 50, result: "success" }
                  - { at: 101, result: "failure" }
                  - { at: 150, result: "success" }
                  - { at: 250, result: "success" }
              expected:
                log:
                  - "exec:failure"
                  - "exec:failure"
                  - "->open"
                  - "reject"
                  - "->half-open"
                  - "probe:failure"
                  - "->open"
                  - "reject"
                  - "->half-open"
                  - "probe:success"
                  - "->closed"
                finalState: "closed"
            - args:
                - { windowSize: 4, failureThreshold: 0.5, minCalls: 2, openMs: 1000, halfOpenProbes: 2 }
                - - { at: 0, result: "success" }
                  - { at: 10, result: "failure" }
                  - { at: 20, result: "failure" }
                  - { at: 1020, result: "success" }
                  - { at: 1030, result: "failure" }
              expected:
                log:
                  - "exec:success"
                  - "exec:failure"
                  - "->open"
                  - "reject"
                  - "->half-open"
                  - "probe:success"
                  - "probe:failure"
                  - "->open"
                finalState: "open"
          solution: |
            type Config = {
              windowSize: number;
              failureThreshold: number;
              minCalls: number;
              openMs: number;
              halfOpenProbes: number;
            };
            type Event = { at: number; result: "success" | "failure" };

            export function runBreaker(
              config: Config,
              events: Event[],
            ): { log: string[]; finalState: string } {
              const log: string[] = [];
              let state: "closed" | "open" | "half-open" = "closed";
              let window: ("success" | "failure")[] = [];
              let openedAt = 0;
              let probesUsed = 0;
              let probeFailures = 0;

              for (const ev of events) {
                if (state === "open") {
                  if (ev.at < openedAt + config.openMs) {
                    log.push("reject");
                    continue;
                  }
                  state = "half-open";
                  probesUsed = 0;
                  probeFailures = 0;
                  log.push("->half-open");
                }

                if (state === "half-open") {
                  if (probesUsed >= config.halfOpenProbes) {
                    log.push("reject");
                    continue;
                  }
                  probesUsed++;
                  log.push(`probe:${ev.result}`);
                  if (ev.result === "failure") {
                    state = "open";
                    openedAt = ev.at;
                    log.push("->open");
                  } else if (probesUsed === config.halfOpenProbes) {
                    state = "closed";
                    window = [];
                    log.push("->closed");
                  }
                  continue;
                }

                // closed
                log.push(`exec:${ev.result}`);
                window.push(ev.result);
                if (window.length > config.windowSize) window.shift();
                const failures = window.filter((r) => r === "failure").length;
                if (
                  window.length >= config.minCalls &&
                  failures / window.length >= config.failureThreshold
                ) {
                  state = "open";
                  openedAt = ev.at;
                  log.push("->open");
                }
              }
              return { log, finalState: state };
            }
      - id: hl-rate-limiting
        title: "Rate limiting и backpressure: token bucket, скользящее окно, ограниченные очереди"
        content: lessons/highload/hl-rate-limiting.md
        quiz:
          question: "Лимит для интеграционных клиентов сформулирован так: «можно отправить до 50 запросов залпом, но в среднем не больше 10 в секунду». Какой алгоритм выражает это напрямую?"
          options:
            - id: bucket
              text: "Token bucket с ёмкостью 50 и скоростью пополнения 10 в секунду: всплеск до ёмкости, средняя скорость — по пополнению"
              correct: true
            - id: fixed
              text: "Fixed window на 10 запросов в секунду — это буквально «10 в секунду»"
              explanation: "Жёсткие 10 на каждое окно запрещают залп из 50, который лимит явно разрешает; а на стыке окон fixed window наоборот пропускает двойной лимит. Семантику «всплеск при средней скорости» выражает ведро токенов."
            - id: leaky
              text: "Leaky bucket: он тоже про ведро, а вытекание задаст среднюю скорость"
              explanation: "Leaky bucket выравнивает поток до строгих 10 в секунду — залп из 50 встанет в очередь и растянется на пять секунд. Он для сглаживания исходящего потока, а не для разрешённых всплесков на входе."
            - id: log
              text: "Sliding window log на 600 запросов за минуту — та же средняя скорость, но точнее"
              explanation: "Средняя сходится, но семантика другая: клиент сможет отправить 600 подряд и молчать минуту — «всплеск» в 12 раз больше оговорённого. Ёмкость всплеска и средняя скорость — два независимых параметра, и это ровно пара из token bucket."
      - id: hl-practice-limiter
        title: "Практика: лимитер со скользящим окном"
        content: lessons/highload/hl-practice-limiter.md
        practice:
          type: code
          language: typescript
          entry: runLimiter
          prompt: "Реализуйте runLimiter(limit, windowMs, requests): sliding window log — считаются только допущенные, retryAfterMs от старейшего допущенного, граница окна исключается. Форматы — в уроке."
          starter: |
            type Request = { at: number; key: string };
            type Decision = {
              at: number;
              key: string;
              allowed: boolean;
              remaining: number;
              retryAfterMs?: number;
            };

            export function runLimiter(
              limit: number,
              windowMs: number,
              requests: Request[],
            ): Decision[] {
              // ...
              return [];
            }
          cases:
            - args:
                - 2
                - 1000
                - - { at: 0, key: "a" }
                  - { at: 100, key: "a" }
                  - { at: 200, key: "a" }
                  - { at: 999, key: "b" }
                  - { at: 1000, key: "a" }
                  - { at: 1100, key: "a" }
              expected:
                - { at: 0, key: "a", allowed: true, remaining: 1 }
                - { at: 100, key: "a", allowed: true, remaining: 0 }
                - { at: 200, key: "a", allowed: false, remaining: 0, retryAfterMs: 800 }
                - { at: 999, key: "b", allowed: true, remaining: 1 }
                - { at: 1000, key: "a", allowed: true, remaining: 0 }
                - { at: 1100, key: "a", allowed: true, remaining: 0 }
            - args:
                - 1
                - 500
                - - { at: 0, key: "x" }
                  - { at: 100, key: "x" }
                  - { at: 200, key: "x" }
                  - { at: 500, key: "x" }
              expected:
                - { at: 0, key: "x", allowed: true, remaining: 0 }
                - { at: 100, key: "x", allowed: false, remaining: 0, retryAfterMs: 400 }
                - { at: 200, key: "x", allowed: false, remaining: 0, retryAfterMs: 300 }
                - { at: 500, key: "x", allowed: true, remaining: 0 }
            - args:
                - 3
                - 1000
                - - { at: 0, key: "a" }
                  - { at: 0, key: "b" }
                  - { at: 1, key: "a" }
              expected:
                - { at: 0, key: "a", allowed: true, remaining: 2 }
                - { at: 0, key: "b", allowed: true, remaining: 2 }
                - { at: 1, key: "a", allowed: true, remaining: 1 }
          solution: |
            type Request = { at: number; key: string };
            type Decision = {
              at: number;
              key: string;
              allowed: boolean;
              remaining: number;
              retryAfterMs?: number;
            };

            export function runLimiter(
              limit: number,
              windowMs: number,
              requests: Request[],
            ): Decision[] {
              const allowedTimes = new Map<string, number[]>();
              const decisions: Decision[] = [];

              for (const req of requests) {
                const times = (allowedTimes.get(req.key) ?? []).filter(
                  (t) => t > req.at - windowMs,
                );
                if (times.length < limit) {
                  times.push(req.at);
                  allowedTimes.set(req.key, times);
                  decisions.push({
                    at: req.at,
                    key: req.key,
                    allowed: true,
                    remaining: limit - times.length,
                  });
                } else {
                  allowedTimes.set(req.key, times);
                  const oldest = Math.min(...times);
                  decisions.push({
                    at: req.at,
                    key: req.key,
                    allowed: false,
                    remaining: 0,
                    retryAfterMs: oldest + windowMs - req.at,
                  });
                }
              }
              return decisions;
            }
      - id: hl-practice-hashing
        title: "Практика: consistent hashing"
        content: lessons/highload/hl-practice-hashing.md
        practice:
          type: code
          language: typescript
          entry: demo
          prompt: "Реализуйте consistent hashing: кольцо с виртуальными узлами на FNV-1a из урока, распределение ключей, добавление и удаление узлов со счётом переехавших ключей."
          starter: |
            function fnv1a(str: string): number {
              let hash = 0x811c9dc5;
              for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193) >>> 0;
              }
              return hash >>> 0;
            }

            // Точка кольца и хеш ключа — двойной хеш (см. урок).
            const point = (s: string): number => fnv1a(fnv1a(s).toString(16));

            type Change = { op: "add" | "remove"; node: string };
            type Result = {
              initial: Record<string, string>;
              steps: { node: string; op: string; moved: number }[];
              final: Record<string, string>;
            };

            export function demo(
              nodes: string[],
              vnodes: number,
              keys: string[],
              changes: Change[],
            ): Result {
              // ...
              return { initial: {}, steps: [], final: {} };
            }
          cases:
            - args:
                - ["alpha", "beta", "gamma"]
                - 50
                - ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9", "s10"]
                - - { op: "add", node: "delta" }
                  - { op: "remove", node: "beta" }
            - args:
                - ["n1", "n2"]
                - 100
                - ["k1", "k2", "k3", "k4", "k5", "k6", "k7", "k8"]
                - []
            - args:
                - ["one"]
                - 10
                - ["a", "b", "c"]
                - - { op: "add", node: "two" }
          solution: |
            function fnv1a(str: string): number {
              let hash = 0x811c9dc5;
              for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193) >>> 0;
              }
              return hash >>> 0;
            }

            type Change = { op: "add" | "remove"; node: string };
            type Result = {
              initial: Record<string, string>;
              steps: { node: string; op: string; moved: number }[];
              final: Record<string, string>;
            };

            const point = (s: string): number => fnv1a(fnv1a(s).toString(16));

            function buildRing(nodes: string[], vnodes: number): [number, string][] {
              const ring: [number, string][] = [];
              for (const node of nodes) {
                for (let i = 0; i < vnodes; i++) {
                  ring.push([point(`${node}#${i}`), node]);
                }
              }
              ring.sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : 1));
              return ring;
            }

            function assign(ring: [number, string][], keys: string[]): Record<string, string> {
              const result: Record<string, string> = {};
              for (const key of keys) {
                const h = point(key);
                const entry = ring.find(([ph]) => ph >= h) ?? ring[0];
                result[key] = entry[1];
              }
              return result;
            }

            export function demo(
              nodes: string[],
              vnodes: number,
              keys: string[],
              changes: Change[],
            ): Result {
              let current = [...nodes];
              let mapping = assign(buildRing(current, vnodes), keys);
              const initial = { ...mapping };
              const steps: { node: string; op: string; moved: number }[] = [];

              for (const change of changes) {
                current =
                  change.op === "add"
                    ? [...current, change.node]
                    : current.filter((n) => n !== change.node);
                const next = assign(buildRing(current, vnodes), keys);
                let moved = 0;
                for (const key of keys) if (next[key] !== mapping[key]) moved++;
                steps.push({ node: change.node, op: change.op, moved });
                mapping = next;
              }
              return { initial, steps, final: mapping };
            }
