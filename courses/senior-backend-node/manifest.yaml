      - id: nest-di-modules
        title: "NestJS: модули, провайдеры, DI и scope"
        content: lessons/http/nest-di-modules.md
        quiz:
          question: "В Nest-сервисе провайдеру справочников добавили Scope.REQUEST, чтобы хранить в нём данные текущего оператора. После деплоя латентность заметно выросла. Почему?"
          options:
            - id: contagious
              text: "Request-scope заразен: все зависящие провайдеры вплоть до контроллера стали пересоздаваться на каждый запрос"
              correct: true
            - id: cache-miss
              text: "Из-за request-scope перестал работать кэш справочников в этом провайдере, и каждый запрос ходит в базу"
              explanation: "Это тоже случится — состояние синглтона умирает вместе с ним, — но вопрос про механику Nest: главная цена request-scope в том, что весь граф зависимых провайдеров пересоздаётся на каждый запрос, а не только этот класс."
            - id: threads
