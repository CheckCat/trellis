        content: lessons/ops/ops-logging.md
        quiz:
          question: "Сервис оформляет отказ «дневной лимит по карте исчерпан» как logger.error с полным телом запроса. Что здесь не так с точки зрения эксплуатации?"
          options:
            - id: both
              text: "Штатный бизнес-отказ: error зашумляет алёрты, а тело тащит в логи персональные данные"
              correct: true
            - id: fine
              text: "Всё верно: отказ — это ошибка, а полное тело поможет разбираться"
              explanation: "Система отработала правильно — лимит и должен отказывать; error-уровень для штатных отказов приучает дежурных игнорировать алёрты. А тело запроса с данными карты в логах — находка для аудита, а не помощь."
            - id: level-only
              text: "Проблема только в уровне: сменить на warn — и всё в порядке"
              explanation: "Уровень — половина беды. Полное тело запроса в банковском сервисе — это номера карт и персональные данные в логах, у которых другой контур доступа. Чувствительные поля маскируются центральной настройкой."
            - id: debug-only
              text: "Нужно перевести в debug, чтобы в проде строка вообще не писалась"
              explanation: "Совсем прятать бизнес-отказы тоже неправильно: по их частоте видят аномалии (всплеск отказов лимита — сигнал). Warn/info с маскированными полями — информативно и безопасно."
      - id: ops-metrics-tracing
        title: "Метрики RED и USE, гистограммы, OpenTelemetry и трейсинг"
        content: lessons/ops/ops-metrics-tracing.md
        quiz:
          question: "Нужен общий p99 латентности по восьми инстансам BFF. Каждый инстанс уже считает свой p99. Как получить правильное общее число?"
          options:
            - id: histogram
              text: "Никак из готовых p99: агрегируются гистограммы с общими бакетами, p99 считается по их сумме"
              correct: true
            - id: average
              text: "Усреднить восемь p99 — при равной нагрузке инстансов это точный результат"
              explanation: "Перцентиль — свойство всего распределения, а не аддитивная величина: среднее восьми p99 не равно p99 объединённой выборки ни при какой балансировке. Агрегируемы гистограммы, не перцентили."
            - id: max
              text: "Взять максимум из восьми p99 — консервативная, но честная оценка"
              explanation: "Максимум — это верхняя граница, а не оценка: один инстанс с редкими медленными запросами задерёт общее число, хотя доля таких запросов во всём трафике ничтожна. Честное число даёт только объединение распределений."
            - id: weighted
              text: "Взвесить p99 по числу запросов каждого инстанса — взвешенное среднее корректно"
              explanation: "Взвешивание не спасает: даже с весами это по-прежнему среднее перцентилей, а не перцентиль объединения. Контрпример строится из двух инстансов с разными распределениями за минуту."
      - id: ops-practice-percentiles
        title: "Практика: перцентили и гистограмма из выборки задержек"
        content: lessons/ops/ops-practice-percentiles.md
        practice:
          type: code
          language: typescript
          entry: analyze
          prompt: "Реализуйте analyze(latencies, percentiles, buckets): перцентили методом ближайшего ранга (ceil(p/100·N), ранги с 1) и кумулятивную гистограмму со строковыми le и +Inf."
          starter: |
            export function analyze(
              latencies: number[],
              percentiles: number[],
              buckets: number[],
            ): {
              count: number;
              percentiles: Record<string, number>;
              histogram: { le: string; count: number }[];
            } {
              // ...
              return { count: 0, percentiles: {}, histogram: [] };
            }
          cases:
            - args:
                - [120, 45, 250, 45, 80, 130, 500, 90, 60, 110]
                - [50, 90, 99]
                - [50, 100, 200]
              expected:
                count: 10
                percentiles: { p50: 90, p90: 250, p99: 500 }
                histogram:
                  - { le: "50", count: 2 }
                  - { le: "100", count: 5 }
                  - { le: "200", count: 8 }
                  - { le: "+Inf", count: 10 }
            - args:
                - [42]
                - [50, 99, 100]
                - [10, 100]
              expected:
                count: 1
                percentiles: { p50: 42, p99: 42, p100: 42 }
                histogram:
                  - { le: "10", count: 0 }
                  - { le: "100", count: 1 }
                  - { le: "+Inf", count: 1 }
            - args:
                - [100, 100, 100, 200]
                - [50, 100]
                - [100, 150]
              expected:
                count: 4
                percentiles: { p50: 100, p100: 200 }
                histogram:
                  - { le: "100", count: 3 }
                  - { le: "150", count: 3 }
                  - { le: "+Inf", count: 4 }
            - args:
                - []
                - [50]
                - [100]
              expected:
                count: 0
                percentiles: {}
                histogram:
                  - { le: "100", count: 0 }
                  - { le: "+Inf", count: 0 }
          solution: |
            export function analyze(
              latencies: number[],
              percentiles: number[],
              buckets: number[],
            ): {
              count: number;
              percentiles: Record<string, number>;
              histogram: { le: string; count: number }[];
            } {
              const sorted = [...latencies].sort((a, b) => a - b);
              const n = sorted.length;

              const pct: Record<string, number> = {};
              if (n > 0) {
                for (const p of percentiles) {
                  const rank = Math.max(1, Math.ceil((p / 100) * n));
                  pct[`p${p}`] = sorted[Math.min(rank, n) - 1];
                }
              }

              const histogram = buckets.map((b) => ({
                le: String(b),
                count: sorted.filter((v) => v <= b).length,
              }));
              histogram.push({ le: "+Inf", count: n });

              return { count: n, percentiles: pct, histogram };
            }
      - id: ops-docker-k8s
        title: "Docker и Kubernetes для Node: образ, сигналы, лимиты, probes, HPA"
        content: lessons/ops/ops-docker-k8s.md
        quiz:
          question: "Postgres лёг на две минуты, и за это время Kubernetes перезапустил все поды cases по кругу, чем растянул инцидент. Выяснилось: liveness-проба сервиса делает SELECT 1 в базу. В чём ошибка?"
          options:
            - id: liveness-dep
              text: "Зависимость в liveness превращает сбой базы в рестарт-шторм; база — забота readiness"
              correct: true
            - id: correct-probe
              text: "Проба верная: без базы сервис бесполезен, и рестарт — честная реакция"
              explanation: "Бесполезен — значит не готов принимать трафик (readiness убирает из балансировки), но процесс-то здоров, и рестарт его не вылечит: после рестарта база всё так же лежит, а под ещё и потерял прогретые кэши и соединения."
            - id: timeout-small
              text: "Ошибка в таймауте пробы: SELECT 1 надо давать больше времени при деградации базы"
              explanation: "Увеличение таймаута лишь отсрочит рестарты. Принципиальная ошибка в самой зависимости: liveness с внешней системой связывает судьбу процесса с чужим сбоем."
            - id: startup-fix
              text: "Нужно было добавить startup-пробу — она бы защитила поды от рестартов при сбое базы"
              explanation: "Startup-проба защищает только период запуска (пока не пройдена, liveness не проверяется). Сбой базы случился у давно работающих подов — там startup уже не участвует."
      - id: ops-config-releases
        title: "Конфигурация, секреты, CI/CD, canary, blue-green и откаты"
        content: lessons/ops/ops-config-releases.md
        quiz:
          question: "Команда «тщательно протестировала» сборку на стенде, а для прода собирает образ заново с прод-конфигом внутри. Что здесь неправильно по дисциплине поставки?"
          options:
            - id: artifact
              text: "В прод едет другой артефакт, чем тестировали; образ должен быть один, а конфигурация — из окружения"
              correct: true
            - id: ok-config
              text: "Всё нормально: конфиг прода секретный, и вшить его в образ безопаснее, чем возить отдельно"
              explanation: "Вшитый в образ секрет доступен каждому, кто может скачать образ из registry, — это хуже, а не безопаснее. Секреты живут в хранилище и приходят в окружение при запуске."
            - id: cache
              text: "Проблема лишь в скорости: пересборка тратит время CI, но на корректность не влияет"
              explanation: "Влияет на самое главное: пересобранный образ — другие байты (обновившиеся зависимости, другой порядок слоёв), и в прод уходит то, чего никто не видел. Тестировали одно — выкатили другое."
            - id: tag
              text: "Не хватает тега latest на прод-образе, чтобы всегда знать, что развёрнуто"
              explanation: "Latest — как раз антипаттерн: он указывает на разное в разное время. Образ помечается неизменяемым тегом (SHA коммита), и один этот артефакт проходит стенд и прод."
      - id: ops-incidents
        title: "Инциденты: дежурство, runbook, postmortem, отладка в проде"
        content: lessons/ops/ops-incidents.md
        quiz:
          question: "Ночью p99 экрана обращений вырос в десять раз через полчаса после деплоя. Дежурный два часа искал причину в коде, найдя её к четырём утра. Что было правильным действием по инцидент-процессу?"
          options:
            - id: rollback-first
              text: "Сначала восстановить: откатить свежий деплой немедленно, сохранив улики, — диагноз искать при свете дня по постмортему"
              correct: true
            - id: debug-ok
              text: "Дежурный прав: без понимания причины откат опасен — вдруг дело не в деплое"
              explanation: "Откат недавнего деплоя — самое безопасное из грубых действий (совместимость на версию назад — часть дисциплины поставки), а корреляция по времени делает его первым кандидатом. Два часа деградации — цена перфекционизма."
            - id: restart-all
              text: "Перезапустить все поды: свежий процесс снимает большинство проблем быстрее отката"
              explanation: "Рестарт лечит утечки и зависания, но не изменение кода: новый под запустит тот же деплой с той же регрессией. Первое действие при корреляции с выкатом — откат выката."
            - id: wait-morning
              text: "Снизить severity и дождаться утра: ночью меняют прод только в крайнем случае"
              explanation: "Деградация рабочего инструмента — и есть тот случай: severity задан заранее, и он определяет, что чинится немедленно. «Не трогать прод ночью» относится к рискованным изменениям, а откат — штатная операция с одной командой."
      - id: ops-testing
        title: "Тестирование бэкенда: пирамида, testcontainers, контрактные тесты, что мокать"
        content: lessons/ops/ops-testing.md
        quiz:
          question: "В «интеграционном» тесте создания обращения репозиторий замокан: проверяется, что сервис вызвал save с нужными полями. На проде вставка падает по уникальному индексу, тест зелёный. Что не так с тестом?"
          options:
            - id: real-db
              text: "Мокнув свою базу, тест проверяет мок: SQL, индексы и транзакции не участвуют; интеграционный тест ходит в настоящий Postgres — testcontainers"
              correct: true
            - id: more-mocks
              text: "Мок недостаточно точный: нужно научить его бросать ошибку уникальности как настоящая база"
              explanation: "Дублировать поведение Postgres в моке — переписывать базу руками и вечно отставать от правды. Правда о SQL и ограничениях живёт только в самой базе — её и поднимают в тесте контейнером."
            - id: e2e-only
              text: "Такое ловится только полным e2e со всеми сервисами — юнит- и интеграционным тестам это недоступно"
              explanation: "Полный e2e не нужен: интеграционный тест одного сервиса с настоящей базой ловит нарушение индекса за секунды. E2e оставляют для сквозных сценариев, а не для проверки SQL."
            - id: verify-more
              text: "Нужно строже проверять вызовы: не только save, но и порядок всех методов репозитория"
              explanation: "Проверка порядка вызовов привязывает тест к реализации и не приближает к реальной базе ни на шаг: мок по-прежнему не знает про индексы. Проверять надо результат и состояние, а стык с базой — интеграционно."

  - id: interview
    title: "Модуль 12. Собеседование"
    lessons:
      - id: iv-format
        title: "Как устроено собеседование сеньора и что оценивают"
        content: lessons/interview/iv-format.md
      - id: iv-story
        title: "Рассказ об опыте: BFF, контракты, инциденты — честно и убедительно"
        content: lessons/interview/iv-story.md
      - id: iv-design-method
        title: "Метод ответа на system design"
        content: lessons/interview/iv-design-method.md
        quiz:
          question: "System design начался с условия «спроектируйте систему уведомлений». Кандидат тут же рисует Kafka, три сервиса и Cassandra. Что не так с этим стартом?"
          options:
            - id: req-first
              text: "Решение до требований: не выяснены сценарии, объёмы и ограничения — выбор технологий пока ничем не обоснован, и это главный красный флаг секции"
              correct: true
            - id: wrong-tech
              text: "Набор технологий неверный: для уведомлений нужен RabbitMQ, а не Kafka"
              explanation: "Может быть, и Rabbit — но это неизвестно, пока не выяснены объёмы, потребители и гарантии. Ошибка не в конкретном выборе, а в том, что любой выбор сейчас преждевременен."
            - id: fine-start
              text: "Нормальный старт: опытный инженер сразу видит типовую архитектуру, а детали уточнит по ходу"
              explanation: "Интервьюер оценивает, как кандидат сужает неопределённость, — прыжок к ответу показывает обратное. Типовая архитектура без чисел и сценариев — это шаблон, а не проектирование."
            - id: no-drawing
              text: "Рисовать вообще не стоило: system design — устная секция, схемы отвлекают"
              explanation: "Схема — главный рабочий инструмент секции; вопрос в моменте её появления: после требований и оценок, когда у каждого блока есть причина."
      - id: iv-design-operator-platform
        title: "Кейс: спроектировать операторскую платформу"
        content: lessons/interview/iv-design-operator-platform.md
        quiz:
          question: "В кейсе операторской платформы интервьюер спрашивает: «Почему сессии операторов в Redis, а не самодостаточный JWT на 8 часов — дешевле же, без похода в хранилище?» Какой ответ попадает в суть?"
          options:
            - id: revoke
              text: "Мгновенный отзыв — банковское требование; цена похода в Redis при наших RPS ничтожна"
              correct: true
            - id: faster
              text: "Redis быстрее проверки подписи JWT, поэтому сессии ещё и производительнее"
              explanation: "Проверка подписи — микросекунды локального CPU, поход в Redis — сетевой вызов: по скорости JWT как раз выигрывает. Аргумент за сессии — контроль и отзыв, и честный ответ признаёт эту цену."
            - id: size
              text: "JWT слишком большой для заголовков, а session id компактен"
              explanation: "Размер токена — сотни байт, для внутренних запросов это не аргумент. Решающее свойство — управляемость: список сессий, выборочный отзыв, «выйти везде»."
            - id: standard
              text: "Сессии — более старый и проверенный стандарт, а JWT — мода"
              explanation: "Возраст технологии — не аргумент в trade-off-е. Ответ сеньора выводится из требования предметной области: мгновенная отзывность доступа в банке."
      - id: iv-design-bulk-ops
        title: "Кейс: массовые операции и регламентные выгрузки"
        content: lessons/interview/iv-design-bulk-ops.md
        quiz:
          question: "В кейсе массовых операций один документ с битыми данными валит обработчик, и его пачка бесконечно повторяется, стопоря операцию. Какой приём разбирает эту ситуацию?"
          options:
            - id: bisect
              text: "Лимит попыток пачки и деление её пополам до изоляции ядовитого объекта: он уходит в отчёт с причиной, остальные обрабатываются"
              correct: true
            - id: skip-chunk
              text: "После N неудач пропустить пачку целиком — операция завершится, а хвост доделают вручную"
              explanation: "Вместе с одним битым документом молча выпадут сотни здоровых из той же пачки. Деление пополам изолирует виновника ценой лога попыток, не жертвуя соседями."
            - id: tx-all
              text: "Обернуть операцию в одну транзакцию: битый документ откатит всё, и данные останутся чистыми"
              explanation: "Мегатранзакция на десятки минут — блокировки и WAL (модуль Postgres), а результат — «всё или ничего»: один документ отменяет работу над 50 тысячами. Нужна изоляция сбоя, а не капитуляция перед ним."
            - id: validate-first
              text: "Прогнать валидацию всех объектов до запуска — битые не попадут в обработку"
              explanation: "Предварительная проверка полезна, но не закрывает вопрос: часть отказов проявляется только при выполнении (состояние изменилось, внешняя система отвергла). Конвейер обязан переживать сбой объекта в рантайме."
      - id: iv-design-marketplace
        title: "Кейс: заказ и оплата в маркетплейсе"
        content: lessons/interview/iv-design-marketplace.md
        quiz:
          question: "Вызов платёжного провайдера завершился таймаутом. Кандидат предлагает: «считаем платёж неуспешным, снимаем резерв, показываем клиенту ошибку». Что с этим решением?"
          options:
            - id: unknown
              text: "Таймаут — «неизвестно», не «нет»: статус-запрос, вебхук и сверка вместо слепой компенсации"
              correct: true
            - id: ok-cancel
              text: "Решение верное: раз ответа нет, платёж не считается совершённым, а клиент повторит оплату"
              explanation: "Если списание прошло, а мы отменили заказ и клиент «повторил», получится двойное списание — худший исход платёжной системы. Неопределённость обрабатывается выяснением, не предположением."
            - id: retry-now
              text: "Нужно просто немедленно повторить вызов — идемпотентность провайдера защитит от дублей"
              explanation: "Ключ идемпотентности действительно защищает повтор — но немедленный ретрай в деградировавшего провайдера и отсутствие статуса «выясняем» это не решение целиком: нужен статус-запрос, вебхук и сверка как системный путь."
            - id: sync-wait
              text: "Держать HTTP-запрос клиента открытым, пока провайдер не ответит окончательно"
              explanation: "Провайдер может отвечать минутами — держать соединение и поток пользователя столько нельзя (таймауты, ресурсы). Оплата после таймаута становится асинхронной: статус «обрабатывается» и честное уведомление."
      - id: iv-practice-broker
        title: "Финальная практика: брокер сообщений в памяти с consumer group"
        content: lessons/interview/iv-practice-broker.md
        practice:
          type: code
