              explanation: "Pipe получает аргументы обработчика и отвечает за их форму — вернёт 400 там, где нужен 403. Вопрос допуска — контракт guard, у которого к тому же есть доступ к метаданным маршрута."
            - id: interceptor
              text: "В interceptor: он оборачивает обработчик и может не вызвать его, если роль не подходит"
