name: trellis

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trellis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Читаются init-скриптом (00-init.sh) для создания ролей приложения и
      # песочницы — пароли не попадают в .sql, только в psql-переменные.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD}
    volumes:
      - trellis_pgdata:/var/lib/postgresql/data
      # Сам скрипт — единственный .sh в /docker-entrypoint-initdb.d, его
      # запускает entrypoint официального образа.
      - ./docker/postgres/init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # .sql-файлы НЕ кладём в /docker-entrypoint-initdb.d: entrypoint прогнал
      # бы их сам повторно, уже без psql-переменных с паролями, и упал бы.
      # 00-init.sh читает их отсюда через psql -f.
      - ./docker/postgres/init:/sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trellis"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Первый в жизни тома запуск — это полный initdb плюс прогон
      # docker/postgres/init/*.sql, и на холодной/загруженной машине он
      # заметно дольше прогретого. start_period — это ровно «сколько
      # контейнеру позволено становиться готовым»: неудачные проверки в
      # этом окне не считаются, а первая успешная сразу делает сервис
      # healthy. Держать окно коротким смысла нет — платой за запас
      # является только задержка сообщения о по-настоящему сломанном
      # сервисе, а ценой его нехватки был бы ложный «unhealthy» на
      # медленной машине.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://trellis_app:${APP_DB_PASSWORD}@postgres:5432/trellis
      SANDBOX_DATABASE_URL: postgres://trellis_sandbox:${SANDBOX_DB_PASSWORD}@postgres:5432/trellis
      COURSES_DIR: /courses
    volumes:
      - ./courses:/courses:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node всегда есть в образе backend (см. Dockerfile-правила
      # devops-engineer) — не полагаемся на curl/wget, которых может не быть
      # в базовом node:22-alpine.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Backend становится готов не мгновенно: дождаться healthy-postgres,
      # прогнать миграции, поднять Node. На холодной базе это единственный
      # длинный шаг во всём стеке — см. комментарий у postgres выше.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      # Deliberately service_started, not service_healthy: task 004 built a
      # dedicated "core unreachable" screen for exactly the case where the
      # backend is down, but that screen only ever renders if the frontend
      # container itself is allowed to come up while backend is unhealthy.
      # With service_healthy, a backend stuck unhealthy at cold start (e.g.
      # wrong DB password, see Important 3) leaves frontend in `Created`
      # forever and the user gets a browser connection-refused page instead
      # of the app's own honest error state (see final-review fixes report).
      backend:
        condition: service_started
    healthcheck:
      # /api/health (not just /) so "healthy" means "nginx is up AND the
      # backend is reachable through it" — nginx being alive while the
      # proxied backend is unreachable/stale (see the `resolver` fix in
      # nginx.conf) used to read as healthy under a bare `/` check, which is
      # exactly the silently-broken state the final-review Critical finding
      # was about. Предполагаем статический веб-сервер на базе alpine
      # (nginx:alpine и подобные несут busybox wget) — контракт для задачи
      # 004, см. отчёт.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Самое длинное окно в стеке, и вот почему. Эта проверка намеренно
      # ходит СКВОЗЬ nginx в backend (см. комментарий к `test` выше), а
      # зависимость от backend — намеренно `service_started`, а не
      # `service_healthy` (см. depends_on). Значит frontend стартует
      # одновременно с backend и обязан дождаться, пока тот поднимется,
      # причём отсчёт идёт от старта СВОЕГО контейнера.
      #
      # При start_period: 10s бюджет составлял 10s + 5x10s = ~51 секунду
      # (замерено), после чего контейнер объявлялся unhealthy НАВСЕГДА —
      # а `docker compose up --wait` прекращает ожидание на первом же
      # unhealthy, не дожидаясь восстановления. Любой холодный старт
      # длиннее 51 секунды (первый initdb, загруженная машина, медленный
      # диск) ронял и сквозной тест, и пользовательский запуск, хотя через
      # несколько секунд стек был бы полностью рабочим.
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  trellis_pgdata:
    name: trellis_pgdata
