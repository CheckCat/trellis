name: trellis

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trellis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Читаются init-скриптом (00-init.sh) для создания ролей приложения и
      # песочницы — пароли не попадают в .sql, только в psql-переменные.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD}
    volumes:
      - trellis_pgdata:/var/lib/postgresql/data
      # Сам скрипт — единственный .sh в /docker-entrypoint-initdb.d, его
      # запускает entrypoint официального образа.
      - ./docker/postgres/init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # .sql-файлы НЕ кладём в /docker-entrypoint-initdb.d: entrypoint прогнал
      # бы их сам повторно, уже без psql-переменных с паролями, и упал бы.
      # 00-init.sh читает их отсюда через psql -f.
      - ./docker/postgres/init:/sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trellis"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://trellis_app:${APP_DB_PASSWORD}@postgres:5432/trellis
      SANDBOX_DATABASE_URL: postgres://trellis_sandbox:${SANDBOX_DB_PASSWORD}@postgres:5432/trellis
      COURSES_DIR: /courses
    volumes:
      - ./courses:/courses:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node всегда есть в образе backend (см. Dockerfile-правила
      # devops-engineer) — не полагаемся на curl/wget, которых может не быть
      # в базовом node:22-alpine.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Предполагаем статический веб-сервер на базе alpine (nginx:alpine и
      # подобные несут busybox wget) — контракт для задачи 004, см. отчёт.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  trellis_pgdata:
    name: trellis_pgdata
